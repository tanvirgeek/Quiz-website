<title>IELTS Grammar Quiz: Road to Band 8</title>
<meta name="description" content="Free IELTS grammar quizzes from beginner to Band 8, one for every lecture sheet. IELTS &amp; GRE with Tanvir, BUET.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sheet picker grouped by level, then one large question card per screen for screen recording. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F8; --ink:#14171F; --text:#1F2530; --muted:#4F5969; --line:#D5DAE1;
  --accent:#C24E16; --accent-ink:#FFFFFF; --tint:#FCEFE6;
  --good:#1B7448; --good-bg:#E4F3EA; --bad:#B3261E; --bad-bg:#FBE9E7;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181C23; --ink:#F2F4F7; --text:#E3E7ED; --muted:#A8B1BF; --line:#2E3541;
  --accent:#F08A52; --accent-ink:#1A1109; --tint:#2A1D15;
  --good:#6CCB97; --good-bg:#14281D; --bad:#F59A92; --bad-bg:#2B1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --ink:#F2F4F7; --text:#E3E7ED; --muted:#A8B1BF; --line:#2E3541;
  --accent:#F08A52; --accent-ink:#1A1109; --tint:#2A1D15;
  --good:#6CCB97; --good-bg:#14281D; --bad:#F59A92; --bad-bg:#2B1715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration-thickness:3px;text-decoration-color:var(--accent);text-underline-offset:5px}

/* home */
.top{display:flex;align-items:center;gap:12px;padding-block:20px}
.top img{width:44px;height:44px;border-radius:10px}
.top b{display:block;font-size:15px;color:var(--ink);line-height:1.2}
.top span{font-size:13px;color:var(--muted)}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:8px 0 8px;color:var(--ink);letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 28px;color:var(--muted);max-width:60ch}
.level{margin-block:0 36px}
.level h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;font-weight:600;
  display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.level h2 em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;min-width:0;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile .n{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tile .t{font-weight:600;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.tile .sc{margin-top:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.done .sc{color:var(--good);font-weight:600}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.bar-title{font-weight:600;color:var(--ink);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-title small{color:var(--muted);font-weight:500;margin-right:6px}
.count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);white-space:nowrap}
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--accent)}
.card{margin-top:28px}
.gh{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
.gh span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:14px}
.gi{color:var(--muted);margin:6px 0 0;font-size:15.5px}
.q{font-size:clamp(24px,3.8vw,38px);line-height:1.4;color:var(--ink);margin:30px 0 28px;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.q .qn{color:var(--accent);font-weight:700;margin-right:12px;font-variant-numeric:tabular-nums}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 .12em;text-align:center;padding:0 .2em;font-weight:700}
.blank.ok{color:var(--good);border-color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border:2px solid var(--line);background:var(--surface);
  border-radius:12px;font-size:clamp(19px,2.4vw,24px);font-weight:500;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.opt kbd{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);
  background:var(--bg);font:600 13px var(--font);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{margin-top:22px;padding:16px 18px;border-radius:12px;font-size:clamp(17px,2.2vw,22px);line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.fb.ok{background:var(--good-bg);border-left:6px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb.ans{background:var(--tint);border-left:6px solid var(--accent)}
.fb b.lab{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.fb.ok b.lab{color:var(--good)} .fb.no b.lab{color:var(--bad)} .fb.ans b.lab{color:var(--accent)}
.fb i{color:var(--muted);font-size:.85em}
.fb .why{display:block;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.12);font-size:.82em;line-height:1.55}
.fb .why b.wl{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;font-weight:700;color:var(--muted)}
.fb .why i{color:inherit;font-size:1em;font-style:italic}
.fb .pk{display:block;margin-bottom:6px}
.act{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-bottom:40px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 24px;font-size:18px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--muted);font-size:13.5px;align-self:center}

/* result */
.res{text-align:center;padding-block:40px}
.big{font-size:clamp(64px,14vw,120px);font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.38em;color:var(--muted);font-weight:500}
.verdict{font-size:clamp(20px,3vw,28px);margin:14px auto 24px;max-width:28ch;color:var(--ink);text-wrap:balance}
.res .act{justify-content:center}
.rev{text-align:left;margin-top:12px;display:grid;gap:10px}
.rev h3{margin:28px 0 4px;font-size:15px;color:var(--ink)}
.ri{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere}
.ri small{color:var(--accent);font-weight:700;margin-right:8px}
.ri div+div{margin-top:6px;color:var(--good);font-weight:500}
.mine{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--tint);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 18px;margin:0 0 14px}
.mine>div{flex:1 1 260px;min-width:0}
.mine b{display:block;color:var(--ink);font-size:17px}
.mine span{color:var(--muted);font-size:14.5px}
.mine .btn{padding:10px 18px;font-size:16px}
.mine .btn:disabled{opacity:.45;cursor:default}
.warn{background:var(--bad-bg);border-left-color:var(--bad)}
details.bk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 18px;margin:0 0 28px}
details.bk summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.bk p{color:var(--muted);font-size:14.5px;margin:10px 0}
.bkrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.bkrow .btn{padding:9px 16px;font-size:15px}
details.bk textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px}
#bkmsg{font-weight:600;color:var(--good);margin:8px 0 0;font-size:14.5px}
.saved{color:var(--muted);margin:-6px auto 18px;max-width:46ch}
@media (prefers-reduced-motion:no-preference){.opt,.tile,.btn{transition:border-color .12s,background .12s}}
</style>

k\" data-blank><\/span> at ten every day except Monday.", "ans": "opens <i>(fixed schedule)<\/i>", "type": "mcq", "opts": ["opens", "is opening", "will open"], "a": 0, "x": "A fixed public schedule takes the present simple: <i>opens at ten every day<\/i>. <i>Is opening<\/i> sounds like a one-time future arrangement, and <i>will open<\/i> is a prediction. Neither fits a regular timetable."}, {"h": "My roommate <span class=\"blank\" data-blank><\/span> dirty plates in the sink, and it is driving me mad.", "ans": "is always leaving <i>(always + continuous: repeated annoyance)<\/i>", "type": "mcq", "opts": ["always leave", "is always leaving", "always left"], "a": 1, "x": "With <i>always<\/i>, the present continuous expresses annoyance at a repeated habit: <i>is always leaving<\/i>. <i>Always leave<\/i> is wrong because <i>my roommate<\/i> is third person singular and needs <i>-s<\/i>. <i>Always left<\/i> is past, but the problem continues now (<i>it is driving me mad<\/i>)."}, {"h": "I <span class=\"blank\" data-blank><\/span> why the results changed so suddenly. Can you explain?", "ans": "don't understand <i>(understand is stative)<\/i>", "type": "mcq", "opts": ["am not understanding", "did not understand", "don't understand"], "a": 2, "x": "<i>Understand<\/i> is a stative verb, so it is not used in the continuous: <i>am not understanding<\/i> is a very common mistake. The next sentence (<i>Can you explain?<\/i>) shows the problem is present, so <i>did not understand<\/i> does not fit."}, {"h": "Look at these figures: online shopping <span class=\"blank\" data-blank><\/span> more popular among people over sixty.", "ans": "is becoming <i>(a change in progress)<\/i>", "type": "mcq", "opts": ["is becoming", "becomes", "became"], "a": 0, "x": "<i>Look at these figures<\/i> shows a change that is happening now, so use the present continuous for a trend in progress. <i>Becomes<\/i> states a general fact, and <i>became<\/i> would need a finished past period."}, {"h": "How often <span class=\"blank\" data-blank><\/span> your email at work?", "ans": "do you check <i>(habit: how often)<\/i>", "type": "mcq", "opts": ["are you checking", "do you check", "have you checked"], "a": 1, "x": "<i>How often<\/i> asks about a habit, so use the present simple question <i>do you check<\/i>. The continuous <i>are you checking<\/i> asks what is happening at this moment, and <i>have you checked<\/i> asks about a result up to now."}, {"h": "Please don't offer him a cigarette. He <span class=\"blank\" data-blank><\/span>.", "ans": "doesn't smoke <i>(a permanent fact about him)<\/i>", "type": "mcq", "opts": ["isn't smoking", "didn't smoke", "doesn't smoke"], "a": 2, "x": "Not smoking is a permanent fact about him, so the present simple <i>doesn't smoke<\/i> is right. <i>Isn't smoking<\/i> would only mean he is not smoking at this moment, and <i>didn't smoke<\/i> talks about the past."}, {"h": "I'm sorry, I can't join the call. I <span class=\"blank\" data-blank><\/span> to the airport right now.", "ans": "am driving <i>(happening now)<\/i>", "type": "mcq", "opts": ["am driving", "drive", "have driven"], "a": 0, "x": "<i>Right now<\/i> and the reason for not joining the call show an action in progress: <i>am driving<\/i>. <i>Drive<\/i> would describe a habit, and <i>have driven<\/i> would mean the journey is already finished."}]}, {"l": "B", "t": "Stative verbs: state or action?", "i": "Choose the correct option.", "q": [{"h": "I <span class=\"blank\" data-blank><\/span> the new timetable, because lectures start far too early.", "ans": "do not like <i>(like is stative)<\/i>", "type": "mcq", "opts": ["do not like", "am not liking", "have not liked"], "a": 0, "x": "<i>Like<\/i> is a stative verb (a feeling), so it takes the simple form: <i>do not like<\/i>. <i>Am not liking<\/i> is a classic mistake. <i>Have not liked<\/i> suggests a longer period up to now, which the sentence does not describe."}, {"h": "She <span class=\"blank\" data-blank><\/span> a flat in Gulshan and a house in Sylhet.", "ans": "has <i>(have = own: stative)<\/i>", "type": "mcq", "opts": ["is having", "has", "is has"], "a": 1, "x": "<i>Have<\/i> meaning <i>own<\/i> is stative and never takes the continuous: <i>She has a flat<\/i>. <i>Is having<\/i> is only possible for actions such as eating or experiencing (<i>She is having lunch<\/i>), and <i>is has<\/i> mixes two verb forms."}, {"h": "Why <span class=\"blank\" data-blank><\/span> at me like that? Is something wrong?", "ans": "are you looking <i>(look = an action happening now)<\/i>", "type": "mcq", "opts": ["do you look", "have you looked", "are you looking"], "a": 2, "x": "Looking at someone is a deliberate action happening now, so the continuous is correct: <i>are you looking<\/i>. <i>Do you look<\/i> would ask about your general appearance, and <i>have you looked<\/i> asks about a completed action."}, {"h": "This soup <span class=\"blank\" data-blank><\/span> strange. Did you add sugar instead of salt?", "ans": "tastes <i>(taste = its flavour: stative)<\/i>", "type": "mcq", "opts": ["tastes", "is tasting", "has tasted"], "a": 0, "x": "Here <i>taste<\/i> describes the quality of the soup (its flavour), which is a state. States take the simple form: <i>tastes strange<\/i>. The continuous <i>is tasting<\/i> is for someone actively tasting something."}, {"h": "Be quiet for a moment. The chef <span class=\"blank\" data-blank><\/span> the sauce to check the seasoning.", "ans": "is tasting <i>(taste = an action in progress)<\/i>", "type": "mcq", "opts": ["tastes", "is tasting", "has tasted"], "a": 1, "x": "Here the chef is performing an action (testing the sauce) right now, so <i>taste<\/i> is an action verb and the continuous is correct. Compare: <i>The sauce tastes salty<\/i> (state) but <i>The chef is tasting the sauce<\/i> (action)."}, {"h": "I <span class=\"blank\" data-blank><\/span> that remote work is more productive than office work.", "ans": "think <i>(think = opinion: stative)<\/i>", "type": "mcq", "opts": ["am thinking", "have thought", "think"], "a": 2, "x": "<i>Think<\/i> meaning <i>have an opinion<\/i> is stative: <i>I think that…<\/i>. <i>I am thinking that<\/i> sounds unnatural for an opinion. Save the continuous for the process of thinking (<i>I am thinking about my future<\/i>)."}, {"h": "The committee <span class=\"blank\" data-blank><\/span> about changing the entry requirements, but nothing has been decided.", "ans": "is thinking <i>(think = a process in progress)<\/i>", "type": "mcq", "opts": ["is thinking", "thinks", "thought"], "a": 0, "x": "<i>Think about<\/i> describes a mental process in progress, so the continuous <i>is thinking<\/i> is right (compare opinion: <i>I think that<\/i>). <i>Thinks about<\/i> would suggest a habit, and <i>thought<\/i> is past, but the decision is still pending now."}, {"h": "I'm sorry about my brother. He <span class=\"blank\" data-blank><\/span> very rude this evening, which is not like him.", "ans": "is being <i>(be + continuous = behaving a certain way now)<\/i>", "type": "mcq", "opts": ["is", "is being", "has been"], "a": 1, "x": "<i>Be<\/i> + continuous describes temporary behaviour: <i>is being rude<\/i> means he is behaving rudely this evening. Plain <i>is rude<\/i> would describe his character, but the sentence says it is <i>not like him<\/i>. <i>Has been<\/i> would need a time period (<i>since morning<\/i>)."}, {"h": "The suitcase <span class=\"blank\" data-blank><\/span> twenty-six kilos, which is over the airline limit.", "ans": "weighs <i>(weigh = its weight: stative)<\/i>", "type": "mcq", "opts": ["is weighing", "weighed", "weighs"], "a": 2, "x": "<i>Weigh<\/i> meaning <i>have a weight<\/i> is stative, so the simple form <i>weighs<\/i> is right. The continuous <i>is weighing<\/i> is used when a person is measuring something (<i>He is weighing the suitcase<\/i>)."}, {"h": "I <span class=\"blank\" data-blank><\/span> what you mean, but I still disagree with your conclusion.", "ans": "see <i>(see = understand: stative)<\/i>", "type": "mcq", "opts": ["see", "am seeing", "saw"], "a": 0, "x": "<i>See<\/i> meaning <i>understand<\/i> is stative. We say <i>I see what you mean<\/i>, never <i>I am seeing what you mean<\/i>. <i>Saw<\/i> would put the understanding in the past, but the sentence continues in the present (<i>I still disagree<\/i>). Note: <i>I am seeing the doctor<\/i> is fine, because there <i>see<\/i> means <i>meet<\/i>."}]}, {"l": "C", "t": "Verb forms: irregular verbs and auxiliaries", "i": "Choose the correct option.", "q": [{"h": "Last quarter, exports <span class=\"blank\" data-blank><\/span> by twelve per cent.", "ans": "fell <i>(past simple of fall)<\/i>", "type": "mcq", "opts": ["fell", "fall", "fallen", "falled"], "a": 0, "x": "<i>Last quarter<\/i> is a finished time, so use the past simple of <i>fall<\/i>: <i>fell<\/i>. <i>Fallen<\/i> is the participle (it needs <i>have<\/i> or <i>has<\/i>), <i>fall<\/i> is the base form, and <i>falled<\/i> does not exist."}, {"h": "Prices have <span class=\"blank\" data-blank><\/span> steadily since the policy was introduced.", "ans": "fallen <i>(have + past participle)<\/i>", "type": "mcq", "opts": ["fell", "fallen", "falled", "fall"], "a": 1, "x": "After <i>have<\/i>, use the past participle: <i>have fallen<\/i>. <i>Fell<\/i> is the past simple form and cannot follow <i>have<\/i>. <i>Falled<\/i> adds a regular ending to an irregular verb."}, {"h": "The company has <span class=\"blank\" data-blank><\/span> millions on advertising this year.", "ans": "spent <i>(irregular participle)<\/i>", "type": "mcq", "opts": ["spended", "spend", "spent", "spents"], "a": 2, "x": "<i>Spend<\/i> is irregular: spend, spent, spent. After <i>has<\/i>, use the participle <i>spent<\/i>. <i>Spended<\/i> is a typical regularisation mistake, and <i>spend<\/i> and <i>spents<\/i> are not participles."}, {"h": "She didn't <span class=\"blank\" data-blank><\/span> the seminar because she was ill.", "ans": "attend <i>(didn't + base verb)<\/i>", "type": "mcq", "opts": ["attended", "attends", "attending", "attend"], "a": 3, "x": "After <i>didn't<\/i>, the main verb is always in the base form: <i>didn't attend<\/i>. The tense is already shown by <i>did<\/i>, so adding <i>-ed<\/i>, <i>-s<\/i> or <i>-ing<\/i> marks the tense twice."}, {"h": "If he had <span class=\"blank\" data-blank><\/span> about the delay, he would have left earlier.", "ans": "known <i>(had + past participle)<\/i>", "type": "mcq", "opts": ["known", "knew", "know", "knowed"], "a": 0, "x": "The third conditional uses <i>had + past participle<\/i>: <i>had known<\/i>. <i>Know<\/i> is irregular (know, knew, known). <i>Knew<\/i> is the past simple, <i>know<\/i> is the base form, and <i>knowed<\/i> does not exist."}, {"h": "The film was so long that half the audience had <span class=\"blank\" data-blank><\/span> home before it ended.", "ans": "gone <i>(had + past participle)<\/i>", "type": "mcq", "opts": ["went", "gone", "go", "goed"], "a": 1, "x": "<i>Go<\/i> is irregular: go, went, <i>gone<\/i>. After <i>had<\/i>, use the participle <i>gone<\/i>. <i>Went<\/i> is past simple and cannot follow <i>had<\/i>; <i>goed<\/i> does not exist."}, {"h": "Where <span class=\"blank\" data-blank><\/span> that jacket? It looks great.", "ans": "did you buy <i>(did + subject + base verb)<\/i>", "type": "mcq", "opts": ["you bought", "did you bought", "did you buy", "have you buy"], "a": 2, "x": "A past simple question uses <i>did + subject + base verb<\/i>: <i>did you buy<\/i>. <i>You bought<\/i> keeps statement word order, <i>did you bought<\/i> puts the past ending on the main verb as well as on <i>did<\/i>, and <i>have you buy<\/i> puts a base verb after <i>have<\/i>."}, {"h": "The lake has <span class=\"blank\" data-blank><\/span> completely twice this decade.", "ans": "frozen <i>(participle of freeze)<\/i>", "type": "mcq", "opts": ["froze", "freezed", "freeze", "frozen"], "a": 3, "x": "<i>Freeze<\/i> is irregular: freeze, froze, <i>frozen<\/i>. After <i>has<\/i>, use the participle <i>frozen<\/i>. <i>Froze<\/i> is past simple only, and <i>freezed<\/i> is an invented regular form."}, {"h": "In 2015, a retired professor <span class=\"blank\" data-blank><\/span> me how to structure an essay.", "ans": "taught <i>(irregular past; finished time)<\/i>", "type": "mcq", "opts": ["taught", "teached", "tought", "has taught"], "a": 0, "x": "<i>In 2015<\/i> is a finished time, so use the past simple. <i>Teach<\/i> is irregular: teach, taught, taught. <i>Teached<\/i> and <i>tought<\/i> are common form and spelling mistakes, and <i>has taught<\/i> cannot be used with a finished time like 2015."}, {"h": "Has the committee already <span class=\"blank\" data-blank><\/span> a winner?", "ans": "chosen <i>(has + past participle)<\/i>", "type": "mcq", "opts": ["choosed", "chosen", "chose", "choose"], "a": 1, "x": "<i>Has … already<\/i> needs the past participle. <i>Choose<\/i> is irregular: choose, chose, <i>chosen<\/i>. <i>Chose<\/i> is past simple only, <i>choosed<\/i> does not exist, and <i>choose<\/i> is the base form."}]}, {"l": "E", "t": "Present perfect or past simple?", "i": "Choose the correct option.", "q": [{"h": "Shakespeare <span class=\"blank\" data-blank><\/span> nearly forty plays.", "ans": "wrote <i>(he is dead: a finished period)<\/i>", "type": "mcq", "opts": ["wrote", "has written", "is writing", "had written"], "a": 0, "x": "Shakespeare lived a long time ago, so his writing life is a finished period: past simple <i>wrote<\/i>. The present perfect <i>has written<\/i> would suggest he is still alive and could write more. <i>Is writing<\/i> would be a temporary action now."}, {"h": "J. K. Rowling <span class=\"blank\" data-blank><\/span> more than a dozen books, and she is still publishing.", "ans": "has written <i>(she is alive and still writing)<\/i>", "type": "mcq", "opts": ["wrote", "has written", "was writing"], "a": 1, "x": "Rowling is still alive and publishing, so her writing period is not finished: present perfect <i>has written<\/i> (a number, linked to now). <i>Wrote<\/i> would treat it as a closed period, which does not match <i>she is still publishing<\/i>."}, {"h": "When <span class=\"blank\" data-blank><\/span>?", "ans": "did the manager resign <i>(asking about a specific time)<\/i>", "type": "mcq", "opts": ["has the manager resigned", "the manager resigned", "did the manager resign"], "a": 2, "x": "The question asks about a specific past time, and the present perfect cannot be used for that. Use the past simple question <i>did the manager resign<\/i>. <i>The manager resigned<\/i> has statement word order, so it is not a question."}, {"h": "I <span class=\"blank\" data-blank><\/span> to Japan, but I would love to go one day.", "ans": "have never been <i>(experience up to now)<\/i>", "type": "mcq", "opts": ["have never been", "never was", "was never being"], "a": 0, "x": "<i>Have never been<\/i> is the correct present perfect for life experience up to now. <i>Never was<\/i> and <i>was never being<\/i> are not natural. We say <i>I have never been to<\/i> + place."}, {"h": "At a press conference on Tuesday, the minister <span class=\"blank\" data-blank><\/span> the new policy.", "ans": "announced <i>(a finished, named time)<\/i>", "type": "mcq", "opts": ["announced", "has announced", "was announcing", "is announcing"], "a": 0, "x": "<i>On Tuesday<\/i> is a finished, named time, so use the past simple <i>announced<\/i>. The present perfect does not combine with a finished time. <i>Was announcing<\/i> would describe an action in progress, not the completed announcement."}, {"h": "Since the new rule came into force, the number of complaints <span class=\"blank\" data-blank><\/span>.", "ans": "has fallen <i>(since + present perfect)<\/i>", "type": "mcq", "opts": ["fell", "was falling", "has fallen"], "a": 2, "x": "<i>Since the new rule came into force<\/i> links the past to now, so the present perfect <i>has fallen<\/i> is right. <i>Fell<\/i> would describe one finished event, and <i>was falling<\/i> would describe a past trend with no link to now."}, {"h": "My grandfather <span class=\"blank\" data-blank><\/span> as a pilot for thirty years before he retired in 1998.", "ans": "worked <i>(the period is over)<\/i>", "type": "mcq", "opts": ["worked", "has worked", "is working"], "a": 0, "x": "He <i>retired in 1998<\/i>, so his working life is over: past simple <i>worked<\/i>. <i>Has worked<\/i> would suggest he is still working. <i>Is working<\/i> is a present tense and contradicts <i>before he retired<\/i>."}, {"h": "My uncle <span class=\"blank\" data-blank><\/span> at the same bank since 1995 and plans to stay until he retires.", "ans": "has worked <i>(still true now: since)<\/i>", "type": "mcq", "opts": ["worked", "has worked", "works"], "a": 1, "x": "<i>Since 1995<\/i> and <i>plans to stay<\/i> show the situation continues now, so use the present perfect <i>has worked<\/i>. <i>Works since<\/i> is a very common mistake, because <i>since<\/i> needs a perfect tense. <i>Worked<\/i> would mean he no longer works there."}, {"h": "In the 1990s, mobile phones <span class=\"blank\" data-blank><\/span> expensive and rare, but today almost everyone owns one.", "ans": "were <i>(a finished period)<\/i>", "type": "mcq", "opts": ["have been", "are", "were"], "a": 2, "x": "<i>In the 1990s<\/i> is a finished period, so use the past simple <i>were<\/i>. The contrast with <i>today<\/i> confirms that the earlier situation is over. <i>Have been<\/i> would link the 1990s to now, which is not the meaning."}, {"h": "We <span class=\"blank\" data-blank><\/span> each other since primary school, so I trust her completely.", "ans": "have known <i>(stative + since)<\/i>", "type": "mcq", "opts": ["have known", "have been knowing", "know"], "a": 0, "x": "<i>Since primary school<\/i> shows a situation from the past that continues now: present perfect. <i>Know<\/i> is stative, so it does not take the continuous: <i>have known<\/i>, not <i>have been knowing<\/i>. The present simple <i>know<\/i> cannot be used with <i>since<\/i>."}]}, {"l": "F", "t": "Present perfect: simple or continuous?", "i": "Choose the correct option.", "q": [{"h": "I <span class=\"blank\" data-blank><\/span> four chapters of this book, and I still have two to go.", "ans": "have read <i>(a number: simple)<\/i>", "type": "mcq", "opts": ["have read", "have been reading"], "a": 0, "x": "<i>Four chapters<\/i> is a number of completed things, and the sentence is about the result (two still to go). Use the present perfect simple: <i>have read<\/i>. The continuous focuses on duration, not on how many."}, {"h": "Your eyes are red. <span class=\"blank\" data-blank><\/span>?", "ans": "Have you been crying <i>(recent activity, visible result now)<\/i>", "type": "mcq", "opts": ["Did you cry", "Have you been crying", "Are you crying"], "a": 1, "x": "<i>Your eyes are red<\/i> is a visible result now of recent activity, so the present perfect continuous <i>have you been crying<\/i> is natural. <i>Did you cry<\/i> asks about a past event with no link to now, and <i>are you crying<\/i> asks about this moment."}, {"h": "The engineers <span class=\"blank\" data-blank><\/span> the bridge, so traffic can use it again.", "ans": "have repaired <i>(finished result)<\/i>", "type": "mcq", "opts": ["have repaired", "have been repairing"], "a": 0, "x": "The sentence focuses on the finished result (<i>traffic can use it again<\/i>), so use the present perfect simple: <i>have repaired<\/i>. The continuous would suggest the work is still going on."}, {"h": "The engineers <span class=\"blank\" data-blank><\/span> the bridge since March, and it is still closed.", "ans": "have been repairing <i>(duration, not finished)<\/i>", "type": "mcq", "opts": ["have repaired", "have been repairing"], "a": 1, "x": "<i>Since March<\/i> and <i>it is still closed<\/i> show the activity has lasted a long time and is unfinished: <i>have been repairing<\/i>. The simple <i>have repaired<\/i> would suggest the work is complete."}, {"h": "How many emails <span class=\"blank\" data-blank><\/span> this morning?", "ans": "have you sent <i>(how many: simple)<\/i>", "type": "mcq", "opts": ["have you sent", "have you been sending"], "a": 0, "x": "<i>How many<\/i> asks for a number of completed things, so use the present perfect simple: <i>have you sent<\/i>. The continuous is for <i>how long<\/i> questions: <i>How long have you been sending emails?<\/i>"}, {"h": "She is covered in paint. She <span class=\"blank\" data-blank><\/span> the kitchen since lunchtime.", "ans": "has been painting <i>(activity and duration)<\/i>", "type": "mcq", "opts": ["has painted", "has been painting"], "a": 1, "x": "<i>Covered in paint<\/i> shows recent activity, and <i>since lunchtime<\/i> gives the duration, so the continuous <i>has been painting<\/i> is best. The simple <i>has painted<\/i> would focus on the finished job, and that does not match the idea of an activity still going on."}, {"h": "I <span class=\"blank\" data-blank><\/span> her since 2012, and she has never let me down.", "ans": "have known <i>(stative: simple only)<\/i>", "type": "mcq", "opts": ["have known", "have been knowing", "know"], "a": 0, "x": "<i>Know<\/i> is a stative verb, so it cannot be used in the continuous: <i>have known<\/i>. <i>Have been knowing<\/i> is a typical mistake. The present simple <i>know<\/i> cannot be used with <i>since 2012<\/i> to say how long."}, {"h": "Researchers <span class=\"blank\" data-blank><\/span> over forty papers on this topic.", "ans": "have published <i>(a number: simple)<\/i>", "type": "mcq", "opts": ["have been publishing", "have published"], "a": 1, "x": "<i>Over forty papers<\/i> is a number, so use the present perfect simple: <i>have published<\/i>. The continuous would focus on the activity itself and sounds odd with a total."}, {"h": "The phone <span class=\"blank\" data-blank><\/span> for five minutes. Why does nobody answer?", "ans": "has been ringing <i>(duration up to now)<\/i>", "type": "mcq", "opts": ["has rung", "rings", "has been ringing"], "a": 2, "x": "<i>For five minutes<\/i> shows the duration of an ongoing action, and the speaker is surprised nobody answers: <i>has been ringing<\/i>. <i>Has rung<\/i> would count completed rings, and <i>rings<\/i> cannot be used with <i>for five minutes<\/i>."}, {"h": "She <span class=\"blank\" data-blank><\/span> this shop since 2010.", "ans": "has owned <i>(own is stative)<\/i>", "type": "mcq", "opts": ["has owned", "has been owning", "owns"], "a": 0, "x": "<i>Own<\/i> is stative, so it uses the simple form: <i>has owned<\/i>. <i>Has been owning<\/i> is a common mistake. <i>Owns since 2010<\/i> is wrong because <i>since<\/i> needs the present perfect."}]}, {"l": "G", "t": "Past tenses in sequence", "i": "Choose the correct option.", "q": [{"h": "When the manager walked in, the room was empty: everyone <span class=\"blank\" data-blank><\/span>.", "ans": "had left <i>(earlier of two past events)<\/i>", "type": "mcq", "opts": ["had left", "left", "was leaving"], "a": 0, "x": "The room was empty when the manager walked in, so the leaving happened before that moment: past perfect <i>had left<\/i>. <i>Left<\/i> would suggest both events happened at the same time, and <i>was leaving<\/i> would mean they were still in the middle of leaving."}, {"h": "I <span class=\"blank\" data-blank><\/span> dinner when the lights went out, so I finished it by candlelight.", "ans": "was cooking <i>(in progress when interrupted)<\/i>", "type": "mcq", "opts": ["cooked", "was cooking", "had cooked"], "a": 1, "x": "The cooking was in progress when the lights went out (an interruption): past continuous <i>was cooking<\/i>. <i>Cooked<\/i> would mean the dinner was finished before the lights went out, and <i>had cooked<\/i> says the cooking was already done."}, {"h": "By the time the ambulance arrived, the patient <span class=\"blank\" data-blank><\/span>.", "ans": "had died <i>(by the time + earlier event)<\/i>", "type": "mcq", "opts": ["died", "was dying", "had died"], "a": 2, "x": "<i>By the time<\/i> + past simple (<i>arrived<\/i>) means the first action was already complete: past perfect <i>had died<\/i>. <i>Died<\/i> would put both events at the same time, and <i>was dying<\/i> would mean he was still alive on arrival."}, {"h": "She looked exhausted. She <span class=\"blank\" data-blank><\/span> since five in the morning.", "ans": "had been studying <i>(duration before a past moment)<\/i>", "type": "mcq", "opts": ["had been studying", "studied", "was studying"], "a": 0, "x": "<i>Since five in the morning<\/i> gives the duration before a past moment (<i>she looked exhausted<\/i>): past perfect continuous <i>had been studying<\/i>. <i>Studied<\/i> and <i>was studying<\/i> do not show the duration up to that moment."}, {"h": "When I got to the exam hall, I realised that I <span class=\"blank\" data-blank><\/span> my ID card at home.", "ans": "had left <i>(earlier event)<\/i>", "type": "mcq", "opts": ["left", "had left", "was leaving"], "a": 1, "x": "She <i>realised<\/i> at the exam hall that something had happened earlier, so use the past perfect: <i>had left<\/i>. <i>Left<\/i> would not show it came first, and <i>was leaving<\/i> would mean she was leaving at the same time."}, {"h": "While the teacher <span class=\"blank\" data-blank><\/span> the rule, two students were whispering at the back.", "ans": "was explaining <i>(two actions in progress together)<\/i>", "type": "mcq", "opts": ["explained", "had explained", "was explaining"], "a": 2, "x": "Two actions were happening at the same time in the past, so both take the past continuous: <i>was explaining<\/i> (and <i>were whispering<\/i>). <i>Explained<\/i> would mean the explanation was complete, and <i>had explained<\/i> would put it earlier."}, {"h": "At midnight, most of the city <span class=\"blank\" data-blank><\/span>.", "ans": "was sleeping <i>(in progress at a past moment)<\/i>", "type": "mcq", "opts": ["was sleeping", "slept", "had slept"], "a": 0, "x": "<i>At midnight<\/i> is a point in the past, and the city was in the middle of sleeping: past continuous <i>was sleeping<\/i>. <i>Slept<\/i> would present it as a completed event, and <i>had slept<\/i> needs an earlier point of reference."}, {"h": "He <span class=\"blank\" data-blank><\/span> me his secret last night, and now I regret listening.", "ans": "told <i>(finished time: last night)<\/i>", "type": "mcq", "opts": ["has told", "told", "had told"], "a": 1, "x": "<i>Last night<\/i> is a finished time, so use the past simple <i>told<\/i>. The present perfect cannot be used with a finished time. <i>Had told<\/i> would need another past moment to look back from."}, {"h": "It was my first time on a plane. I <span class=\"blank\" data-blank><\/span> before that day.", "ans": "had never flown <i>(never + earlier than a past moment)<\/i>", "type": "mcq", "opts": ["never flew", "was never flying", "had never flown"], "a": 2, "x": "<i>First time on a plane<\/i> and <i>before that day<\/i> refer to experience up to a past moment: past perfect <i>had never flown<\/i>. <i>Never flew<\/i> does not show that relationship, and <i>was never flying<\/i> is not used."}, {"h": "The company <span class=\"blank\" data-blank><\/span> in 2019 after years of poor management.", "ans": "collapsed <i>(a finished event)<\/i>", "type": "mcq", "opts": ["collapsed", "was collapsing", "had collapsed"], "a": 0, "x": "<i>In 2019<\/i> is a finished time, and the collapse is a single event: past simple <i>collapsed<\/i>. <i>Was collapsing<\/i> would describe a process in progress, and <i>had collapsed<\/i> would need a later past moment."}]}, {"l": "H", "t": "Future forms", "i": "Choose the correct option.", "q": [{"h": "Look at the sky! It is so dark that it <span class=\"blank\" data-blank><\/span>.", "ans": "is going to rain <i>(evidence now)<\/i>", "type": "mcq", "opts": ["is going to rain", "will rain", "rains"], "a": 0, "x": "<i>Look at the sky!<\/i> and <i>so dark<\/i> are present evidence for the near future: <i>is going to rain<\/i>. <i>Will rain<\/i> is a prediction without evidence, and the present simple <i>rains<\/i> would describe a habit."}, {"h": "A: The phone is ringing. B: I <span class=\"blank\" data-blank><\/span> it.", "ans": "will answer <i>(a decision made at the moment)<\/i>", "type": "mcq", "opts": ["answer", "will answer", "am going to answer"], "a": 1, "x": "Deciding at the moment of speaking takes <i>will<\/i>: <i>I will answer it<\/i>. <i>Am going to answer<\/i> is for plans already made, and the present simple <i>answer<\/i> cannot show a future decision."}, {"h": "I have already bought the tickets; we <span class=\"blank\" data-blank><\/span> to Dubai on the third.", "ans": "are flying <i>(a fixed arrangement)<\/i>", "type": "mcq", "opts": ["will fly", "fly", "are flying"], "a": 2, "x": "<i>Already bought the tickets<\/i> makes it a fixed arrangement: present continuous <i>are flying<\/i>. <i>Will fly<\/i> is a prediction, and the present simple <i>fly<\/i> is for timetables."}, {"h": "If you <span class=\"blank\" data-blank><\/span> early, please call me.", "ans": "finish <i>(if + present simple)<\/i>", "type": "mcq", "opts": ["finish", "will finish", "finished"], "a": 0, "x": "After <i>if<\/i> we use the present simple for future conditions: <i>If you finish<\/i>. <i>Will finish<\/i> after <i>if<\/i> is a very common mistake, and <i>finished<\/i> changes the meaning to a past or unreal situation."}, {"h": "By the time you read this email, I <span class=\"blank\" data-blank><\/span> the country.", "ans": "will have left <i>(completed before a future time)<\/i>", "type": "mcq", "opts": ["will leave", "will have left", "am leaving"], "a": 1, "x": "<i>By the time you read this<\/i> means the action will be complete before a future moment: future perfect <i>will have left<\/i>. <i>Will leave<\/i> does not show it is finished first, and <i>am leaving<\/i> is an arrangement, not a completed event."}, {"h": "This time next month, the new students <span class=\"blank\" data-blank><\/span> in their first lectures.", "ans": "will be studying <i>(in progress at a future time)<\/i>", "type": "mcq", "opts": ["will study", "will have studied", "will be studying"], "a": 2, "x": "<i>This time next month<\/i> places the action in progress at a future moment: future continuous <i>will be studying<\/i>. <i>Will study<\/i> states a future fact without showing it is in progress, and <i>will have studied<\/i> means finished."}, {"h": "By 2035, researchers <span class=\"blank\" data-blank><\/span> a vaccine, according to the report.", "ans": "will have developed <i>(by + future: future perfect)<\/i>", "type": "mcq", "opts": ["will have developed", "are developing", "developed"], "a": 0, "x": "<i>By 2035<\/i> means before that time, and the vaccine will be complete: future perfect <i>will have developed<\/i>. <i>Developed<\/i> is past, and <i>are developing<\/i> cannot be used with a future deadline."}, {"h": "In June, I <span class=\"blank\" data-blank><\/span> for twenty years.", "ans": "will have been teaching <i>(duration up to a future time)<\/i>", "type": "mcq", "opts": ["will teach", "will have been teaching", "am teaching"], "a": 1, "x": "<i>In June … for twenty years<\/i> gives duration up to a future point: future perfect continuous <i>will have been teaching<\/i>. <i>Will teach<\/i> and <i>am teaching<\/i> do not count the time up to June."}, {"h": "Don't phone me at eight tomorrow. I <span class=\"blank\" data-blank><\/span> to the airport then.", "ans": "will be driving <i>(in progress at a future time)<\/i>", "type": "mcq", "opts": ["will drive", "drive", "will be driving"], "a": 2, "x": "<i>Don't phone me at eight tomorrow<\/i> shows the action will be in progress at that time: <i>will be driving<\/i>. <i>Will drive<\/i> only states a future action, and <i>drive<\/i> would describe a habit."}, {"h": "The company expects that profits <span class=\"blank\" data-blank><\/span> by eight per cent next year.", "ans": "will rise <i>(a prediction)<\/i>", "type": "mcq", "opts": ["will rise", "will have risen", "rise"], "a": 0, "x": "A prediction about next year takes <i>will<\/i>: <i>will rise<\/i>. <i>Will have risen<\/i> needs a deadline (<i>by next year<\/i>), and <i>rise<\/i> is a present simple that cannot predict."}]}, {"l": "I", "t": "Switching tenses: clauses, reported speech, conditionals", "i": "Choose the correct option.", "q": [{"h": "I will text you as soon as the plane <span class=\"blank\" data-blank><\/span>.", "ans": "lands <i>(time clause: present, not will)<\/i>", "type": "mcq", "opts": ["lands", "will land", "landed"], "a": 0, "x": "After <i>as soon as<\/i> (a time clause), we use the present simple for the future: <i>lands<\/i>. <i>Will land<\/i> in a time clause is a typical mistake. <i>Landed<\/i> would make it past."}, {"h": "She said that she <span class=\"blank\" data-blank><\/span> too busy to attend the meeting.", "ans": "was <i>(reported speech: one step back)<\/i>", "type": "mcq", "opts": ["is", "was", "has been"], "a": 1, "x": "In reported speech after the past <i>said<\/i>, the tense moves one step back: <i>is<\/i> becomes <i>was<\/i>. <i>Is<\/i> keeps the original tense, and <i>has been<\/i> changes the meaning."}, {"h": "He told me that he <span class=\"blank\" data-blank><\/span> me after the interview.", "ans": "would call <i>(will becomes would)<\/i>", "type": "mcq", "opts": ["will call", "calls", "would call"], "a": 2, "x": "Reported speech moves <i>will<\/i> back to <i>would<\/i>: <i>he would call me<\/i>. <i>Will call<\/i> keeps the original tense, and <i>calls<\/i> turns it into a habit."}, {"h": "She asked me where I <span class=\"blank\" data-blank><\/span> and how long I had been there.", "ans": "lived <i>(reported question: backshift)<\/i>", "type": "mcq", "opts": ["lived", "live", "have lived"], "a": 0, "x": "A reported question after the past <i>asked<\/i> moves the tense back, with statement word order: <i>where I lived<\/i>. <i>Live<\/i> keeps the original tense, and <i>have lived<\/i> changes the meaning."}, {"h": "He studied medicine in Dhaka and <span class=\"blank\" data-blank><\/span> at a hospital there for six years before moving abroad.", "ans": "worked <i>(both finished, in the past)<\/i>", "type": "mcq", "opts": ["works", "worked", "has worked"], "a": 1, "x": "Both events are finished and in the past, so use the past simple: <i>worked<\/i>. <i>Has worked<\/i> would link to now, but he moved abroad. <i>Works<\/i> is present and does not fit <i>before moving abroad<\/i>."}, {"h": "Unless the weather <span class=\"blank\" data-blank><\/span>, the match will be postponed.", "ans": "improves <i>(unless + present simple)<\/i>", "type": "mcq", "opts": ["will improve", "improved", "improves"], "a": 2, "x": "After <i>unless<\/i>, use the present simple for the future: <i>unless the weather improves<\/i>. <i>Will improve<\/i> is a typical mistake, as with <i>if<\/i>. <i>Improved<\/i> changes the time."}, {"h": "If she <span class=\"blank\" data-blank><\/span> harder last year, she would have passed the exam.", "ans": "had studied <i>(third conditional: had + participle)<\/i>", "type": "mcq", "opts": ["had studied", "studied", "would study"], "a": 0, "x": "The third conditional (an unreal past) is <i>if + past perfect<\/i>, <i>would have + participle<\/i>: <i>had studied<\/i>. <i>Studied<\/i> would mix patterns, and <i>would study<\/i> cannot follow <i>if<\/i>."}, {"h": "I wish I <span class=\"blank\" data-blank><\/span> the answer. I'm completely lost.", "ans": "knew <i>(wish about now: past simple)<\/i>", "type": "mcq", "opts": ["know", "knew", "had known"], "a": 1, "x": "<i>Wish<\/i> about the present uses the past simple: <i>I wish I knew<\/i> (but I don't). <i>Know<\/i> does not express an unreal wish, and <i>had known<\/i> would be a regret about the past."}, {"h": "If I <span class=\"blank\" data-blank><\/span> enough money, I would buy a bigger flat.", "ans": "had <i>(second conditional: if + past simple)<\/i>", "type": "mcq", "opts": ["have", "will have", "had"], "a": 2, "x": "The second conditional (an unreal or unlikely present) is <i>if + past simple<\/i>, <i>would + base verb<\/i>: <i>had enough money<\/i>. <i>Have<\/i> and <i>will have<\/i> belong to real or future conditionals."}, {"h": "She asked whether I <span class=\"blank\" data-blank><\/span> the report.", "ans": "had finished <i>(reported question: have finished becomes had finished)<\/i>", "type": "mcq", "opts": ["had finished", "finished", "have finished"], "a": 0, "x": "In a reported question about an earlier completed action, <i>have finished<\/i> shifts to <i>had finished<\/i>. <i>Finished<\/i> can sometimes be heard, but <i>had finished<\/i> is the exact backshift, and <i>have finished<\/i> keeps the original tense."}]}, {"l": "J", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "The line graph shows that car ownership <span class=\"blank\" data-blank><\/span> steadily between 1990 and 2010.", "ans": "rose <i>(a finished period)<\/i>", "type": "mcq", "opts": ["rose", "has risen", "was rising"], "a": 0, "x": "<i>Between 1990 and 2010<\/i> is a finished period, so use the past simple <i>rose<\/i> in Task 1 descriptions. <i>Has risen<\/i> needs a link to now, and <i>was rising<\/i> presents the change as background in progress."}, {"h": "Since the early 2000s, the proportion of remote workers <span class=\"blank\" data-blank><\/span> in almost every country.", "ans": "has increased <i>(since + present perfect)<\/i>", "type": "mcq", "opts": ["increased", "has increased", "was increasing"], "a": 1, "x": "<i>Since the early 2000s<\/i> links the past to now, so use the present perfect <i>has increased<\/i>. <i>Increased<\/i> is for a finished period, and <i>was increasing<\/i> does not link to now."}, {"h": "By 2050, experts predict that two-thirds of the world's population <span class=\"blank\" data-blank><\/span> in cities.", "ans": "will live <i>(a prediction: future simple)<\/i>", "type": "mcq", "opts": ["live", "will have lived", "will live"], "a": 2, "x": "A prediction takes <i>will<\/i>: <i>will live<\/i>. <i>By 2050<\/i> tempts you to choose <i>will have lived<\/i>, but the sentence is about a situation in the future, not an action finished by then. <i>Live<\/i> is a present form and cannot express a prediction."}, {"h": "Nowadays, many employers <span class=\"blank\" data-blank><\/span> candidates with practical experience.", "ans": "prefer <i>(prefer is stative)<\/i>", "type": "mcq", "opts": ["prefer", "are preferring", "have preferred"], "a": 0, "x": "<i>Prefer<\/i> is stative and takes the simple form: <i>prefer<\/i>. <i>Are preferring<\/i> is a common mistake, even with <i>nowadays<\/i>. <i>Have preferred<\/i> would imply a different time frame."}, {"h": "I remember a trip I took when I was ten. We <span class=\"blank\" data-blank><\/span> by train when suddenly it stopped.", "ans": "were travelling <i>(in progress when interrupted)<\/i>", "type": "mcq", "opts": ["travelled", "were travelling", "have travelled"], "a": 1, "x": "<i>We were travelling … when suddenly it stopped<\/i> is a background action interrupted by a sudden event: past continuous. <i>Travelled<\/i> would make the trip a completed event, and <i>have travelled<\/i> cannot be used for a story set at a past time."}, {"h": "A census carried out in 2021 <span class=\"blank\" data-blank><\/span> that the city's population had doubled since 1990.", "ans": "showed <i>(finished time: 2021)<\/i>", "type": "mcq", "opts": ["has shown", "is showing", "showed"], "a": 2, "x": "<i>Carried out in 2021<\/i> is a finished time, so use the past simple <i>showed<\/i>. <i>Has shown<\/i> cannot be used with a past date, and <i>is showing<\/i> is wrong for a completed study."}, {"h": "The price of oil <span class=\"blank\" data-blank><\/span> sharply in 2015 and has stayed low ever since.", "ans": "fell <i>(finished time: 2015)<\/i>", "type": "mcq", "opts": ["fell", "has fallen", "was falling"], "a": 0, "x": "<i>In 2015<\/i> is a finished time: past simple <i>fell<\/i>. <i>Has fallen<\/i> cannot combine with 2015, and <i>was falling<\/i> does not report the result. The second clause (<i>has stayed low ever since<\/i>) correctly uses the present perfect."}, {"h": "By the end of the decade, renewable energy <span class=\"blank\" data-blank><\/span> coal in many countries.", "ans": "will have replaced <i>(by + future: future perfect)<\/i>", "type": "mcq", "opts": ["replaces", "will have replaced", "replaced"], "a": 1, "x": "<i>By the end of the decade<\/i> signals a deadline: future perfect <i>will have replaced<\/i>. <i>Replaces<\/i> is a present fact, and <i>replaced<\/i> is past."}, {"h": "In recent years, many universities <span class=\"blank\" data-blank><\/span> online degrees to attract international students.", "ans": "have introduced <i>(recent period up to now)<\/i>", "type": "mcq", "opts": ["introduced", "were introducing", "have introduced"], "a": 2, "x": "<i>In recent years<\/i> links to now: present perfect <i>have introduced<\/i>. <i>Introduced<\/i> needs a finished time, and <i>were introducing<\/i> describes background in the past."}, {"h": "Online learning <span class=\"blank\" data-blank><\/span> rapidly since the pandemic, and universities are adapting.", "ans": "has been growing <i>(since + continuing change)<\/i>", "type": "mcq", "opts": ["has been growing", "grew", "is growing"], "a": 0, "x": "<i>Since the pandemic<\/i> with an ongoing change: present perfect continuous <i>has been growing<\/i>. <i>Grew<\/i> cannot be used with <i>since<\/i>, and <i>is growing<\/i> does not combine with <i>since<\/i>."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) By the time I reached the station, the train left.<br>B) By the time I reach the station, the train had left.<br>C) By the time I reached the station, the train had left.<br>D) By the time I had reached the station, the train was leaving.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "The train left before I reached the station, so the earlier event takes the past perfect: <i>By the time I reached the station, the train had left.<\/i> The other options use the same tense for both events or mix present and past incorrectly."}, {"h": "A) Prices have risen sharply since 2020.<br>B) Prices are rising sharply since 2020.<br>C) Prices rose sharply since 2020.<br>D) Prices have been risen sharply since 2020.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "<i>Since 2020<\/i> needs the present perfect: <i>Prices have risen sharply since 2020.<\/i> <i>Rose since<\/i> and <i>are rising since<\/i> are mistakes, and <i>have been risen<\/i> is an incorrect passive."}, {"h": "A) She is working here since June.<br>B) She works here since June.<br>C) She worked here since June.<br>D) She has been working here since June.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "A duration with <i>since June<\/i> takes the present perfect continuous here: <i>She has been working here since June.<\/i> <i>Is working since<\/i> and <i>works since<\/i> are common mistakes, and <i>worked since<\/i> is wrong."}, {"h": "A) I will call you when I will arrive.<br>B) I will call you when I arrive.<br>C) I will call you when I arrived.<br>D) I will call you when I would arrive.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "In a time clause with <i>when<\/i>, use the present simple for the future: <i>I will call you when I arrive.<\/i> <i>Will arrive<\/i>, <i>arrived<\/i> and <i>would arrive<\/i> after <i>when<\/i> break the rule or change the meaning."}, {"h": "A) By the time you arrive, the film will have started.<br>B) By the time you will arrive, the film will start.<br>C) By the time you arrive, the film has started.<br>D) By the time you arrived, the film will have started.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "<i>By the time you arrive<\/i> uses the present simple for the future, and the film is completed first: <i>will have started<\/i>. <i>Will arrive<\/i> in the time clause is wrong, and <i>has started<\/i> does not match a future viewpoint."}, {"h": "A) How long are you waiting?<br>B) How long you are waiting?<br>C) How long did you wait since?<br>D) How long have you been waiting?", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "A duration question needs the present perfect continuous: <i>How long have you been waiting?<\/i> <i>Are you waiting<\/i> and <i>you are waiting<\/i> do not ask about duration, and <i>did you wait since<\/i> mixes the past simple with <i>since<\/i>."}, {"h": "A) I didn't saw him yesterday.<br>B) I haven't seen him yesterday.<br>C) I didn't see him yesterday.<br>D) I wasn't seeing him yesterday.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "<i>Yesterday<\/i> is a finished time, so use the past simple. After <i>didn't<\/i>, use the base verb: <i>didn't see<\/i>. <i>Didn't saw<\/i> marks the past twice, and <i>haven't seen yesterday<\/i> mixes the present perfect with a finished time."}, {"h": "A) She said me that she was exhausted.<br>B) She told me that she was exhausted.<br>C) She told that she was exhausted.<br>D) She said me that she is exhausted.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "<i>Tell<\/i> needs a person: <i>She told me that…<\/i>. <i>Said me<\/i> and <i>told that<\/i> are common mistakes. In reported speech after a past verb, the tense moves back: <i>was<\/i>, not <i>is<\/i>."}, {"h": "A) If it rains tomorrow, we will stay at home.<br>B) If it will rain tomorrow, we will stay at home.<br>C) If it would rain tomorrow, we will stay at home.<br>D) If it rained tomorrow, we will stay at home.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "After <i>if<\/i> in a real future condition use the present simple: <i>If it rains tomorrow, we will stay at home.<\/i> <i>Will rain<\/i>, <i>would rain<\/i> and <i>rained<\/i> after <i>if<\/i> break the pattern."}, {"h": "A) Scientists have discovered the planet in 1995.<br>B) Scientists were discovering the planet in 1995.<br>C) Scientists discover the planet in 1995.<br>D) Scientists discovered the planet in 1995.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "<i>In 1995<\/i> is a finished time: past simple <i>discovered<\/i>. <i>Have discovered<\/i> cannot be used with a year, <i>were discovering<\/i> describes a process rather than the event, and <i>discover<\/i> is the wrong tense for a historical event."}]}]}, {"n": 6, "title": "Complex Sentences and Relative Clauses", "level": "Level 2 · Band 6 to 8", "g": [{"l": "A", "t": "Conjunctions: contrast and reason", "i": "Choose the correct option.", "q": [{"h": "<span class=\"blank\" data-blank><\/span> the tickets were expensive, the concert sold out.", "ans": "Although <i>(although + clause)<\/i>", "type": "mcq", "opts": ["Although", "Despite", "However"], "a": 0, "x": "<i>Although<\/i> is a conjunction, so it joins two clauses: <i>the tickets were expensive<\/i> and <i>the concert sold out<\/i>. <i>Despite<\/i> needs a noun phrase or -ing form, and <i>however<\/i> cannot join two clauses with a comma."}, {"h": "<span class=\"blank\" data-blank><\/span> the heavy rain, the match went ahead.", "ans": "Despite <i>(despite + noun phrase)<\/i>", "type": "mcq", "opts": ["Although", "Despite", "Because"], "a": 1, "x": "<i>The heavy rain<\/i> is a noun phrase, not a clause with its own verb. <i>Despite<\/i> is followed by a noun phrase or -ing form. <i>Although<\/i> and <i>because<\/i> both need a subject and a verb after them."}, {"h": "The flight was delayed <span class=\"blank\" data-blank><\/span> heavy fog.", "ans": "because of <i>(because of + noun phrase)<\/i>", "type": "mcq", "opts": ["because", "although", "because of"], "a": 2, "x": "<i>Heavy fog<\/i> is a noun phrase, so you need the preposition <i>because of<\/i>. <i>Because<\/i> must be followed by a full clause, and <i>although<\/i> would give the wrong meaning: the fog is the reason, not a contrast."}, {"h": "Many graduates cannot find work <span class=\"blank\" data-blank><\/span> employers want experience.", "ans": "because <i>(because + clause)<\/i>", "type": "mcq", "opts": ["because", "because of", "despite"], "a": 0, "x": "<i>Employers want experience<\/i> is a full clause (subject + verb), so you need the conjunction <i>because<\/i>. <i>Because of<\/i> and <i>despite<\/i> are followed by noun phrases, and <i>despite<\/i> would also reverse the logic."}, {"h": "Urban areas are crowded, <span class=\"blank\" data-blank><\/span> rural areas are sparsely populated.", "ans": "whereas <i>(whereas compares two things)<\/i>", "type": "mcq", "opts": ["despite", "whereas", "because of"], "a": 1, "x": "The sentence compares two opposite things: urban and rural areas. <i>Whereas<\/i> joins two clauses and shows that contrast. <i>Despite<\/i> and <i>because of<\/i> need noun phrases and change the meaning."}, {"h": "Although the course was difficult, <span class=\"blank\" data-blank><\/span>.", "ans": "she passed it <i>(although and but never go together)<\/i>", "type": "mcq", "opts": ["but she passed it", "so she passed it", "she passed it"], "a": 2, "x": "<i>Although<\/i> already shows the contrast, so you must not add <i>but<\/i>. The two words do the same job in one sentence. <i>So she passed it<\/i> adds a result that does not follow logically from the difficulty."}, {"h": "Prices rose sharply<span class=\"blank\" data-blank><\/span> wages stayed the same.", "ans": "; however, <i>(however is an adverb: semicolon before, comma after)<\/i>", "type": "mcq", "opts": ["; however,", ", however", "; although"], "a": 0, "x": "<i>However<\/i> is an adverb, not a conjunction, so it cannot join two clauses with only a comma. Use a semicolon or full stop before it and a comma after it. <i>Although<\/i> after a semicolon is not correct punctuation."}, {"h": "He was late <span class=\"blank\" data-blank><\/span>.", "ans": "because he missed the bus <i>(because + subject + verb)<\/i>", "type": "mcq", "opts": ["because of he missed the bus", "because he missed the bus", "despite he missed the bus"], "a": 1, "x": "<i>He missed the bus<\/i> is a full clause, so you need <i>because<\/i>. <i>Because of<\/i> and <i>despite<\/i> must be followed by a noun phrase, so adding a subject and verb after them is a common mistake."}, {"h": "Mobile use rose between 2000 and 2020, <span class=\"blank\" data-blank><\/span> landline use fell.", "ans": "while <i>(while contrasts two trends)<\/i>", "type": "mcq", "opts": ["despite", "because of", "while"], "a": 2, "x": "<i>While<\/i> joins two clauses and contrasts two trends: mobile use rose while landline use fell. <i>Despite<\/i> and <i>because of<\/i> need noun phrases, and they would not express the contrast between the trends."}, {"h": "She did not reach Band 7 <span class=\"blank\" data-blank><\/span> she studied for months.", "ans": "even though <i>(even though + clause)<\/i>", "type": "mcq", "opts": ["even though", "even", "despite"], "a": 0, "x": "<i>Even though<\/i> is a conjunction that introduces a clause (<i>she studied for months<\/i>) and adds emphasis. <i>Even<\/i> alone cannot join clauses, and <i>despite<\/i> needs a noun phrase or -ing form."}]}, {"l": "B", "t": "Relative pronouns: who, which, that, whose, where", "i": "Choose the correct option.", "q": [{"h": "The students <span class=\"blank\" data-blank><\/span> passed the test celebrated.", "ans": "who <i>(who for people)<\/i>", "type": "mcq", "opts": ["who", "which", "whose"], "a": 0, "x": "<i>Who<\/i> refers to people and starts a defining clause that says which students. <i>Which<\/i> is for things, and <i>whose<\/i> would need a noun after it (<i>whose parents<\/i>)."}, {"h": "The graph, <span class=\"blank\" data-blank><\/span> shows energy use, is very clear.", "ans": "which <i>(which for things)<\/i>", "type": "mcq", "opts": ["who", "which", "what"], "a": 1, "x": "<i>The graph<\/i> is a thing, so use <i>which<\/i>. <i>Who<\/i> is for people. <i>What<\/i> cannot follow a noun, because it already contains its own meaning (<i>the thing that<\/i>)."}, {"h": "A student <span class=\"blank\" data-blank><\/span> essay was copied was disqualified.", "ans": "whose <i>(whose shows possession)<\/i>", "type": "mcq", "opts": ["who", "which", "whose"], "a": 2, "x": "<i>Whose<\/i> shows possession: the essay belongs to the student. <i>Who<\/i> or <i>which<\/i> would need a different structure: <i>whose essay<\/i> replaces <i>his essay<\/i> or <i>her essay<\/i>."}, {"h": "The city <span class=\"blank\" data-blank><\/span> I grew up has changed a lot.", "ans": "where <i>(where = in which)<\/i>", "type": "mcq", "opts": ["where", "which", "who"], "a": 0, "x": "<i>Where<\/i> replaces <i>in which<\/i> when the noun is a place. <i>Which I grew up<\/i> is missing the preposition (<i>in which I grew up<\/i>), and <i>who<\/i> is only for people."}, {"h": "Everything <span class=\"blank\" data-blank><\/span> she said was true.", "ans": "that <i>(that after everything)<\/i>", "type": "mcq", "opts": ["what", "that", "which"], "a": 1, "x": "After <i>everything<\/i>, <i>all<\/i>, <i>nothing<\/i> and <i>something<\/i>, the usual relative pronoun is <i>that<\/i>. <i>What<\/i> cannot follow a noun phrase, and <i>which<\/i> is less natural after <i>everything<\/i>."}, {"h": "The report <span class=\"blank\" data-blank><\/span> was helpful.", "ans": "I read <i>(never repeat the object)<\/i>", "type": "mcq", "opts": ["what I read", "which I read it", "I read"], "a": 2, "x": "The relative pronoun is the object of <i>read<\/i>, so it can be left out (<i>the report I read<\/i>). You must never repeat the object (<i>which I read it<\/i>), and <i>what<\/i> cannot follow a noun."}, {"h": "My sister, <span class=\"blank\" data-blank><\/span> lives in London, is a doctor.", "ans": "who <i>(that is not used in non-defining clauses)<\/i>", "type": "mcq", "opts": ["who", "that", "which"], "a": 0, "x": "A non-defining clause between commas never uses <i>that<\/i>. Because <i>my sister<\/i> is a person, use <i>who<\/i>. <i>Which<\/i> is for things."}, {"h": "She passed the exam, <span class=\"blank\" data-blank><\/span> surprised everyone.", "ans": "which <i>(which refers to the whole idea)<\/i>", "type": "mcq", "opts": ["what", "which", "that"], "a": 1, "x": "<i>Which<\/i> after a comma can refer to the whole previous idea (she passed the exam). <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot refer back to an earlier clause."}, {"h": "The main reason <span class=\"blank\" data-blank><\/span> he left is still unclear.", "ans": "why <i>(reason + why)<\/i>", "type": "mcq", "opts": ["what", "who", "why"], "a": 2, "x": "After <i>reason<\/i>, use <i>why<\/i> (or <i>that<\/i>). <i>What<\/i> and <i>who<\/i> do not fit: <i>what<\/i> already contains its noun, and <i>who<\/i> is only for people."}, {"h": "The company for <span class=\"blank\" data-blank><\/span> she works is expanding.", "ans": "which <i>(preposition + which for things)<\/i>", "type": "mcq", "opts": ["which", "whom", "where"], "a": 0, "x": "<i>For which<\/i> is correct because the company is a thing and the preposition <i>for<\/i> comes before the pronoun. <i>Whom<\/i> is only for people, and <i>for where<\/i> is not used."}]}, {"l": "C", "t": "Commas and punctuation", "i": "Choose the correct option.", "q": [{"h": "My only brother<span class=\"blank\" data-blank><\/span> is a dentist.", "ans": ", who lives in Canada, <i>(one brother: extra information)<\/i>", "type": "mcq", "opts": [", who lives in Canada,", "who lives in Canada", "who lives in Canada,"], "a": 0, "x": "The writer has one brother, so the clause is extra information and goes between commas. Without commas, the clause would suggest that there are several brothers and this is the one who lives in Canada. The first comma and the second comma are both needed."}, {"h": "Students<span class=\"blank\" data-blank><\/span> are disqualified.", "ans": " who cheat in exams <i>(defining: no commas)<\/i>", "type": "mcq", "opts": [", who cheat in exams,", "who cheat in exams", ", who cheat in exams"], "a": 1, "x": "The clause tells us which students are disqualified, so it is defining and takes no commas. With commas it would suggest that all students cheat, which changes the meaning."}, {"h": "Dhaka<span class=\"blank\" data-blank><\/span> is very crowded.", "ans": ", the capital of Bangladesh, <i>(appositive: commas on both sides)<\/i>", "type": "mcq", "opts": ["the capital of Bangladesh,", ", the capital of Bangladesh", ", the capital of Bangladesh,"], "a": 2, "x": "An appositive renames the noun before it, and it needs a comma at the start and the end. If one comma is missing, the reader cannot see where the extra phrase stops."}, {"h": "I bought the laptop<span class=\"blank\" data-blank><\/span>.", "ans": " that was on sale <i>(defining that: no comma)<\/i>", "type": "mcq", "opts": ["that was on sale", ", that was on sale", "who was on sale"], "a": 0, "x": "This is a defining clause: it says which laptop. A defining clause has no comma. <i>That<\/i> is correct for things, and <i>who<\/i> is only for people."}, {"h": "The economy grew rapidly<span class=\"blank\" data-blank><\/span> unemployment fell.", "ans": "; as a result, <i>(as a result needs a semicolon or full stop)<\/i>", "type": "mcq", "opts": [", as a result,", "; as a result,", "as a result"], "a": 1, "x": "<i>As a result<\/i> is an adverb phrase, so it cannot be joined to the previous clause with a comma. Use a semicolon or a full stop, then <i>as a result,<\/i> with a comma. Leaving out punctuation makes a run-on sentence."}, {"h": "Although she was tired<span class=\"blank\" data-blank><\/span> she kept working.", "ans": ", <i>(comma after an opening dependent clause)<\/i>", "type": "mcq", "opts": [";", ":", ","], "a": 2, "x": "When a dependent clause comes first, a comma separates it from the main clause. A semicolon or colon would be wrong, because a semicolon joins two independent clauses."}, {"h": "The man<span class=\"blank\" data-blank><\/span> called the police.", "ans": " whose car was stolen <i>(defining: says which man)<\/i>", "type": "mcq", "opts": ["whose car was stolen", ", whose car was stolen", ", whose car was stolen,"], "a": 0, "x": "The clause says which man, so it is defining and has no commas. The commas would suggest the man is already known and the clause is only extra detail."}, {"h": "The film<span class=\"blank\" data-blank><\/span> was made in Dhaka.", "ans": ", which won three awards, <i>(non-defining: which, commas on both sides)<\/i>", "type": "mcq", "opts": [", that won three awards,", ", which won three awards,", "which won three awards,"], "a": 1, "x": "The film is the thing, so use <i>which<\/i>. A non-defining clause does not use <i>that<\/i>, and it needs a comma before and after. Without the second comma the sentence has no clear end for the clause."}, {"h": "Some students prefer lectures<span class=\"blank\" data-blank><\/span>", "ans": "; others prefer seminars. <i>(a comma alone makes a comma splice)<\/i>", "type": "mcq", "opts": [", others prefer seminars.", "and, others prefer seminars.", "; others prefer seminars."], "a": 2, "x": "Two independent clauses cannot be joined with just a comma: that is a comma splice. Use a semicolon, a full stop or a conjunction. <i>And, others<\/i> is not a correct structure."}, {"h": "He left early<span class=\"blank\" data-blank><\/span>.", "ans": ", so he missed the speech <i>(comma before so)<\/i>", "type": "mcq", "opts": [", so he missed the speech", ", as a result he missed the speech", "; so he missed the speech"], "a": 0, "x": "<i>So<\/i> joins two clauses by showing a result, with a comma before it. <i>As a result<\/i> after a comma makes a comma splice, and a semicolon before <i>so<\/i> is not standard."}]}, {"l": "E", "t": "Reduced relatives and participle clauses", "i": "Choose the correct option.", "q": [{"h": "Students <span class=\"blank\" data-blank><\/span> abroad often feel homesick.", "ans": "studying <i>(reduced relative: -ing)<\/i>", "type": "mcq", "opts": ["studying", "who studying", "are studying"], "a": 0, "x": "A reduced relative clause replaces <i>who are studying<\/i> with the -ing form. You cannot keep <i>who<\/i> and also use only an -ing form. <i>Are studying<\/i> would need a separate subject."}, {"h": "The report <span class=\"blank\" data-blank><\/span> last year shows a decline.", "ans": "published <i>(reduced relative: past participle)<\/i>", "type": "mcq", "opts": ["publishing", "published", "was published"], "a": 1, "x": "<i>Published last year<\/i> is a past participle with a passive meaning (<i>which was published<\/i>). <i>Publishing<\/i> would mean the report publishes something, and <i>was published<\/i> adds a second verb before <i>shows<\/i>."}, {"h": "Sales peaked in 2015, <span class=\"blank\" data-blank><\/span> steadily afterwards.", "ans": "falling <i>(participle clause, same subject)<\/i>", "type": "mcq", "opts": ["fell", "fall", "falling"], "a": 2, "x": "After the comma, <i>falling<\/i> is a participle clause with the same subject as the main clause (<i>sales<\/i>). <i>Fell<\/i> would make a comma splice, because there would be two main verbs with only a comma."}, {"h": "<span class=\"blank\" data-blank><\/span> the survey, the researchers analysed the data.", "ans": "Having finished <i>(earlier action, same subject)<\/i>", "type": "mcq", "opts": ["Having finished", "After finish", "Finished to"], "a": 0, "x": "<i>Having finished<\/i> shows that one action was complete before the next one, and its subject is the same as the main clause (<i>the researchers<\/i>). The other options are not correct forms."}, {"h": "Walking along the street, <span class=\"blank\" data-blank><\/span>.", "ans": "I noticed a new cafe <i>(the subject must be the one walking)<\/i>", "type": "mcq", "opts": ["a new cafe caught my eye", "I noticed a new cafe", "the new cafe was noticed"], "a": 1, "x": "The subject of the main clause must be the person who is walking. <i>A new cafe caught my eye<\/i> suggests the cafe was walking: that is a dangling participle. <i>I noticed a new cafe<\/i> fixes it."}, {"h": "The survey <span class=\"blank\" data-blank><\/span> last year involved 500 people.", "ans": "conducted <i>(reduced relative: past participle)<\/i>", "type": "mcq", "opts": ["conducting", "was conducted", "conducted"], "a": 2, "x": "<i>Conducted last year<\/i> has a passive meaning (<i>which was conducted<\/i>), so use the past participle. <i>Conducting<\/i> means the survey conducted something, and <i>was conducted<\/i> adds a second finite verb."}, {"h": "The number of students <span class=\"blank\" data-blank><\/span> on online courses has doubled.", "ans": "enrolling <i>(reduced relative: -ing)<\/i>", "type": "mcq", "opts": ["enrolling", "enrolled to", "are enrolling"], "a": 0, "x": "A reduced relative clause with an active meaning uses -ing: <i>students enrolling<\/i> = <i>students who are enrolling<\/i>. <i>Enrolled to<\/i> is not correct, and <i>are enrolling<\/i> would add a second verb."}, {"h": "<span class=\"blank\" data-blank><\/span> the answer, she asked for help.", "ans": "Not knowing <i>(negative participle clause)<\/i>", "type": "mcq", "opts": ["Not known", "Not knowing", "No knowing"], "a": 1, "x": "To make a participle clause negative, put <i>not<\/i> before the participle: <i>Not knowing<\/i>. <i>Not known<\/i> has a passive meaning, and <i>no knowing<\/i> is not a correct form."}, {"h": "The man <span class=\"blank\" data-blank><\/span> next to me was a doctor.", "ans": "sitting <i>(reduced relative: -ing)<\/i>", "type": "mcq", "opts": ["sat", "is sitting", "sitting"], "a": 2, "x": "<i>Sitting next to me<\/i> = <i>who was sitting next to me<\/i>. <i>Sat<\/i> would be a second verb with no subject, and <i>is sitting<\/i> is the wrong tense for the past sentence."}, {"h": "The policy, <span class=\"blank\" data-blank><\/span> in 2010, reduced emissions.", "ans": "introduced <i>(non-defining reduced clause)<\/i>", "type": "mcq", "opts": ["introduced", "introducing", "was introduced"], "a": 0, "x": "<i>Introduced in 2010<\/i> is a past participle with a passive meaning: the policy was introduced. <i>Introducing<\/i> would mean the policy introduced something, and <i>was introduced<\/i> adds a finite verb inside the commas."}]}, {"l": "F", "t": "Combining sentences correctly", "i": "Choose the correct option.", "q": [{"h": "Car use rose between 2000 and 2020, <span class=\"blank\" data-blank><\/span>.", "ans": "while bus use fell <i>(while joins opposite trends)<\/i>", "type": "mcq", "opts": ["while bus use fell", "however bus use fell", "despite bus use fell"], "a": 0, "x": "<i>While<\/i> is a conjunction, so it can join the two trends in one sentence. <i>However<\/i> after a comma makes a comma splice, and <i>despite<\/i> needs a noun phrase."}, {"h": "The rent is high, <span class=\"blank\" data-blank><\/span>.", "ans": "so many students share flats <i>(so joins cause and result)<\/i>", "type": "mcq", "opts": ["therefore many students share flats", "so many students share flats", "but so many students share flats"], "a": 1, "x": "<i>So<\/i> joins a reason (<i>the rent is high<\/i>) and a result. <i>Therefore<\/i> is an adverb and cannot follow only a comma, and <i>but so<\/i> is not natural."}, {"h": "I admire my teacher<span class=\"blank\" data-blank><\/span>.", "ans": ", who inspired me to study English <i>(non-defining who)<\/i>", "type": "mcq", "opts": [", she inspired me to study English", ", that inspired me to study English", ", who inspired me to study English"], "a": 2, "x": "A non-defining clause with <i>who<\/i> adds extra information about the teacher. <i>She inspired me<\/i> after a comma is a comma splice, and <i>that<\/i> is not used after a comma."}, {"h": "Many people exercise regularly, <span class=\"blank\" data-blank><\/span>.", "ans": "which improves their health <i>(sentence relative)<\/i>", "type": "mcq", "opts": ["which improves their health", "that improves their health", "what improves their health"], "a": 0, "x": "<i>, which<\/i> refers to the whole idea of exercising regularly. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot refer back to an earlier clause."}, {"h": "She took the course <span class=\"blank\" data-blank><\/span>.", "ans": "so that she could improve her writing <i>(purpose clause)<\/i>", "type": "mcq", "opts": ["for that she could improve her writing", "so that she could improve her writing", "for improve her writing"], "a": 1, "x": "<i>So that<\/i> + a clause expresses purpose. <i>For that<\/i> and <i>for improve<\/i> are not correct, because <i>for<\/i> must be followed by a noun or -ing form."}, {"h": "It was <span class=\"blank\" data-blank><\/span> many students failed.", "ans": "such a difficult exam that <i>(such + a + adjective + noun)<\/i>", "type": "mcq", "opts": ["so a difficult exam that", "such difficult exam that", "such a difficult exam that"], "a": 2, "x": "With a singular countable noun, use <i>such + a + adjective + noun<\/i>: <i>such a difficult exam<\/i>. <i>So<\/i> is used with adjectives alone, and <i>such<\/i> without <i>a<\/i> is wrong for a singular noun."}, {"h": "The test was <span class=\"blank\" data-blank><\/span> many students failed.", "ans": "so difficult that <i>(so + adjective + that)<\/i>", "type": "mcq", "opts": ["so difficult that", "such difficult that", "so difficult than"], "a": 0, "x": "<i>So + adjective + that<\/i> shows a result. <i>Such<\/i> needs a noun after it, and <i>than<\/i> is for comparisons, not results."}, {"h": "He worked hard <span class=\"blank\" data-blank><\/span> the test.", "ans": "in order to pass <i>(in order to + base verb)<\/i>", "type": "mcq", "opts": ["in order that pass", "in order to pass", "for pass"], "a": 1, "x": "Purpose with the same subject uses <i>in order to<\/i> + base verb. <i>In order that<\/i> needs a full clause, and <i>for pass<\/i> is not correct."}, {"h": "I have a friend <span class=\"blank\" data-blank><\/span>.", "ans": "whose father is a pilot <i>(whose replaces his)<\/i>", "type": "mcq", "opts": ["who his father is a pilot", "which father is a pilot", "whose father is a pilot"], "a": 2, "x": "<i>Whose<\/i> replaces <i>his<\/i> and links the friend to the father. <i>Who his father<\/i> repeats the idea, and <i>which<\/i> is for things."}, {"h": "Young people spend hours online<span class=\"blank\" data-blank><\/span>.", "ans": ", so their sleep suffers <i>(comma before so)<\/i>", "type": "mcq", "opts": [", so their sleep suffers", ", as a result their sleep suffers", "; so their sleep suffers"], "a": 0, "x": "<i>So<\/i> joins two clauses and shows a result, with a comma before it. <i>As a result<\/i> after only a comma makes a comma splice, and a semicolon before <i>so<\/i> is not standard."}]}, {"l": "G", "t": "Noun clauses and appositives", "i": "Choose the correct option.", "q": [{"h": "It is not clear <span class=\"blank\" data-blank><\/span> the policy will work.", "ans": "whether <i>(whether = if or not)<\/i>", "type": "mcq", "opts": ["whether", "that", "what"], "a": 0, "x": "<i>Whether<\/i> introduces a noun clause that expresses a yes or no question: will the policy work or not? <i>That<\/i> would state a fact, and <i>what<\/i> needs a missing noun."}, {"h": "I do not know <span class=\"blank\" data-blank><\/span>.", "ans": "where he lives <i>(no inversion in noun clauses)<\/i>", "type": "mcq", "opts": ["where does he live", "where he lives", "where he does live"], "a": 1, "x": "In a noun clause, the word order is that of a
