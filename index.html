 "at", "on"], "a": 2, "x": "<b>On the rise<\/b> means increasing. Its opposite is <i>on the decline<\/i>."}, {"h": "The lift is <span class=\"blank\" data-blank><\/span> order.", "ans": "out of <i>(out of order)<\/i>", "type": "mcq", "opts": ["out of", "off", "outside"], "a": 0, "x": "<b>Out of order<\/b> means not working. Learn it with out of stock, out of date and out of work."}, {"h": "Students feel <span class=\"blank\" data-blank><\/span> pressure before exams.", "ans": "under <i>(under pressure)<\/i>", "type": "mcq", "opts": ["in", "under", "on"], "a": 1, "x": "<b>Under pressure<\/b> means feeling stressed. The same preposition appears in under control and under threat."}, {"h": "The textbook is <span class=\"blank\" data-blank><\/span> date.", "ans": "out of <i>(out of date)<\/i>", "type": "mcq", "opts": ["off", "outside of", "out of"], "a": 2, "x": "<b>Out of date<\/b> means old-fashioned or no longer valid. <i>Outside of date<\/i> is not a phrase."}, {"h": "Students study three hours <span class=\"blank\" data-blank><\/span> average.", "ans": "on <i>(on average)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 0, "x": "<b>On average<\/b> means typically. The fixed phrase uses on, not in."}, {"h": "He did it <span class=\"blank\" data-blank><\/span> purpose.", "ans": "on <i>(on purpose)<\/i>", "type": "mcq", "opts": ["by", "on", "with"], "a": 1, "x": "<b>On purpose<\/b> means deliberately. <i>By purpose<\/i> is wrong; compare by accident."}, {"h": "The fire is now <span class=\"blank\" data-blank><\/span> control.", "ans": "under <i>(under control)<\/i>", "type": "mcq", "opts": ["in", "on", "under"], "a": 2, "x": "<b>Under control<\/b> means managed. <i>In control<\/i> means having power, which is a different meaning."}, {"h": "Wildlife is <span class=\"blank\" data-blank><\/span> threat.", "ans": "under <i>(under threat)<\/i>", "type": "mcq", "opts": ["under", "in", "on"], "a": 0, "x": "<b>Under threat<\/b> means in danger. Learn it with at risk and in danger of."}]}, {"l": "H", "t": "Writing Task 1 prepositions", "i": "Choose the correct option.", "q": [{"h": "Sales rose <span class=\"blank\" data-blank><\/span> 20% to 35%.", "ans": "from <i>(from X to Y)<\/i>", "type": "mcq", "opts": ["from", "since", "of"], "a": 0, "x": "Use <b>from<\/b> to give the start value in a trend: <i>rose from 20% to 35%<\/i>."}, {"h": "Sales rose from 20% <span class=\"blank\" data-blank><\/span> 35%.", "ans": "to <i>(from X to Y)<\/i>", "type": "mcq", "opts": ["until", "to", "at"], "a": 1, "x": "The end value after <i>from<\/i> takes <b>to<\/b>. <i>From 20% until 35%<\/i> mixes two patterns."}, {"h": "It increased <span class=\"blank\" data-blank><\/span> 15%.", "ans": "by <i>(increase by + amount)<\/i>", "type": "mcq", "opts": ["of", "with", "by"], "a": 2, "x": "<b>Increase by<\/b> gives the amount of change. The noun form takes of: <i>an increase of 15%<\/i>."}, {"h": "There was a rise <span class=\"blank\" data-blank><\/span> unemployment.", "ans": "in <i>(a rise in + noun)<\/i>", "type": "mcq", "opts": ["in", "of", "on"], "a": 0, "x": "A change in a quantity takes <b>in<\/b>: <i>a rise in unemployment, a fall in prices<\/i>. Of is used for the amount."}, {"h": "It peaked <span class=\"blank\" data-blank><\/span> 60% in 2015.", "ans": "at <i>(peak at)<\/i>", "type": "mcq", "opts": ["on", "at", "in"], "a": 1, "x": "<b>Peak at<\/b> gives the highest value: <i>peaked at 60%<\/i>. Other verbs of level: stand at, remain at."}, {"h": "Sales stood <span class=\"blank\" data-blank><\/span> 40% for three years.", "ans": "at <i>(stand at)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 2, "x": "<b>Stand at<\/b> gives a steady level: <i>stood at 40%<\/i>. Other fixed verbs: peak at, level off at."}, {"h": "It <span class=\"blank\" data-blank><\/span> 50% in 2020.", "ans": "reached <i>(reach takes no preposition)<\/i>", "type": "mcq", "opts": ["reached", "reached to", "reached at"], "a": 0, "x": "<b>Reach<\/b> takes its object directly: <i>reached 50%<\/i>. <i>Reached to 50%<\/i> is a common error."}, {"h": "The price fell <span class=\"blank\" data-blank><\/span> five dollars, to a total of 10.", "ans": "by <i>(by = the amount of change)<\/i>", "type": "mcq", "opts": ["to", "by", "at"], "a": 1, "x": "<b>By<\/b> gives the amount of change, <b>to<\/b> gives the new level: <i>fell by five dollars, to ten dollars<\/i>."}, {"h": "Sales will reach 50% <span class=\"blank\" data-blank><\/span> 2030.", "ans": "by <i>(by = no later than)<\/i>", "type": "mcq", "opts": ["until", "at", "by"], "a": 2, "x": "<b>By<\/b> with a future year means no later than that year. Until would mean it continues to 2030."}, {"h": "Rent accounted <span class=\"blank\" data-blank><\/span> 30% of spending.", "ans": "for <i>(account for)<\/i>", "type": "mcq", "opts": ["for", "of", "to"], "a": 0, "x": "<b>Account for<\/b> means make up a share: <i>accounted for 30%<\/i>. It is a phrasal verb, so no of or to."}]}, {"l": "I", "t": "Confusing pairs", "i": "Choose the correct option.", "q": [{"h": "The train left <span class=\"blank\" data-blank><\/span> at 9 am sharp.", "ans": "on time <i>(on time = punctual)<\/i>", "type": "mcq", "opts": ["on time", "in time", "at time"], "a": 0, "x": "<b>On time<\/b> means punctual, exactly at the planned time. <b>In time<\/b> means early enough."}, {"h": "She tried many jobs, and <span class=\"blank\" data-blank><\/span> she became a teacher.", "ans": "in the end <i>(in the end = finally)<\/i>", "type": "mcq", "opts": ["at the end", "in the end", "on the end"], "a": 1, "x": "<b>In the end<\/b> means finally, after a long process. <b>At the end<\/b> needs of: <i>at the end of the film<\/i>."}, {"h": "The letter was written <span class=\"blank\" data-blank><\/span> my teacher.", "ans": "by <i>(by + the person)<\/i>", "type": "mcq", "opts": ["with", "from", "by"], "a": 2, "x": "<b>By<\/b> introduces the person who did the action in a passive sentence: <i>written by my teacher<\/i>."}, {"h": "She works <span class=\"blank\" data-blank><\/span> a nurse.", "ans": "as <i>(as + role)<\/i>", "type": "mcq", "opts": ["as", "like", "by"], "a": 0, "x": "<b>As<\/b> gives a role or job: <i>works as a nurse<\/i>. Like means similar to: <i>works like a nurse<\/i> says she is not one."}, {"h": "Everyone passed <span class=\"blank\" data-blank><\/span> Tom.", "ans": "except <i>(except takes no of)<\/i>", "type": "mcq", "opts": ["except of", "except", "excepting to"], "a": 1, "x": "<b>Except<\/b> takes no of. Learn: <i>except Tom<\/i>, <i>except for Tom<\/i>."}, {"h": "We went out <span class=\"blank\" data-blank><\/span> the rain.", "ans": "despite <i>(despite takes no of)<\/i>", "type": "mcq", "opts": ["despite of", "in spite", "despite"], "a": 2, "x": "<b>Despite<\/b> takes no of; <b>in spite of<\/b> keeps it. Never mix them into <i>despite of<\/i>."}, {"h": "We stayed home <span class=\"blank\" data-blank><\/span> the rain.", "ans": "because of <i>(because of + noun)<\/i>", "type": "mcq", "opts": ["because of", "because", "due"], "a": 0, "x": "<b>Because of<\/b> is followed by a noun. <b>Because<\/b> needs a full clause: <i>because it rained<\/i>."}, {"h": "Please be quiet <span class=\"blank\" data-blank><\/span> the exam.", "ans": "during <i>(during + noun)<\/i>", "type": "mcq", "opts": ["while", "during", "when"], "a": 1, "x": "<b>During<\/b> is followed by a noun: <i>during the exam<\/i>. While needs a subject and verb."}, {"h": "The secret stays <span class=\"blank\" data-blank><\/span> you and me.", "ans": "between <i>(between = two people)<\/i>", "type": "mcq", "opts": ["among", "in", "between"], "a": 2, "x": "<b>Between<\/b> is used for two people or things. Among is for three or more or a general group."}, {"h": "Mobile phones are popular <span class=\"blank\" data-blank><\/span> teenagers.", "ans": "among <i>(among a group)<\/i>", "type": "mcq", "opts": ["among", "between", "through"], "a": 0, "x": "<b>Among<\/b> is used for a group of three or more: <i>among teenagers, among students<\/i>."}]}, {"l": "J", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "The government should invest <span class=\"blank\" data-blank><\/span> public transport.", "ans": "in <i>(invest in)<\/i>", "type": "mcq", "opts": ["in", "on", "at"], "a": 0, "x": "<b>Invest in<\/b> is the correct pair. <i>Invest on<\/i> is a common mistake."}, {"h": "Students are very interested <span class=\"blank\" data-blank><\/span> online courses.", "ans": "in <i>(interested in)<\/i>", "type": "mcq", "opts": ["on", "in", "to"], "a": 1, "x": "<b>Interested in<\/b> is the adjective + preposition. <i>Interested on<\/i> and <i>interested to<\/i> are both wrong."}, {"h": "The report was written <span class=\"blank\" data-blank><\/span> a team of experts.", "ans": "by <i>(by + the writer)<\/i>", "type": "mcq", "opts": ["from", "with", "by"], "a": 2, "x": "<b>By<\/b> introduces the writer or the agent: <i>written by a team<\/i>. With would mean the tool."}, {"h": "This approach is different <span class=\"blank\" data-blank><\/span> the traditional method.", "ans": "from <i>(different from)<\/i>", "type": "mcq", "opts": ["from", "with", "of"], "a": 0, "x": "<b>Different from<\/b> is the standard form. <i>Different with<\/i> is wrong; <i>different to<\/i> is British informal."}, {"h": "Teenagers are addicted <span class=\"blank\" data-blank><\/span> social media.", "ans": "to <i>(addicted to)<\/i>", "type": "mcq", "opts": ["on", "to", "with"], "a": 1, "x": "<b>Addicted to<\/b> is the correct pair. After to you can use a noun or -ing: <i>addicted to playing games<\/i>."}, {"h": "The cost rose <span class=\"blank\" data-blank><\/span> 10% last year.", "ans": "by <i>(rose by + amount)<\/i>", "type": "mcq", "opts": ["with", "for", "by"], "a": 2, "x": "<b>Rose by<\/b> gives the amount: <i>rose by 10%<\/i>. <i>Rose with 10%<\/i> is a common mistake."}, {"h": "The number of cars has risen <span class=\"blank\" data-blank><\/span> 2010.", "ans": "since <i>(since + starting point)<\/i>", "type": "mcq", "opts": ["since", "for", "from"], "a": 0, "x": "<b>Since<\/b> needs a starting point: <i>since 2010<\/i>. With the present perfect, never use from."}, {"h": "Fees will fall <span class=\"blank\" data-blank><\/span> five years.", "ans": "within <i>(within = before the end of)<\/i>", "type": "mcq", "opts": ["on", "within", "at"], "a": 1, "x": "<b>Within<\/b> means before the end of the period. <i>Within five years<\/i> means any time in those five years."}, {"h": "Traffic jams are a big problem <span class=\"blank\" data-blank><\/span> large cities.", "ans": "in <i>(in + city)<\/i>", "type": "mcq", "opts": ["on", "at", "in"], "a": 2, "x": "Cities take <b>in<\/b>: <i>in large cities<\/i>. On and at are for surfaces and points."}, {"h": "The government is responsible <span class=\"blank\" data-blank><\/span> public health.", "ans": "for <i>(responsible for)<\/i>", "type": "mcq", "opts": ["for", "of", "to"], "a": 0, "x": "<b>Responsible for<\/b> is the correct pair. <i>Responsible of<\/i> is a common mistake."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) The lecture starts at 9 am on Monday.<br>B) The lecture starts in 9 am on Monday.<br>C) The lecture starts at 9 am in Monday.<br>D) The lecture starts on 9 am at Monday.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <b>at 9 am<\/b> (clock time) and <b>on Monday<\/b> (day). The others use in or on with the wrong time word."}, {"h": "A) We arrived to the airport and went to home by taxi.<br>B) We arrived at the airport and went home by taxi.<br>C) We arrived at the airport and went at home with taxi.<br>D) We arrived in the airport and went to home by a taxi.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <b>arrived at<\/b> the airport, <b>went home<\/b> (no to), <b>by taxi<\/b> (no article). Each other option has two or three errors."}, {"h": "A) Despite of the rain, everyone came except of Tom.<br>B) In spite the rain, everyone came except Tom.<br>C) Despite the rain, everyone came except Tom.<br>D) Despite the rain, everyone came excepting Tom.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: <b>despite<\/b> and <b>except<\/b> take no of. The other options add of or change the word."}, {"h": "A) She has lived here for 2015 and works like a nurse.<br>B) She has lived here since 2015 and works like a nurse.<br>C) She has lived here for 2015 and works as nurse.<br>D) She has lived here since 2015 and works as a nurse.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: <b>since 2015<\/b> (a starting point) and <b>works as a nurse<\/b> (a job role). For needs a length of time."}, {"h": "A) Sales rose from 20% to 35% between 2010 and 2020.<br>B) Sales rose from 20% until 35% between 2010 to 2020.<br>C) Sales rose of 20% to 35% between 2010 and 2020.<br>D) Sales rose from 20% to 35% between 2010 to 2020.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <b>from 20% to 35%<\/b> and <b>between 2010 and 2020<\/b>. The others mix from with until or between with to."}, {"h": "A) Submit your essay until Friday and wait by Monday.<br>B) Submit your essay by Friday and wait until Monday.<br>C) Submit your essay by Friday and wait by Monday.<br>D) Submit your essay until Friday and wait until Monday.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <b>by Friday<\/b> is the deadline, and <b>until Monday<\/b> is how long you wait. The other options swap them."}, {"h": "A) Mobile phones are popular between teenagers on big cities.<br>B) Mobile phones are popular among teenagers at big cities.<br>C) Mobile phones are popular among teenagers in big cities.<br>D) Mobile phones are popular between teenagers in big cities.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: <b>among<\/b> a group of teenagers and <b>in<\/b> big cities. Between needs two items, and on or at is wrong for cities."}, {"h": "A) We discussed about the plan while the meeting.<br>B) We discussed about the plan during the meeting.<br>C) We discussed the plan while the meeting.<br>D) We discussed the plan during the meeting.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: <b>discussed<\/b> takes no preposition and <b>during<\/b> is followed by the noun <i>the meeting<\/i>. While needs a clause."}, {"h": "A) She is good at maths and interested in science.<br>B) She is good in maths and interested on science.<br>C) She is good at maths and interested on science.<br>D) She is good in maths and interested in science.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <b>good at<\/b> maths and <b>interested in<\/b> science. Good in and interested on are common errors."}, {"h": "A) He lives in the third floor at 25 Park Road.<br>B) He lives on the third floor at 25 Park Road.<br>C) He lives on the third floor in 25 Park Road.<br>D) He lives in the third floor on 25 Park Road.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <b>on the third floor<\/b> and <b>at 25 Park Road<\/b>. A floor takes on, and a full address takes at."}]}]}, {"n": 9, "title": "Collocations and Phrasal Verbs: Natural Word Partnerships", "level": "Level 2 · Band 6 to 8", "g": [{"l": "A", "t": "Verb + noun", "i": "Choose the correct option.", "q": [{"h": "Students must <span class=\"blank\" data-blank><\/span> research before writing the essay.", "ans": "do <i>(do research)<\/i>", "type": "mcq", "opts": ["do", "make", "take"], "a": 0, "x": "<i>Research<\/i> is something you <b>do<\/b>: <i>do research<\/i>. It is also uncountable, so never <i>a research<\/i>. <i>Make research<\/i> is a common translation error, and <i>take research<\/i> does not exist."}, {"h": "I <span class=\"blank\" data-blank><\/span> a serious mistake in the first paragraph.", "ans": "made <i>(make a mistake)<\/i>", "type": "mcq", "opts": ["did", "made", "took"], "a": 1, "x": "A mistake is something you <b>make<\/b>: <i>make a mistake<\/i>. <i>Do a mistake<\/i> is the most common verb + noun error at band 6. <i>Took a mistake<\/i> is not used."}, {"h": "Governments need to <span class=\"blank\" data-blank><\/span> immediate action to reduce pollution.", "ans": "take <i>(take action)<\/i>", "type": "mcq", "opts": ["make", "do", "take"], "a": 2, "x": "<b>Take action<\/b> is the fixed phrase for acting on a problem. <i>Make action<\/i> and <i>do action<\/i> do not exist, and <i>action<\/i> is uncountable here, so no <i>an<\/i> or plural."}, {"h": "It is hard to <span class=\"blank\" data-blank><\/span> a decision without enough information.", "ans": "make <i>(make a decision)<\/i>", "type": "mcq", "opts": ["make", "do", "take"], "a": 0, "x": "A decision is something you <b>make<\/b>: <i>make a decision<\/i>. British English also accepts <i>take a decision<\/i>, but <i>do a decision<\/i> is always wrong. In IELTS, <i>make<\/i> is the safe choice."}, {"h": "Teachers should <span class=\"blank\" data-blank><\/span> attention to weaker students.", "ans": "pay <i>(pay attention)<\/i>", "type": "mcq", "opts": ["give", "pay", "make"], "a": 1, "x": "Attention is <b>paid<\/b>, not given: <i>pay attention to<\/i>. <i>Give attention<\/i> is a translation from other languages. <i>Make attention<\/i> does not exist."}, {"h": "The two countries finally <span class=\"blank\" data-blank><\/span> an agreement.", "ans": "reached <i>(reach an agreement)<\/i>", "type": "mcq", "opts": ["arrived", "made", "reached"], "a": 2, "x": "Countries <b>reach<\/b> an agreement. <i>Arrive<\/i> needs a preposition and a place (<i>arrive at a decision<\/i>), and <i>make an agreement<\/i> is not natural. <i>Reach<\/i> takes no preposition."}, {"h": "Parents <span class=\"blank\" data-blank><\/span> an important role in a child's education.", "ans": "play <i>(play a role)<\/i>", "type": "mcq", "opts": ["play", "do", "make"], "a": 0, "x": "A role is something you <b>play<\/b>: <i>play an important role<\/i>. <i>Do a role<\/i> and <i>make a role<\/i> are not used. You can also say <i>play a part<\/i>."}, {"h": "Candidates must <span class=\"blank\" data-blank><\/span> the entry requirements.", "ans": "meet <i>(meet requirements)<\/i>", "type": "mcq", "opts": ["do", "meet", "make"], "a": 1, "x": "You <b>meet<\/b> requirements, standards, needs and deadlines: <i>meet the requirements<\/i>. <i>Do requirements<\/i> and <i>make requirements<\/i> are not natural."}, {"h": "Exercise can <span class=\"blank\" data-blank><\/span> a positive effect on mental health.", "ans": "have <i>(have an effect)<\/i>", "type": "mcq", "opts": ["do", "give", "have"], "a": 2, "x": "An effect is something you <b>have<\/b> on something: <i>have a positive effect on<\/i>. <i>Do an effect<\/i> and <i>give an effect<\/i> are errors. You can also <i>make an impact<\/i>, but not <i>make an effect<\/i>."}, {"h": "The report <span class=\"blank\" data-blank><\/span> a clear picture of the problem.", "ans": "gives <i>(give a picture)<\/i>", "type": "mcq", "opts": ["gives", "makes", "does"], "a": 0, "x": "A report <b>gives<\/b> a picture, an overview or an example: <i>give a clear picture of<\/i>. <i>Make a picture<\/i> and <i>do a picture<\/i> do not fit this meaning."}]}, {"l": "B", "t": "Adjective + noun", "i": "Choose the correct option.", "q": [{"h": "The city suffers from <span class=\"blank\" data-blank><\/span> traffic during rush hour.", "ans": "heavy <i>(heavy traffic)<\/i>", "type": "mcq", "opts": ["heavy", "strong", "big"], "a": 0, "x": "We say <b>heavy traffic<\/b>, heavy rain and heavy pollution. <i>Strong traffic<\/i> and <i>big traffic<\/i> are translations. <i>Strong<\/i> is for wind, tea, evidence and opinions."}, {"h": "There is a <span class=\"blank\" data-blank><\/span> shortage of skilled nurses.", "ans": "severe <i>(severe shortage)<\/i>", "type": "mcq", "opts": ["hard", "severe", "strong"], "a": 1, "x": "<b>Severe shortage<\/b> is the natural collocation. <i>Serious shortage<\/i> is also fine, but <i>hard shortage<\/i> and <i>strong shortage<\/i> do not exist."}, {"h": "The survey shows a <span class=\"blank\" data-blank><\/span> range of opinions.", "ans": "wide <i>(a wide range)<\/i>", "type": "mcq", "opts": ["long", "tall", "wide"], "a": 2, "x": "We say <b>a wide range of<\/b>. <i>Long range<\/i> and <i>tall range<\/i> do not fit. You can also say <i>a broad range<\/i>, but not <i>a large range<\/i> in formal writing."}, {"h": "Social media has a <span class=\"blank\" data-blank><\/span> influence on teenagers.", "ans": "profound <i>(profound influence)<\/i>", "type": "mcq", "opts": ["profound", "heavy", "tall"], "a": 0, "x": "<b>Profound influence<\/b> is a Band 8 collocation, and it means a very deep influence. <i>Heavy influence<\/i> and <i>tall influence<\/i> are not natural. Use <i>strong, considerable<\/i> or <i>profound<\/i>."}, {"h": "Many graduates face <span class=\"blank\" data-blank><\/span> competition for jobs.", "ans": "fierce <i>(fierce competition)<\/i>", "type": "mcq", "opts": ["heavy", "fierce", "wide"], "a": 1, "x": "<b>Fierce competition<\/b> means very strong rivalry. <i>Heavy competition<\/i> and <i>wide competition<\/i> are not used. <i>Strong<\/i> and <i>intense<\/i> also work."}, {"h": "A <span class=\"blank\" data-blank><\/span> diet is essential for good health.", "ans": "balanced <i>(balanced diet)<\/i>", "type": "mcq", "opts": ["equal", "even", "balanced"], "a": 2, "x": "<b>Balanced diet<\/b> is a fixed phrase. <i>Equal diet<\/i> and <i>even diet<\/i> do not exist. A balanced diet contains the right amounts of each food group."}, {"h": "Gaining <span class=\"blank\" data-blank><\/span> experience abroad helps graduates.", "ans": "valuable <i>(valuable experience)<\/i>", "type": "mcq", "opts": ["valuable", "worth", "precious"], "a": 0, "x": "<b>Valuable experience<\/b> is natural. <i>Worth experience<\/i> is not grammatical, and <i>precious experience<\/i> sounds unnatural. <i>Valuable<\/i> goes with experience, advice, lesson and resource."}, {"h": "There was <span class=\"blank\" data-blank><\/span> criticism of the decision.", "ans": "widespread <i>(widespread criticism)<\/i>", "type": "mcq", "opts": ["wide", "widespread", "spreading"], "a": 1, "x": "<b>Widespread criticism<\/b> means criticism found in many places. <i>Wide criticism<\/i> and <i>spreading criticism<\/i> are incorrect forms. <i>Widespread<\/i> goes with concern, use, belief and support."}, {"h": "Many cities have <span class=\"blank\" data-blank><\/span> levels of air pollution.", "ans": "high <i>(high levels)<\/i>", "type": "mcq", "opts": ["tall", "big", "high"], "a": 2, "x": "We say <b>high levels<\/b> of pollution. <i>Tall levels<\/i> is wrong, and <i>big levels<\/i> is a translation error. Use <i>high / low<\/i> with level, rate, price and cost."}, {"h": "Obesity has become a <span class=\"blank\" data-blank><\/span> public health problem.", "ans": "serious <i>(serious problem)<\/i>", "type": "mcq", "opts": ["serious", "hard", "strong"], "a": 0, "x": "<b>Serious problem<\/b> is natural. <i>Hard problem<\/i> means difficult to solve, and <i>strong problem<\/i> is not used. In IELTS, <i>serious, major<\/i> and <i>significant<\/i> all go with problem."}]}, {"l": "C", "t": "Adverb + adjective and verb + adverb", "i": "Choose the correct option.", "q": [{"h": "Success in IELTS is <span class=\"blank\" data-blank><\/span> likely if you practise daily.", "ans": "highly <i>(highly likely)<\/i>", "type": "mcq", "opts": ["highly", "strongly", "heavily"], "a": 0, "x": "<b>Highly likely<\/b> is a fixed pair. <i>Strongly likely<\/i> and <i>heavily likely<\/i> are wrong. <i>Highly<\/i> also goes with unlikely, effective, skilled and successful."}, {"h": "Many parents are <span class=\"blank\" data-blank><\/span> concerned about screen time.", "ans": "deeply <i>(deeply concerned)<\/i>", "type": "mcq", "opts": ["highly", "deeply", "strongly"], "a": 1, "x": "<b>Deeply concerned<\/b> is natural. <i>Highly concerned<\/i> and <i>strongly concerned<\/i> are not used. <i>Deeply<\/i> goes with feelings: concerned, worried, grateful, unhappy."}, {"h": "I <span class=\"blank\" data-blank><\/span> agree with this view.", "ans": "strongly <i>(strongly agree)<\/i>", "type": "mcq", "opts": ["highly", "deeply", "strongly"], "a": 2, "x": "<b>Strongly agree / disagree<\/b> is the fixed pair. <i>Highly agree<\/i> and <i>deeply agree<\/i> are errors that appear in many Speaking answers."}, {"h": "Prices rose <span class=\"blank\" data-blank><\/span> in 2020.", "ans": "sharply <i>(rise sharply)<\/i>", "type": "mcq", "opts": ["sharply", "strongly", "hardly"], "a": 0, "x": "Prices <b>rise sharply<\/b>. <i>Strongly<\/i> does not go with rise, and <i>hardly<\/i> means almost not at all, so the meaning changes. Use <i>sharply, steadily, dramatically<\/i>."}, {"h": "The economy depends <span class=\"blank\" data-blank><\/span> on tourism.", "ans": "heavily <i>(depend heavily on)<\/i>", "type": "mcq", "opts": ["highly", "heavily", "hardly"], "a": 1, "x": "<b>Depend heavily on<\/b> means depend to a large degree. <i>Highly depend<\/i> is an error, and <i>hardly<\/i> means almost not. <i>Heavily<\/i> also goes with rely, invest and tax."}, {"h": "Temperatures have been rising <span class=\"blank\" data-blank><\/span> for decades.", "ans": "steadily <i>(an adverb modifies the verb)<\/i>", "type": "mcq", "opts": ["steady", "steadiness", "steadily"], "a": 2, "x": "An <b>adverb<\/b> (<i>steadily<\/i>) modifies the verb <i>rising<\/i>. <i>Steady<\/i> is an adjective, and <i>steadiness<\/i> is a noun. Add <i>-ly<\/i> to the adjective to make most adverbs."}, {"h": "The two ideas are <span class=\"blank\" data-blank><\/span> related.", "ans": "closely <i>(closely related)<\/i>", "type": "mcq", "opts": ["closely", "near", "nearly"], "a": 0, "x": "<b>Closely related<\/b> is a fixed pair. <i>Near related<\/i> and <i>nearly related<\/i> are errors. <i>Closely<\/i> goes with related, linked, connected and associated."}, {"h": "Children are <span class=\"blank\" data-blank><\/span> influenced by advertising.", "ans": "easily <i>(easily influenced)<\/i>", "type": "mcq", "opts": ["easy", "easily", "ease"], "a": 1, "x": "The adverb <b>easily<\/b> modifies <i>influenced<\/i>. <i>Easy<\/i> is an adjective and <i>ease<\/i> is a noun. <i>Easily influenced / led / distracted<\/i> are common."}, {"h": "The exam was <span class=\"blank\" data-blank><\/span> difficult.", "ans": "extremely <i>(extremely difficult)<\/i>", "type": "mcq", "opts": ["much", "strongly", "extremely"], "a": 2, "x": "<b>Extremely difficult<\/b> is natural. <i>Much difficult<\/i> is wrong, because <i>much<\/i> does not modify an adjective in this way. <i>Strongly difficult<\/i> does not exist."}, {"h": "Technology is changing <span class=\"blank\" data-blank><\/span> in education.", "ans": "rapidly <i>(rapidly, not fastly)<\/i>", "type": "mcq", "opts": ["rapidly", "fastly", "rapid"], "a": 0, "x": "The adverb of <i>rapid<\/i> is <b>rapidly<\/b>. <i>Fastly<\/i> does not exist: <i>fast<\/i> is both the adjective and the adverb. <i>Rapid<\/i> is an adjective and cannot modify a verb."}]}, {"l": "E", "t": "Noun + preposition", "i": "Choose the correct option.", "q": [{"h": "There has been a sharp rise <span class=\"blank\" data-blank><\/span> house prices.", "ans": "in <i>(a rise in prices)<\/i>", "type": "mcq", "opts": ["in", "of", "on"], "a": 0, "x": "We say <b>a rise in<\/b> + thing: <i>a rise in house prices<\/i>. <i>Of<\/i> is for the amount: <i>a rise of 5%<\/i>. <i>A rise on prices<\/i> is wrong."}, {"h": "Many rural areas have a lack <span class=\"blank\" data-blank><\/span> clean water.", "ans": "of <i>(a lack of)<\/i>", "type": "mcq", "opts": ["in", "of", "for"], "a": 1, "x": "We say <b>a lack of<\/b> + noun: <i>a lack of clean water<\/i>. <i>A lack in<\/i> and <i>a lack for<\/i> are common translation errors."}, {"h": "Online shopping has had a major impact <span class=\"blank\" data-blank><\/span> high streets.", "ans": "on <i>(an impact on)<\/i>", "type": "mcq", "opts": ["to", "of", "on"], "a": 2, "x": "We say <b>an impact on<\/b> + thing. <i>Impact to<\/i> and <i>impact of<\/i> are wrong in this sentence. The same applies to <i>an effect on<\/i> and <i>an influence on<\/i>."}, {"h": "There is a growing demand <span class=\"blank\" data-blank><\/span> skilled workers.", "ans": "for <i>(demand for)<\/i>", "type": "mcq", "opts": ["for", "of", "to"], "a": 0, "x": "We say <b>demand for<\/b> + noun: <i>demand for skilled workers<\/i>. <i>Demand of<\/i> and <i>demand to<\/i> are errors with this meaning."}, {"h": "Many students have difficulty <span class=\"blank\" data-blank><\/span> grammar.", "ans": "with <i>(difficulty with)<\/i>", "type": "mcq", "opts": ["of", "with", "on"], "a": 1, "x": "We say <b>difficulty with<\/b> + noun, or <i>difficulty (in) doing<\/i> + -ing. <i>Difficulty of grammar<\/i> and <i>difficulty on grammar<\/i> are not used."}, {"h": "People in remote areas have limited access <span class=\"blank\" data-blank><\/span> healthcare.", "ans": "to <i>(access to)<\/i>", "type": "mcq", "opts": ["of", "for", "to"], "a": 2, "x": "We say <b>access to<\/b> + noun: <i>access to healthcare<\/i>. <i>Access of<\/i> and <i>access for<\/i> change the meaning or are not used here."}, {"h": "The government should reduce the cost <span class=\"blank\" data-blank><\/span> university education.", "ans": "of <i>(the cost of)<\/i>", "type": "mcq", "opts": ["of", "for", "to"], "a": 0, "x": "We say <b>the cost of<\/b> + noun: <i>the cost of education<\/i>. <i>The cost for<\/i> is used for a person (<i>the cost for students<\/i>), and <i>to<\/i> is wrong here."}, {"h": "Young people show little interest <span class=\"blank\" data-blank><\/span> politics.", "ans": "in <i>(interest in)<\/i>", "type": "mcq", "opts": ["on", "in", "for"], "a": 1, "x": "We say <b>interest in<\/b>: <i>interest in politics<\/i>. <i>Interest on<\/i> means money paid on a loan, and <i>interest for<\/i> is a translation error."}, {"h": "Education is the key <span class=\"blank\" data-blank><\/span> economic growth.", "ans": "to <i>(the key to)<\/i>", "type": "mcq", "opts": ["of", "for", "to"], "a": 2, "x": "We say <b>the key to<\/b> + noun: <i>the key to success<\/i>. <i>The key of<\/i> and <i>the key for<\/i> are not used in this meaning."}, {"h": "There is a clear link <span class=\"blank\" data-blank><\/span> education and income.", "ans": "between <i>(a link between two things)<\/i>", "type": "mcq", "opts": ["between", "among", "of"], "a": 0, "x": "We say <b>a link between<\/b> two things: <i>a link between education and income<\/i>. <i>Among<\/i> is for three or more, and <i>of<\/i> does not fit."}]}, {"l": "F", "t": "Verb + preposition", "i": "Choose the correct option.", "q": [{"h": "Success depends <span class=\"blank\" data-blank><\/span> hard work.", "ans": "on <i>(depend on)<\/i>", "type": "mcq", "opts": ["on", "of", "from"], "a": 0, "x": "We say <b>depend on<\/b>. <i>Depend of<\/i> and <i>depend from<\/i> are translation errors. The same preposition follows <i>rely, focus, concentrate<\/i> and <i>insist<\/i>."}, {"h": "Poor diet can result <span class=\"blank\" data-blank><\/span> serious illness.", "ans": "in <i>(result in = cause)<\/i>", "type": "mcq", "opts": ["to", "in", "with"], "a": 1, "x": "<b>Result in<\/b> means <i>cause<\/i>: <i>poor diet results in illness<\/i>. <i>Result from<\/i> means <i>be caused by<\/i>. <i>Result to<\/i> and <i>result with<\/i> are not used."}, {"h": "Sugar contributes <span class=\"blank\" data-blank><\/span> obesity.", "ans": "to <i>(contribute to)<\/i>", "type": "mcq", "opts": ["for", "in", "to"], "a": 2, "x": "We say <b>contribute to<\/b>: <i>contribute to obesity<\/i>. <i>Contribute for<\/i> and <i>contribute in<\/i> are errors. Learn it with <i>lead to<\/i> and <i>respond to<\/i>."}, {"h": "Students must apply <span class=\"blank\" data-blank><\/span> a visa.", "ans": "for <i>(apply for)<\/i>", "type": "mcq", "opts": ["for", "at", "on"], "a": 0, "x": "We say <b>apply for<\/b> a visa, a job, a loan. <i>Apply to<\/i> is used for a place: <i>apply to a university<\/i>. <i>Apply at<\/i> and <i>apply on<\/i> do not fit here."}, {"h": "The government should invest more <span class=\"blank\" data-blank><\/span> public transport.", "ans": "in <i>(invest in)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 1, "x": "We say <b>invest in<\/b>: <i>invest in public transport<\/i>. <i>Invest on<\/i> is a very common error. <i>Invest at<\/i> does not exist."}, {"h": "Parents should protect children <span class=\"blank\" data-blank><\/span> danger.", "ans": "from <i>(protect from)<\/i>", "type": "mcq", "opts": ["of", "to", "from"], "a": 2, "x": "We say <b>protect someone from<\/b> danger. <i>Protect of<\/i> and <i>protect to<\/i> are errors. <i>Protect against<\/i> is used for illnesses and risks."}, {"h": "Many people suffer <span class=\"blank\" data-blank><\/span> stress.", "ans": "from <i>(suffer from)<\/i>", "type": "mcq", "opts": ["from", "of", "by"], "a": 0, "x": "We say <b>suffer from<\/b> a problem. <i>Suffer of<\/i> and <i>suffer by<\/i> are common errors. <i>Suffer from<\/i> goes with stress, illness, shortages."}, {"h": "Researchers are focusing <span class=\"blank\" data-blank><\/span> renewable energy.", "ans": "on <i>(focus on)<\/i>", "type": "mcq", "opts": ["in", "on", "to"], "a": 1, "x": "We say <b>focus on<\/b>. <i>Focus in<\/i> and <i>focus to<\/i> are errors. The same preposition follows <i>concentrate<\/i> and <i>concentrate on<\/i>."}, {"h": "The report refers <span class=\"blank\" data-blank><\/span> several earlier studies.", "ans": "to <i>(refer to)<\/i>", "type": "mcq", "opts": ["at", "on", "to"], "a": 2, "x": "We say <b>refer to<\/b>: <i>the report refers to earlier studies<\/i>. <i>Refer at<\/i> and <i>refer on<\/i> are not used. <i>Refer to<\/i> also means <i>mention<\/i>."}, {"h": "This approach differs <span class=\"blank\" data-blank><\/span> the traditional method.", "ans": "from <i>(differ from)<\/i>", "type": "mcq", "opts": ["from", "of", "with"], "a": 0, "x": "We say <b>differ from<\/b> something. <i>Differ of<\/i> is wrong, and <i>differ with<\/i> means <i>disagree with<\/i> a person, which changes the meaning."}]}, {"l": "G", "t": "Adjective + preposition", "i": "Choose the correct option.", "q": [{"h": "He is responsible <span class=\"blank\" data-blank><\/span> the project.", "ans": "for <i>(responsible for)<\/i>", "type": "mcq", "opts": ["for", "of", "to"], "a": 0, "x": "We say <b>responsible for<\/b> a thing. <i>Responsible to<\/i> is used for a person you report to (<i>responsible to the manager<\/i>). <i>Responsible of<\/i> is a translation error."}, {"h": "Many teenagers are addicted <span class=\"blank\" data-blank><\/span> social media.", "ans": "to <i>(addicted to)<\/i>", "type": "mcq", "opts": ["on", "to", "with"], "a": 1, "x": "We say <b>addicted to<\/b>: <i>addicted to social media<\/i>. <i>Addicted on<\/i> and <i>addicted with<\/i> are errors. In this phrase, <i>to<\/i> is a preposition: <i>addicted to playing games<\/i>."}, {"h": "Students should be aware <span class=\"blank\" data-blank><\/span> the risks.", "ans": "of <i>(aware of)<\/i>", "type": "mcq", "opts": ["about", "on", "of"], "a": 2, "x": "We say <b>aware of<\/b> a risk. <i>Aware about<\/i> is a common error in some regions. The noun is <i>awareness of<\/i>: <i>raise awareness of the risks<\/i>."}, {"h": "The city is famous <span class=\"blank\" data-blank><\/span> its markets.", "ans": "for <i>(famous for)<\/i>", "type": "mcq", "opts": ["for", "of", "by"], "a": 0, "x": "We say <b>famous for<\/b> a quality or product. <i>Famous of<\/i> and <i>famous by<\/i> are errors. <i>Famous as<\/i> is used for a role: <i>famous as a writer<\/i>."}, {"h": "Many graduates are capable <span class=\"blank\" data-blank><\/span> handling complex tasks.", "ans": "of <i>(capable of + -ing)<\/i>", "type": "mcq", "opts": ["to", "of", "for"], "a": 1, "x": "We say <b>capable of<\/b>, and a verb after it takes <b>-ing<\/b>: <i>capable of handling<\/i>. <i>Capable to<\/i> and <i>capable for<\/i> are errors."}, {"h": "People are increasingly concerned <span class=\"blank\" data-blank><\/span> climate change.", "ans": "about <i>(concerned about)<\/i>", "type": "mcq", "opts": ["of", "on", "about"], "a": 2, "x": "We say <b>concerned about<\/b> a problem. <i>Concerned for<\/i> means worried about someone's safety, and <i>concerned of<\/i> is an error."}, {"h": "The cost is similar <span class=\"blank\" data-blank><\/span> last year's.", "ans": "to <i>(similar to)<\/i>", "type": "mcq", "opts": ["to", "with", "as"], "a": 0, "x": "We say <b>similar to<\/b>: <i>similar to last year's<\/i>. <i>Similar with<\/i> and <i>similar as<\/i> are errors. Compare <i>the same as<\/i> and <i>different from<\/i>."}, {"h": "Girls are often better <span class=\"blank\" data-blank><\/span> languages than boys.", "ans": "at <i>(better at)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 1, "x": "We say <b>good / better at<\/b> a skill. <i>Better in<\/i> and <i>better on<\/i> are errors with skills. <i>Good in<\/i> is used for a subject area only in some contexts."}, {"h": "Some students are not satisfied <span class=\"blank\" data-blank><\/span> their results.", "ans": "with <i>(satisfied with)<\/i>", "type": "mcq", "opts": ["of", "for", "with"], "a": 2, "x": "We say <b>satisfied with<\/b> a result. <i>Satisfied of<\/i> and <i>satisfied for<\/i> are errors. The same goes for <i>pleased with<\/i> and <i>happy with<\/i>."}, {"h": "Children are fond <span class=\"blank\" data-blank><\/span> animals.", "ans": "of <i>(fond of)<\/i>", "type": "mcq", "opts": ["of", "to", "for"], "a": 0, "x": "We say <b>fond of<\/b>. <i>Fond to<\/i> and <i>fond for<\/i> are errors. Similar: <i>proud of, afraid of, tired of<\/i>."}]}, {"l": "H", "t": "Phrasal verbs: meaning and form", "i": "Choose the correct option.", "q": [{"h": "Researchers will <span class=\"blank\" data-blank><\/span> a survey next month.", "ans": "carry out <i>(carry out = perform)<\/i>", "type": "mcq", "opts": ["carry out", "carry up", "carry on"], "a": 0, "x": "<b>Carry out<\/b> means perform or conduct: <i>carry out a survey / research / an experiment<\/i>. <i>Carry on<\/i> means continue, and <i>carry up<\/i> does not fit."}, {"h": "The council promised to <span class=\"blank\" data-blank><\/span> the complaints.", "ans": "look into <i>(look into = investigate)<\/i>", "type": "mcq", "opts": ["look after", "look into", "look for"], "a": 1, "x": "<b>Look into<\/b> means investigate. <i>Look after<\/i> means take care of, and <i>look for<\/i> means search. <i>Look into the complaints<\/i> = examine them."}, {"h": "To save energy, please <span class=\"blank\" data-blank><\/span> the lights when you leave.", "ans": "turn off <i>(turn off = stop a machine)<\/i>", "type": "mcq", "opts": ["turn up", "turn on", "turn off"], "a": 2, "x": "<b>Turn off<\/b> means stop a machine or light. <i>Turn on<\/i> starts it, so it does not save energy. <i>Turn up<\/i> means increase the volume or heat."}, {"h": "She <span class=\"blank\" data-blank><\/span> an excellent solution.", "ans": "came up with <i>(come up with = think of)<\/i>", "type": "mcq", "opts": ["came up with", "came across", "came down with"], "a": 0, "x": "<b>Come up with<\/b> means think of an idea or plan. <i>Come across<\/i> means find by chance, and <i>come down with<\/i> means become ill."}, {"h": "Many people <span class=\"blank\" data-blank><\/span> long commutes because housing is cheaper.", "ans": "put up with <i>(put up with = tolerate)<\/i>", "type": "mcq", "opts": ["put off", "put up with", "put away"], "a": 1, "x": "<b>Put up with<\/b> means tolerate. <i>Put off<\/i> means postpone, and <i>put away<\/i> means store. The meaning here is tolerate long commutes."}, {"h": "The match was <span class=\"blank\" data-blank><\/span> because of heavy rain.", "ans": "called off <i>(call off = cancel)<\/i>", "type": "mcq", "opts": ["called up", "called in", "called off"], "a": 2, "x": "<b>Call off<\/b> means cancel. <i>Call up<\/i> means telephone or summon, and <i>call in<\/i> means visit or ask for help. Rain cancels a match."}, {"h": "I am looking forward <span class=\"blank\" data-blank><\/span> you next week.", "ans": "to meeting <i>(look forward to + -ing)<\/i>", "type": "mcq", "opts": ["to meeting", "to meet", "for meeting"], "a": 0, "x": "<b>Look forward to<\/b> is followed by <b>-ing<\/b>, because <i>to<\/i> is a preposition: <i>looking forward to meeting<\/i>. <i>To meet<\/i> and <i>for meeting<\/i> are errors."}, {"h": "If you do not know the word, <span class=\"blank\" data-blank><\/span> in a dictionary.", "ans": "look it up <i>(pronoun between verb and particle)<\/i>", "type": "mcq", "opts": ["look up it", "look it up", "look at up"], "a": 1, "x": "With a pronoun object, a separable phrasal verb must be split: <b>look it up<\/b>. <i>Look up it<\/i> is wrong. <i>Look at up<\/i> does not exist."}, {"h": "The teacher <span class=\"blank\" data-blank><\/span> the worksheets at the start of the class.", "ans": "handed out <i>(hand out = distribute)<\/i>", "type": "mcq", "opts": ["handed in", "handed up", "handed out"], "a": 2, "x": "<b>Hand out<\/b> means give to each person. <i>Hand in<\/i> means submit (a student hands in homework). <i>Hand up<\/i> is not used."}, {"h": "Please <span class=\"blank\" data-blank><\/span> and return the form.", "ans": "fill it in <i>(pronoun between verb and particle)<\/i>", "type": "mcq", "opts": ["fill it in", "fill in it", "fill in them"], "a": 0, "x": "With a pronoun, split the phrasal verb: <b>fill it in<\/b>. <i>Fill in it<\/i> and <i>fill in them<\/i> are wrong. With a long noun you can say <i>fill in the form<\/i>."}]}, {"l": "I", "t": "Phrasal verbs: meaning in context", "i": "Choose the correct option.", "q": [{"h": "Unemployment <span class=\"blank\" data-blank><\/span> sharply last year.", "ans": "went up <i>(go up = increase)<\/i>", "type": "mcq", "opts": ["went up", "went off", "went through"], "a": 0, "x": "<b>Go up<\/b> means increase. <i>Go off<\/i> means explode, stop working or spoil, and <i>go through<\/i> means experience. Unemployment increased sharply."}, {"h": "The company <span class=\"blank\" data-blank><\/span> a training centre in 2015.", "ans": "set up <i>(set up = establish)<\/i>", "type": "mcq", "opts": ["set off", "set up", "set out"], "a": 1, "x": "<b>Set up<\/b> means establish. <i>Set off<\/i> means start a journey, and <i>set out<\/i> means begin a journey or present. A company establishes a centre."}, {"h": "Several factors <span class=\"blank\" data-blank><\/span> the decline in sales.", "ans": "led to <i>(lead to = cause)<\/i>", "type": "mcq", "opts": ["led on", "led off", "led to"], "a": 2, "x": "<b>Lead to<\/b> means cause or result in. <i>Lead on<\/i> and <i>lead off<\/i> do not fit this meaning. <i>Several factors led to the decline<\/i>."}, {"h": "People should <span class=\"blank\" data-blank><\/span> sugar to stay healthy.", "ans": "cut down on <i>(cut down on = reduce)<\/i>", "type": "mcq", "opts": ["cut down on", "cut up", "cut across"], "a": 0, "x": "<b>Cut down on<\/b> means reduce. <i>Cut up<\/i> means slice, and <i>cut across<\/i> means cross. Remember the three-word form: cut down <i>on<\/i> sugar."}, {"h": "Many young people <span class=\"blank\" data-blank><\/span> in cities nowadays.", "ans": "grow up <i>(grow up = become an adult)<\/i>", "type": "mcq", "opts": ["grow out", "grow up", "grow off"], "a": 1, "x": "<b>Grow up<\/b> means become an adult. <i>Grow out<\/i> and <i>grow off<\/i> are not used in this meaning. <i>Grow up in cities<\/i> is natural."}, {"h": "Children often <span class=\"blank\" data-blank><\/span> their parents.", "ans": "take after <i>(take after = resemble)<\/i>", "type": "mcq", "opts": ["take over", "take in", "take after"], "a": 2, "x": "<b>Take after<\/b> means resemble a family member. <i>Take over<\/i> means take control, and <i>take in<\/i> means absorb or deceive."}, {"h": "We <span class=\"blank\" data-blank><\/span> time and could not finish the test.", "ans": "ran out of <i>(run out of = have none left)<\/i>", "type": "mcq", "opts": ["ran out of", "ran off", "ran over"], "a": 0, "x": "<b>Run out of<\/b> means have none left: <i>ran out of time<\/i>. <i>Ran off<\/i> and <i>ran over<\/i> do not fit, and the preposition <i>of<\/i> is required."}, {"h": "The two countries <span class=\"blank\" data-blank><\/span> well.", "ans": "get along <i>(get along = have good relations)<\/i>", "type": "mcq", "opts": ["get over", "get along", "get through"], "a": 1, "x": "<b>Get along<\/b> means have a good relationship. <i>Get over<\/i> means recover, and <i>get through<\/i> means finish or survive. You can also say <i>get on<\/i>."}, {"h": "Cities will have to <span class=\"blank\" data-blank><\/span> rising populations.", "ans": "deal with <i>(deal with = handle)<\/i>", "type": "mcq", "opts": ["deal on", "deal for", "deal with"], "a": 2, "x": "<b>Deal with<\/b> means handle or address. <i>Deal on<\/i> and <i>deal for<\/i> are errors. Formal writing may prefer <i>address<\/i> or <i>tackle<\/i>."}, {"h": "He <span class=\"blank\" data-blank><\/span> smoking last year.", "ans": "gave up <i>(give up = stop)<\/i>", "type": "mcq", "opts": ["gave up", "gave off", "gave out"], "a": 0, "x": "<b>Give up<\/b> means stop a habit. <i>Give off<\/i> means produce (heat, smell), and <i>give out<\/i> means distribute or fail. <i>Give up smoking<\/i> uses -ing."}]}, {"l": "J", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "Governments should <span class=\"blank\" data-blank><\/span> steps to protect the environment.", "ans": "take <i>(take steps)<\/i>", "type": "mcq", "opts": ["take", "make", "do"], "a": 0, "x": "Governments <b>take<\/b> steps: <i>take steps to protect<\/i>. <i>Make steps<\/i> and <i>do steps<\/i> are errors. The same verb appears in <i>take action<\/i> and <i>take measures<\/i>."}, {"h": "The new law has <span class=\"blank\" data-blank><\/span> a positive effect on road safety.", "ans": "had <i>(have an effect)<\/i>", "type": "mcq", "opts": ["done", "had", "made"], "a": 1, "x": "A law <b>has an effect<\/b> on safety. <i>Done an effect<\/i> and <i>made an effect<\/i> are errors. <i>Have an effect<\/i> and <i>make an impact<\/i> are both standard."}, {"h": "Rising prices are <span class=\"blank\" data-blank><\/span> to higher fuel costs.", "ans": "due <i>(due to)<\/i>", "type": "mcq", "opts": ["owed", "because", "due"], "a": 2, "x": "<b>Due to<\/b> means because of. <i>Owed to<\/i> and <i>because to<\/i> are errors. <i>Because of<\/i> is followed by a noun, and <i>because<\/i> by a clause."}, {"h": "Many students find it hard to <span class=\"blank\" data-blank><\/span> academic pressure.", "ans": "cope with <i>(cope with, not cope up with)<\/i>", "type": "mcq", "opts": ["cope with", "cope up with", "cope to"], "a": 0, "x": "We say <b>cope with<\/b>. <i>Cope up with<\/i> is a common error, especially in South Asian English. <i>Cope to<\/i> is also wrong."}, {"h": "This essay will <span class=\"blank\" data-blank><\/span> the causes of crime.", "ans": "discuss <i>(discuss takes no preposition)<\/i>", "type": "mcq", "opts": ["discuss about", "discuss", "discuss on"], "a": 1, "x": "<b>Discuss<\/b> takes its object directly: <i>discuss the causes<\/i>. <i>Discuss about<\/i> is among the most common errors at band 6. <i>Discuss on<\/i> is also wrong."}, {"h": "Students should <span class=\"blank\" data-blank><\/span> class discussions.", "ans": "take part in <i>(take part in = participate)<\/i>", "type": "mcq", "opts": ["take part at", "take place in", "take part in"], "a": 2, "x": "<b>Take part in<\/b> means participate. <i>Take place in<\/i> means happen in, and does not fit with students. <i>Take part at<\/i> is wrong."}, {"h": "The study <span class=\"blank\" data-blank><\/span> the need for change.", "ans": "highlights <i>(highlight takes a direct object)<\/i>", "type": "mcq", "opts": ["highlights", "highlights about", "highlights on"], "a": 0, "x": "<b>Highlight<\/b> takes a direct object: <i>highlight the need<\/i>. <i>Highlight about<\/i> and <i>highlight on<\/i> are errors. The same applies to <i>emphasise<\/i> and <i>mention<\/i>."}, {"h": "Water shortages <span class=\"blank\" data-blank><\/span> a serious threat to farming.", "ans": "pose <i>(pose a threat)<\/i>", "type": "mcq", "opts": ["make", "pose", "do"], "a": 1, "x": "Shortages <b>pose<\/b> a threat or a problem. <i>Make a threat<\/i> means threaten someone, and <i>do a threat<\/i> is not used. <i>Pose<\/i> is a formal collocation."}, {"h": "The company is <span class=\"blank\" data-blank><\/span> pressure to cut costs.", "ans": "under <i>(under pressure)<\/i>", "type": "mcq", "opts": ["in", "at", "under"], "a": 2, "x": "We say <b>under pressure<\/b>. <i>In pressure<\/i> and <i>at pressure<\/i> are errors. Compare <i>under threat, under control, under stress<\/i>."}, {"h": "Many families live <span class=\"blank\" data-blank><\/span> poverty.", "ans": "in <i>(live in poverty)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 0, "x": "We say <b>live in poverty<\/b>. <i>At poverty<\/i> and <i>on poverty<\/i> are errors. Compare <i>live in fear, live in hope<\/i>."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) Governments must take urgent action to reduce emissions.<br>B) Governments must make urgent action to reduce emissions.<br>C) Governments must do urgent action to reduce emissions.<br>D) Governments must give urgent action to reduce emissions.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <i>take action<\/i>. B uses <i>make action<\/i>, C uses <i>do action<\/i>, and D uses <i>give action<\/i>. None of these three exists as a collocation."}, {"h": "A) The new policy had a significant impact to small businesses.<br>B) The new policy had a significant impact on small businesses.<br>C) The new policy had significant impact of small businesses.<br>D) The new policy had a significant impact at small businesses.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <i>an impact on<\/i>. A uses <i>to<\/i>, C uses <i>of<\/i> and omits <i>a<\/i>, and D uses <i>at<\/i>. <i>Impact<\/i> needs <i>on<\/i>."}, {"h": "A) Many people suffer of depression.<br>B) Many people suffer by depression.<br>C) Many people suffer from depression.<br>D) Many people suffer in depression.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: <i>suffer from<\/i>. A uses <i>of<\/i>, B uses <i>by<\/i>, and D uses <i>in<\/i>. Only <i>from<\/i> follows <i>suffer<\/i>."}, {"h": "A) There is a growing demand of renewable energy.<br>B) There is a growing demand to renewable energy.<br>C) There is a growing demand about renewable energy.<br>D) There is a growing demand for renewable energy.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: <i>demand for<\/i>. A uses <i>of<\/i>, B uses <i>to<\/i>, and C uses <i>about<\/i>. <i>Demand for<\/i> is the standard noun + preposition."}, {"h": "A) She looked it up in a dictionary.<br>B) She looked up it in a dictionary.<br>C) She looked it in up a dictionary.<br>D) She looked at it up in a dictionary.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <i>looked it up<\/i>. B puts the pronoun after the particle (<i>looked up it<\/i>), and C and D move or add words (<i>in up<\/i>, <i>at it up<\/i>). A pronoun goes between the verb and the particle."}, {"h": "A) Big rain caused hard flooding in the region.<br>B) Heavy rain caused severe flooding in the region.<br>C) Strong rain caused severe flooding in the region.<br>D) Heavy rain caused strong flooding in the region.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <i>heavy rain<\/i> and <i>severe flooding<\/i>. A uses <i>big<\/i> and <i>hard<\/i>, C uses <i>strong rain<\/i>, and D uses <i>strong flooding<\/i>. Learn each adjective with its noun."}, {"h": "A) I am looking forward to hear from you.<br>B) I am looking forward for hear from you.<br>C) I am looking forward to hearing from you.<br>D) I am looking forward to be heard from you.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: <i>look forward to hearing<\/i>. A uses the base verb, B uses <i>for hear<\/i>, and D uses a wrong passive. After <i>look forward to<\/i>, use -ing."}, {"h": "A) Students are required to give attention in class.<br>B) Students are required to make attention in class.<br>C) Students are required to take attention in class.<br>D) Students are required to pay attention in class.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: <i>pay attention<\/i>. A uses <i>give<\/i>, B uses <i>make<\/i>, and C uses <i>take<\/i>. Attention is paid."}, {"h": "A) The company set up a new branch in Dhaka.<br>B) The company set on a new branch in Dhaka.<br>C) The company set off a new branch in Dhaka.<br>D) The company set a new branch up in Dhaka on.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <i>set up<\/i> a branch. B uses <i>set on<\/i>, C uses <i>set off<\/i>, and D separates the verb and particle in an unnatural way. <i>Set up<\/i> means establish."}, {"h": "A) The government is responsible of providing healthcare.<br>B) The government is responsible for providing healthcare.<br>C) The government is responsible about providing healthcare.<br>D) The government is responsible on providing healthcare.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <i>responsible for<\/i>. A uses <i>of<\/i>, C uses <i>about<\/i>, and D uses <i>on<\/i>. <i>Responsible for<\/i> + -ing is the standard pattern."}]}]}, {"n": 10, "title": "Punctuation Basics", "level": "Level 1 · Foundation", "g": [{"l": "A", "t": "Choose the correct punctuation", "i": "Choose the correct option from the brackets.", "q": [{"h": "<span class=\"blank\" data-blank><\/span> is the capital of Bangladesh.", "ans": "Dhaka", "type": "mcq", "opts": ["Dhaka", "dhaka"], "a": 0}, {"h": "<span class=\"blank\" data-blank><\/span> prices rose sharply.", "ans": "However,", "type": "mcq", "opts": ["However", "However,"], "a": 1}, {"h": "The <span class=\"blank\" data-blank><\/span> books are on the table. (many students)", "ans": "students'", "type": "mcq", "opts": ["students", "students'"], "a": 1}, {"h": "The company lost <span class=\"blank\" data-blank><\/span> market share.", "ans": "its", "type": "mcq", "opts": ["its", "it's"], "a": 0}, {"h": "I wonder why prices rose<span class=\"blank\" data-blank><\/span>", "ans": ".", "type": "mcq", "opts": [".", "?"], "a": 0}, {"h": "Three factors matter<span class=\"blank\" data-blank><\/span> cost, time and quality.", "ans": ":", "type": "mcq", "opts": [":", ";"], "a": 0}, {"h": "She is a <span class=\"blank\" data-blank><\/span> author.", "ans": "well-known", "type": "mcq", "opts": ["well-known", "well known"], "a": 0}, {"h": "<span class=\"blank\" data-blank><\/span> we went out.", "ans": "Although it rained,", "type": "mcq", "opts": ["Although it rained,", "Although it rained"], "a": 0}, {"h": "<span class=\"blank\" data-blank><\/span> rights are important.", "ans": "Children's", "type": "mcq", "opts": ["Children's", "Childrens'"], "a": 0}, {"h": "Prices rose <span class=\"blank\" data-blank><\/span> demand fell.", "ans": ", and", "type" function render(){
  locked=false; revealed=false;
  const q=qs[idx], g=q.g, num=idx+1;
  let h=`<div class="bar"><div class="bar-row"><button class="back" id="back">All quizzes</button>
    <div class="bar-title"><small>${S.tag||"SHEET "+pad(S.n)}</small>${S.title}</div><div class="count">${idx+1} / ${qs.length}</div></div>
    <div class="segs">${segs()}</div></div>
  <div class="card"><div class="gh"><span>${g.l}</span>${g.t}</div><p class="gi">${g.i}</p>
  <div class="q"><span class="qn">${num}.</span>${q.h}</div>`;
  if(q.type==="mcq"){
    h+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join("")}</div>`;
  }
  h+=`<div id="fb"></div><div class="act" id="act"></div></div>`;
  app.innerHTML=h;
  document.getElementById("back").onclick=home;
  if(q.type==="mcq"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    document.getElementById("act").innerHTML=`<span class="hint">Press ${q.opts.length>1?"1 to "+q.opts.length:"1"} to choose</span>`;
  }else{
    document.getElementById("act").innerHTML=`<button class="btn primary" id="show">Show answer</button><span class="hint">Say your answer first, then reveal. Press Space.</span>`;
    document.getElementById("show").onclick=reveal;
  }
}

function note(a){ // split italic note from the main answer
  const m=a.match(/^(.*?)\s*(<i>.*<\/i>)\s*$/); return m?[m[1],m[2]]:[a,""];
}
function nextBtn(){
  const last=idx===qs.length-1;
  return `<button class="btn primary" id="next">${last?"See score":"Next question"}</button><span class="hint">Press Enter</span>`;
}
function pick(i){
  if(locked) return; locked=true;
  const q=qs[idx], ok=i===q.a; res[idx]=ok; record(q,ok);
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true; if(k===q.a)b.classList.add("right"); else if(k===i)b.classList.add("wrong"); else b.classList.add("dim");});
  const bl=app.querySelector("[data-blank]"); if(bl){bl.innerHTML=q.opts[q.a]; bl.classList.add("ok");}
  const [m,n]=note(q.ans);
  const why=q.x?`<span class="why"><b class="wl">Why</b>${q.x}</span>`:"";
  const mine=(!ok&&q.opts)?`<span class="pk">You chose: <b>${q.opts[i]}</b></span>`:"";
  document.getElementById("fb").innerHTML=ok
    ?`<div class="fb ok"><b class="lab">Correct</b>${q.x?"":m}${q.x?"<b>"+m+"</b>":""}${(!q.x&&n)?" "+n:""}${why}</div>`
    :`<div class="fb no"><b class="lab">Not quite</b>${mine}<span class="pk"><i>Saved to My mistakes.</i></span>Correct answer: <b>${m}</b>${q.x?"":(n?" "+n:"")}${why}</div>`;
  document.getElementById("act").innerHTML=nextBtn();
  document.getElementById("next").onclick=advance;
  document.getElementById("next").focus({preventScroll:true});
  updateSegs();
}
function reveal(){
  if(revealed) return; revealed=true;
  document.getElementById("fb").innerHTML=`<div class="fb ans"><b class="lab">Answer</b>${qs[idx].ans}</div>`;
  document.getElementById("act").innerHTML=`<button class="btn good" id="got">I got it</button><button class="btn bad" id="miss">Not yet</button><span class="hint">Press G or M</span>`;
  document.getElementById("got").onclick=()=>mark(true);
  document.getElementById("miss").onclick=()=>mark(false);
}
function mark(ok){
  if(res[idx]!==null&&locked) return; locked=true; res[idx]=ok; record(qs[idx],ok); updateSegs();
  document.getElementById("act").innerHTML=nextBtn();
  document.getElementById("next").onclick=advance;
  document.getElementById("next").focus({preventScroll:true});
}
function updateSegs(){const s=app.querySelector(".segs"); if(s) s.innerHTML=segs();}
function advance(){ if(idx<qs.length-1){idx++;render();window.scrollTo(0,0)} else finish(); }

function finish(){
  const score=res.filter(r=>r===true).length; if(!S.mode) saveBest(S.n,score);
  const pct=score/qs.length;
  const v=pct>=0.85?"Excellent. You are ready for the next sheet.":pct>=0.65?"Good. Revise the rules and retry the ones you missed.":"Re-watch the lecture, study the sheet again, then retry.";
  const missed=qs.map((q,i)=>[q,i]).filter(([q,i])=>res[i]!==true);
  let h=`<div class="bar"><div class="bar-row"><button class="back" id="back">All quizzes</button>
    <div class="bar-title"><small>${S.tag||"SHEET "+pad(S.n)}</small>${S.title}</div><div class="count">Done</div></div></div>
  <div class="res"><div class="big">${score}<small> / ${qs.length}</small></div><p class="verdict">${v}</p>
  ${S.mode?`<p class="saved">${liveKeys().length} still in My mistakes.</p>`:(missed.length?`<p class="saved">${missed.length} saved to My mistakes for later practice.</p>`:"")}
  <div class="act">${S.mode?(liveKeys().length?`<button class="btn primary" id="retry">Practise again</button>`:""):`<button class="btn primary" id="retry">Try again</button>`}${(!S.mode&&S.n<40)?`<button class="btn" id="nx">Next quiz</button>`:""}${(!S.mode&&missed.length)?`<button class="btn" id="pm2">Practise my mistakes</button>`:""}<button class="btn" id="all">All quizzes</button></div>`;
  if(missed.length){
    h+=`<div class="rev"><h3>Review: ${missed.length} to revisit</h3>`+missed.map(([q,i])=>{
      const [m]=note(q.ans);
      const stem=q.h.replace(/<span class="blank"[^>]*><\/span>/,`<b>${q.opts?q.opts[q.a]:""}</b>`);
      return `<div class="ri"><div><small>Q${i+1}</small>${stem}</div><div>${m}${q.x?`<div style="margin-top:8px;font-size:.88em;color:var(--muted);line-height:1.5">${q.x}</div>`:""}</div></div>`}).join("")+`</div>`;
  }
  h+=`</div>`; app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("back").onclick=home; document.getElementById("all").onclick=home;
  const rt=document.getElementById("retry"); if(rt) rt.onclick=()=>S.mode?startMistakes(false):start(S.n);
  const p2=document.getElementById("pm2"); if(p2) p2.onclick=()=>startMistakes(false);
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>start(S.n+1);
}

document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const q=qs[idx]; if(!q||document.querySelector(".res")) return;
  const k=e.key;
  if(q.type==="mcq"&&!locked&&/^[1-9]$/.test(k)&&+k<=q.opts.length){pick(+k-1);e.preventDefault();return}
  if(q.type==="reveal"&&!revealed&&(k===" "||k==="Enter")){reveal();e.preventDefault();return}
  if(q.type==="reveal"&&revealed&&!locked){ if(k==="g"||k==="G"){mark(true);return} if(k==="m"||k==="M"){mark(false);return} }
  if(locked&&(k==="Enter"||k==="ArrowRight")){advance();e.preventDefault()}
});
const h0=(location.hash||"").match(/^#s(\d+)$/);
if(h0&&DATA.find(x=>x.n===+h0[1])) start(+h0[1]); else if(location.hash==="#mistakes"&&liveKeys().length) startMistakes(false); else home();
</script>
