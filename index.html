lause (<i>the researchers<\/i>). The other options are not correct forms."}, {"h": "Walking along the street, <span class=\"blank\" data-blank><\/span>.", "ans": "I noticed a new cafe <i>(the subject must be the one walking)<\/i>", "type": "mcq", "opts": ["a new cafe caught my eye", "I noticed a new cafe", "the new cafe was noticed"], "a": 1, "x": "The subject of the main clause must be the person who is walking. <i>A new cafe caught my eye<\/i> suggests the cafe was walking: that is a dangling participle. <i>I noticed a new cafe<\/i> fixes it."}, {"h": "The survey <span class=\"blank\" data-blank><\/span> last year involved 500 people.", "ans": "conducted <i>(reduced relative: past participle)<\/i>", "type": "mcq", "opts": ["conducting", "was conducted", "conducted"], "a": 2, "x": "<i>Conducted last year<\/i> has a passive meaning (<i>which was conducted<\/i>), so use the past participle. <i>Conducting<\/i> means the survey conducted something, and <i>was conducted<\/i> adds a second finite verb."}, {"h": "The number of students <span class=\"blank\" data-blank><\/span> on online courses has doubled.", "ans": "enrolling <i>(reduced relative: -ing)<\/i>", "type": "mcq", "opts": ["enrolling", "enrolled to", "are enrolling"], "a": 0, "x": "A reduced relative clause with an active meaning uses -ing: <i>students enrolling<\/i> = <i>students who are enrolling<\/i>. <i>Enrolled to<\/i> is not correct, and <i>are enrolling<\/i> would add a second verb."}, {"h": "<span class=\"blank\" data-blank><\/span> the answer, she asked for help.", "ans": "Not knowing <i>(negative participle clause)<\/i>", "type": "mcq", "opts": ["Not known", "Not knowing", "No knowing"], "a": 1, "x": "To make a participle clause negative, put <i>not<\/i> before the participle: <i>Not knowing<\/i>. <i>Not known<\/i> has a passive meaning, and <i>no knowing<\/i> is not a correct form."}, {"h": "The man <span class=\"blank\" data-blank><\/span> next to me was a doctor.", "ans": "sitting <i>(reduced relative: -ing)<\/i>", "type": "mcq", "opts": ["sat", "is sitting", "sitting"], "a": 2, "x": "<i>Sitting next to me<\/i> = <i>who was sitting next to me<\/i>. <i>Sat<\/i> would be a second verb with no subject, and <i>is sitting<\/i> is the wrong tense for the past sentence."}, {"h": "The policy, <span class=\"blank\" data-blank><\/span> in 2010, reduced emissions.", "ans": "introduced <i>(non-defining reduced clause)<\/i>", "type": "mcq", "opts": ["introduced", "introducing", "was introduced"], "a": 0, "x": "<i>Introduced in 2010<\/i> is a past participle with a passive meaning: the policy was introduced. <i>Introducing<\/i> would mean the policy introduced something, and <i>was introduced<\/i> adds a finite verb inside the commas."}]}, {"l": "F", "t": "Combining sentences correctly", "i": "Choose the correct option.", "q": [{"h": "Car use rose between 2000 and 2020, <span class=\"blank\" data-blank><\/span>.", "ans": "while bus use fell <i>(while joins opposite trends)<\/i>", "type": "mcq", "opts": ["while bus use fell", "however bus use fell", "despite bus use fell"], "a": 0, "x": "<i>While<\/i> is a conjunction, so it can join the two trends in one sentence. <i>However<\/i> after a comma makes a comma splice, and <i>despite<\/i> needs a noun phrase."}, {"h": "The rent is high, <span class=\"blank\" data-blank><\/span>.", "ans": "so many students share flats <i>(so joins cause and result)<\/i>", "type": "mcq", "opts": ["therefore many students share flats", "so many students share flats", "but so many students share flats"], "a": 1, "x": "<i>So<\/i> joins a reason (<i>the rent is high<\/i>) and a result. <i>Therefore<\/i> is an adverb and cannot follow only a comma, and <i>but so<\/i> is not natural."}, {"h": "I admire my teacher<span class=\"blank\" data-blank><\/span>.", "ans": ", who inspired me to study English <i>(non-defining who)<\/i>", "type": "mcq", "opts": [", she inspired me to study English", ", that inspired me to study English", ", who inspired me to study English"], "a": 2, "x": "A non-defining clause with <i>who<\/i> adds extra information about the teacher. <i>She inspired me<\/i> after a comma is a comma splice, and <i>that<\/i> is not used after a comma."}, {"h": "Many people exercise regularly, <span class=\"blank\" data-blank><\/span>.", "ans": "which improves their health <i>(sentence relative)<\/i>", "type": "mcq", "opts": ["which improves their health", "that improves their health", "what improves their health"], "a": 0, "x": "<i>, which<\/i> refers to the whole idea of exercising regularly. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot refer back to an earlier clause."}, {"h": "She took the course <span class=\"blank\" data-blank><\/span>.", "ans": "so that she could improve her writing <i>(purpose clause)<\/i>", "type": "mcq", "opts": ["for that she could improve her writing", "so that she could improve her writing", "for improve her writing"], "a": 1, "x": "<i>So that<\/i> + a clause expresses purpose. <i>For that<\/i> and <i>for improve<\/i> are not correct, because <i>for<\/i> must be followed by a noun or -ing form."}, {"h": "It was <span class=\"blank\" data-blank><\/span> many students failed.", "ans": "such a difficult exam that <i>(such + a + adjective + noun)<\/i>", "type": "mcq", "opts": ["so a difficult exam that", "such difficult exam that", "such a difficult exam that"], "a": 2, "x": "With a singular countable noun, use <i>such + a + adjective + noun<\/i>: <i>such a difficult exam<\/i>. <i>So<\/i> is used with adjectives alone, and <i>such<\/i> without <i>a<\/i> is wrong for a singular noun."}, {"h": "The test was <span class=\"blank\" data-blank><\/span> many students failed.", "ans": "so difficult that <i>(so + adjective + that)<\/i>", "type": "mcq", "opts": ["so difficult that", "such difficult that", "so difficult than"], "a": 0, "x": "<i>So + adjective + that<\/i> shows a result. <i>Such<\/i> needs a noun after it, and <i>than<\/i> is for comparisons, not results."}, {"h": "He worked hard <span class=\"blank\" data-blank><\/span> the test.", "ans": "in order to pass <i>(in order to + base verb)<\/i>", "type": "mcq", "opts": ["in order that pass", "in order to pass", "for pass"], "a": 1, "x": "Purpose with the same subject uses <i>in order to<\/i> + base verb. <i>In order that<\/i> needs a full clause, and <i>for pass<\/i> is not correct."}, {"h": "I have a friend <span class=\"blank\" data-blank><\/span>.", "ans": "whose father is a pilot <i>(whose replaces his)<\/i>", "type": "mcq", "opts": ["who his father is a pilot", "which father is a pilot", "whose father is a pilot"], "a": 2, "x": "<i>Whose<\/i> replaces <i>his<\/i> and links the friend to the father. <i>Who his father<\/i> repeats the idea, and <i>which<\/i> is for things."}, {"h": "Young people spend hours online<span class=\"blank\" data-blank><\/span>.", "ans": ", so their sleep suffers <i>(comma before so)<\/i>", "type": "mcq", "opts": [", so their sleep suffers", ", as a result their sleep suffers", "; so their sleep suffers"], "a": 0, "x": "<i>So<\/i> joins two clauses and shows a result, with a comma before it. <i>As a result<\/i> after only a comma makes a comma splice, and a semicolon before <i>so<\/i> is not standard."}]}, {"l": "G", "t": "Noun clauses and appositives", "i": "Choose the correct option.", "q": [{"h": "It is not clear <span class=\"blank\" data-blank><\/span> the policy will work.", "ans": "whether <i>(whether = if or not)<\/i>", "type": "mcq", "opts": ["whether", "that", "what"], "a": 0, "x": "<i>Whether<\/i> introduces a noun clause that expresses a yes or no question: will the policy work or not? <i>That<\/i> would state a fact, and <i>what<\/i> needs a missing noun."}, {"h": "I do not know <span class=\"blank\" data-blank><\/span>.", "ans": "where he lives <i>(no inversion in noun clauses)<\/i>", "type": "mcq", "opts": ["where does he live", "where he lives", "where he does live"], "a": 1, "x": "In a noun clause, the word order is that of a statement: subject then verb. Do not invert (<i>where does he live<\/i>) and do not add <i>does<\/i>: <i>where he lives<\/i>."}, {"h": "The fact <span class=\"blank\" data-blank><\/span> prices are rising worries many families.", "ans": "that <i>(fact + that)<\/i>", "type": "mcq", "opts": ["what", "which", "that"], "a": 2, "x": "After the noun <i>fact<\/i>, use <i>that<\/i> to introduce the noun clause that explains the fact. <i>What<\/i> and <i>which<\/i> do not fit after <i>fact<\/i>."}, {"h": "Nobody knows <span class=\"blank\" data-blank><\/span> will happen next.", "ans": "what <i>(what = the thing that)<\/i>", "type": "mcq", "opts": ["what", "that", "which"], "a": 0, "x": "<i>What<\/i> = <i>the thing that<\/i>, and it is the subject of <i>will happen<\/i>. <i>That<\/i> and <i>which<\/i> need a noun before them."}, {"h": "The question is <span class=\"blank\" data-blank><\/span>.", "ans": "how this can be solved <i>(statement word order)<\/i>", "type": "mcq", "opts": ["how can this be solved", "how this can be solved", "how this can solved"], "a": 1, "x": "The noun clause <i>how this can be solved<\/i> uses statement order: subject (<i>this<\/i>) before verb (<i>can be solved<\/i>). Question order (<i>how can this<\/i>) belongs only in direct questions."}, {"h": "Bangladesh, <span class=\"blank\" data-blank><\/span> has a large population.", "ans": "a country in South Asia, <i>(appositive: commas on both sides)<\/i>", "type": "mcq", "opts": ["a country in South Asia", "which a country in South Asia,", "a country in South Asia,"], "a": 2, "x": "An appositive renames Bangladesh and needs a comma before and after. <i>Which<\/i> would need a verb in its clause: <i>which is a country<\/i>."}, {"h": "She asked me <span class=\"blank\" data-blank><\/span> the report.", "ans": "if I had finished <i>(if for yes/no questions)<\/i>", "type": "mcq", "opts": ["if I had finished", "did I finish", "that I had finished"], "a": 0, "x": "In reported yes or no questions, use <i>if<\/i> or <i>whether<\/i> with statement order. <i>Did I finish<\/i> keeps question order, and <i>that<\/i> is used for statements, not questions."}, {"h": "<span class=\"blank\" data-blank><\/span> she said surprised everyone.", "ans": "What <i>(what as the subject)<\/i>", "type": "mcq", "opts": ["That", "What", "Which"], "a": 1, "x": "A noun clause beginning with <i>what<\/i> can be the subject of the sentence: <i>what she said<\/i> = the thing she said. <i>That she said<\/i> and <i>which she said<\/i> do not work as a subject here."}, {"h": "The idea <span class=\"blank\" data-blank><\/span> children should wear uniforms is popular in many countries.", "ans": "that <i>(idea + that)<\/i>", "type": "mcq", "opts": ["which", "what", "that"], "a": 2, "x": "After <i>idea<\/i>, <i>belief<\/i>, <i>fact<\/i> and <i>claim<\/i>, use <i>that<\/i> to introduce the noun clause. <i>Which<\/i> and <i>what<\/i> are not used in this pattern."}, {"h": "I am sure <span class=\"blank\" data-blank><\/span> he will pass.", "ans": "that <i>(sure + that clause)<\/i>", "type": "mcq", "opts": ["that", "what", "of that"], "a": 0, "x": "After adjectives like <i>sure<\/i> and <i>certain<\/i>, use a <i>that<\/i> clause: <i>I am sure that he will pass<\/i>. <i>What<\/i> does not fit, and <i>of that<\/i> adds an extra preposition."}]}, {"l": "H", "t": "Purpose, result and contrast", "i": "Choose the correct option.", "q": [{"h": "She revised every day <span class=\"blank\" data-blank><\/span> pass the test.", "ans": "so that she could <i>(so that + clause)<\/i>", "type": "mcq", "opts": ["so that she could", "so as she could", "for she could"], "a": 0, "x": "<i>So that<\/i> introduces a purpose clause, with a subject and verb after it (<i>she could pass<\/i>). <i>So as<\/i> must be followed by <i>to<\/i> + verb, and <i>for<\/i> cannot introduce a clause."}, {"h": "The weather was <span class=\"blank\" data-blank><\/span> bad that the flight was cancelled.", "ans": "so <i>(so + adjective + that)<\/i>", "type": "mcq", "opts": ["such", "so", "too"], "a": 1, "x": "<i>So + adjective + that<\/i> expresses a result: the weather was bad, therefore the flight was cancelled. <i>Such<\/i> needs a noun, and <i>too<\/i> does not take <i>that<\/i>."}, {"h": "It was <span class=\"blank\" data-blank><\/span> that we were exhausted.", "ans": "such a long journey <i>(such + a + adjective + noun)<\/i>", "type": "mcq", "opts": ["so long journey", "such long journey", "such a long journey"], "a": 2, "x": "With <i>a long journey<\/i>, a singular countable noun, use <i>such a long journey<\/i>. <i>So<\/i> cannot be followed by a noun phrase, and <i>such long journey<\/i> is missing <i>a<\/i>."}, {"h": "The exam was <span class=\"blank\" data-blank><\/span> difficult for me to finish in time.", "ans": "too <i>(too = more than needed)<\/i>", "type": "mcq", "opts": ["too", "enough", "such"], "a": 0, "x": "<i>Too<\/i> means more than needed or possible: too difficult to finish. <i>Enough<\/i> comes after the adjective, and <i>such<\/i> needs a noun."}, {"h": "She is <span class=\"blank\" data-blank><\/span> to vote.", "ans": "old enough <i>(adjective + enough)<\/i>", "type": "mcq", "opts": ["enough old", "old enough", "too old"], "a": 1, "x": "<i>Enough<\/i> comes after the adjective: <i>old enough<\/i>. <i>Enough old<\/i> is a common mistake. <i>Too old<\/i> would mean the opposite."}, {"h": "He saved money <span class=\"blank\" data-blank><\/span> a car.", "ans": "in order to buy <i>(in order to + base verb)<\/i>", "type": "mcq", "opts": ["for to buy", "in order buy", "in order to buy"], "a": 2, "x": "<i>In order to<\/i> is followed by a base verb to show purpose. <i>In order buy<\/i> is missing <i>to<\/i>, and <i>for to buy<\/i> is not correct."}, {"h": "Students are given extra time <span class=\"blank\" data-blank><\/span>.", "ans": "so that they do not feel pressured <i>(so that + clause)<\/i>", "type": "mcq", "opts": ["so that they do not feel pressured", "so that they not feel pressured", "for they do not feel pressured"], "a": 0, "x": "<i>So that<\/i> introduces a purpose clause, and the verb needs its auxiliary: <i>they do not feel<\/i>. <i>They not feel<\/i> is wrong, and <i>for they do not feel<\/i> is not a correct structure."}, {"h": "The more you practise, <span class=\"blank\" data-blank><\/span> you become.", "ans": "the better <i>(the more... the better)<\/i>", "type": "mcq", "opts": ["the best", "the better", "more better"], "a": 1, "x": "The pattern is <i>the + comparative, the + comparative<\/i>. <i>Better<\/i> is the comparative of <i>good<\/i>; <i>the best<\/i> is the superlative and <i>more better<\/i> is a double comparative."}, {"h": "It was raining heavily; <span class=\"blank\" data-blank><\/span>.", "ans": "nevertheless, we went out <i>(nevertheless is an adverb)<\/i>", "type": "mcq", "opts": ["despite we went out", "although we went out", "nevertheless, we went out"], "a": 2, "x": "<i>Nevertheless<\/i> is an adverb, so it is used after a semicolon or full stop with a comma after it. <i>Despite<\/i> and <i>although<\/i> would need different punctuation and grammar."}, {"h": "Unless you <span class=\"blank\" data-blank><\/span>, your speaking will not improve.", "ans": "practise <i>(unless already means if not)<\/i>", "type": "mcq", "opts": ["practise", "do not practise", "will not practise"], "a": 0, "x": "<i>Unless<\/i> already means <i>if not<\/i>, so the verb should be positive. A negative verb creates a double negative, and the future is not used after <i>unless<\/i>: use the present simple."}]}, {"l": "I", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "Housing takes 35% of income, <span class=\"blank\" data-blank><\/span>.", "ans": "followed by food at 25% <i>(passive participle)<\/i>", "type": "mcq", "opts": ["followed by food at 25%", "following by food at 25%", "and followed food at 25%"], "a": 0, "x": "<i>Followed by food at 25%<\/i> is a passive participle phrase and joins the next item without a new sentence. <i>Following by<\/i> and <i>and followed food<\/i> are not correct forms."}, {"h": "Mobile use rose from 10% to 90%, <span class=\"blank\" data-blank><\/span> from 80% to 10%.", "ans": "whereas landline use fell <i>(whereas joins opposite trends)<\/i>", "type": "mcq", "opts": ["despite landline use fell", "whereas landline use fell", "however landline use fell"], "a": 1, "x": "<i>Whereas<\/i> is a conjunction that contrasts two opposite trends. <i>Despite<\/i> needs a noun phrase, and <i>however<\/i> after a comma makes a comma splice."}, {"h": "Governments should invest in public transport, <span class=\"blank\" data-blank><\/span>.", "ans": "which reduces both traffic and pollution <i>(sentence relative)<\/i>", "type": "mcq", "opts": ["that reduces both traffic and pollution", "what reduces both traffic and pollution", "which reduces both traffic and pollution"], "a": 2, "x": "<i>, which<\/i> refers to the whole idea of investing in public transport and states the result. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot refer back to a clause."}, {"h": "Although technology has many benefits, <span class=\"blank\" data-blank><\/span>.", "ans": "it also creates problems <i>(although without but)<\/i>", "type": "mcq", "opts": ["it also creates problems", "but it also creates problems", "however it also creates problems"], "a": 0, "x": "<i>Although<\/i> sets up the contrast, so the main clause must not begin with <i>but<\/i> or <i>however<\/i>. Use only one: either <i>although... ,<\/i> or <i>but<\/i>."}, {"h": "I really like my hometown, <span class=\"blank\" data-blank><\/span>.", "ans": "which is famous for its tea <i>(non-defining which)<\/i>", "type": "mcq", "opts": ["that is famous for its tea", "which is famous for its tea", "what is famous for its tea"], "a": 1, "x": "The non-defining clause adds extra information about the hometown, so it takes a comma and <i>which<\/i>. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot follow a noun."}, {"h": "I chose this course <span class=\"blank\" data-blank><\/span>.", "ans": "because I want to become an engineer <i>(because + clause)<\/i>", "type": "mcq", "opts": ["because of I want to become an engineer", "for because I want to become an engineer", "because I want to become an engineer"], "a": 2, "x": "<i>Because<\/i> is a conjunction and is followed by a clause. <i>Because of<\/i> needs a noun phrase, and <i>for because<\/i> is not correct."}, {"h": "People <span class=\"blank\" data-blank><\/span> often suffer from stress.", "ans": "who work long hours <i>(who as the subject)<\/i>", "type": "mcq", "opts": ["who work long hours", "whom work long hours", "which work long hours"], "a": 0, "x": "<i>Who<\/i> is the subject of <i>work<\/i> and refers to people. <i>Whom<\/i> is used for objects, and <i>which<\/i> is for things."}, {"h": "<span class=\"blank\" data-blank><\/span>, I believe the benefits outweigh the drawbacks.", "ans": "Having considered both views <i>(perfect participle)<\/i>", "type": "mcq", "opts": ["Considered both views", "Having considered both views", "To have consider both views"], "a": 1, "x": "<i>Having considered<\/i> shows that the thinking happened before the conclusion, and the subject (<i>I<\/i>) is the same in the main clause. The other forms are not correct."}, {"h": "The main reason <span class=\"blank\" data-blank><\/span> people move to cities is employment.", "ans": "why <i>(reason + why)<\/i>", "type": "mcq", "opts": ["because", "that is why", "why"], "a": 2, "x": "After <i>reason<\/i>, use <i>why<\/i>. <i>Because<\/i> repeats the idea of reason, and <i>that is why<\/i> would need a different sentence structure."}, {"h": "I have a friend <span class=\"blank\" data-blank><\/span>.", "ans": "whose brother is a footballer <i>(whose replaces his)<\/i>", "type": "mcq", "opts": ["whose brother is a footballer", "who his brother is a footballer", "which brother is a footballer"], "a": 0, "x": "<i>Whose<\/i> replaces <i>his<\/i> and links the friend to the brother. <i>Who his brother<\/i> repeats the possessive, and <i>which<\/i> is for things."}]}, {"l": "J", "t": "Mixed review: relative clauses in Task 2", "i": "Choose the correct option.", "q": [{"h": "The number of people <span class=\"blank\" data-blank><\/span> has risen sharply.", "ans": "who own cars <i>(no repeated subject)<\/i>", "type": "mcq", "opts": ["who own cars", "who they own cars", "which own cars"], "a": 0, "x": "The relative pronoun <i>who<\/i> is the subject of <i>own<\/i>, so it cannot be followed by another subject (<i>who they own<\/i>). <i>Which<\/i> is for things, not people."}, {"h": "Children <span class=\"blank\" data-blank><\/span> tend to do better at school.", "ans": "whose parents read to them <i>(whose shows possession)<\/i>", "type": "mcq", "opts": ["which parents read to them", "whose parents read to them", "who their parents read to them"], "a": 1, "x": "<i>Whose parents<\/i> shows that the parents belong to the children. <i>Which<\/i> is for things, and <i>who their parents<\/i> repeats the possessive."}, {"h": "The country <span class=\"blank\" data-blank><\/span> the study took place has a warm climate.", "ans": "where <i>(where for places)<\/i>", "type": "mcq", "opts": ["which", "in where", "where"], "a": 2, "x": "<i>Where<\/i> introduces a clause about a place. <i>Which took place<\/i> would need a preposition, and <i>in where<\/i> is not used."}, {"h": "Online courses, <span class=\"blank\" data-blank><\/span> attract many adults.", "ans": "which are cheaper than classroom courses, <i>(non-defining: commas, which)<\/i>", "type": "mcq", "opts": ["which are cheaper than classroom courses,", "that are cheaper than classroom courses,", "which are cheaper than classroom courses"], "a": 0, "x": "A non-defining clause takes <i>which<\/i> and a comma before and after. <i>That<\/i> is not used after a comma, and a missing second comma leaves the clause without an end."}, {"h": "It is widely believed <span class=\"blank\" data-blank><\/span> exercise improves concentration.", "ans": "that <i>(noun clause with that)<\/i>", "type": "mcq", "opts": ["what", "that", "which"], "a": 1, "x": "After <i>it is widely believed<\/i>, use <i>that<\/i> to introduce the noun clause. <i>What<\/i> and <i>which<\/i> do not fit in this structure."}, {"h": "Students <span class=\"blank\" data-blank><\/span> the exam may retake it after one month.", "ans": "who fail <i>(verb agrees with students)<\/i>", "type": "mcq", "opts": ["who fails", "whom fail", "who fail"], "a": 2, "x": "The verb in a relative clause agrees with its antecedent: <i>students<\/i> is plural, so use <i>fail<\/i>. <i>Fails<\/i> is singular, and <i>whom<\/i> cannot be the subject."}, {"h": "He is one of the people <span class=\"blank\" data-blank><\/span> influenced my life.", "ans": "who have <i>(relative verb agrees with people)<\/i>", "type": "mcq", "opts": ["who have", "who has", "which have"], "a": 0, "x": "In <i>one of the people who<\/i>, the relative pronoun refers to <i>people<\/i>, which is plural. So the verb is <i>have<\/i>, not <i>has<\/i>. <i>Which<\/i> is not used for people."}, {"h": "The graph, <span class=\"blank\" data-blank><\/span> shows a clear trend.", "ans": "which I studied carefully, <i>(no repeated object)<\/i>", "type": "mcq", "opts": ["that I studied carefully,", "which I studied carefully,", "which I studied it carefully,"], "a": 1, "x": "The relative pronoun already stands for the object of <i>studied<\/i>. Do not repeat it with <i>it<\/i>. <i>That<\/i> is not used after a comma."}, {"h": "The woman <span class=\"blank\" data-blank><\/span> I spoke was very helpful.", "ans": "to whom <i>(preposition + whom)<\/i>", "type": "mcq", "opts": ["to who", "whom to", "to whom"], "a": 2, "x": "When a preposition comes before the relative pronoun for a person, use <i>whom<\/i>: <i>to whom I spoke<\/i>. <i>To who<\/i> is informal and incorrect in formal writing, and <i>whom to<\/i> is the wrong order."}, {"h": "I read an article <span class=\"blank\" data-blank><\/span>.", "ans": "about how technology affects sleep <i>(statement word order)<\/i>", "type": "mcq", "opts": ["about how technology affects sleep", "about how does technology affect sleep", "about how technology affect sleep"], "a": 0, "x": "A noun clause after <i>about how<\/i> uses statement order: <i>technology affects sleep<\/i>. Question order (<i>how does technology affect<\/i>) is only for direct questions, and the verb must agree (<i>affects<\/i>)."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) Although the course was difficult, but she passed it.<br>B) Although the course was difficult, she passed it.<br>C) Despite the course was difficult, she passed it.<br>D) Despite of the course being difficult, she passed it.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct. <i>Although<\/i> already shows the contrast, so <i>but<\/i> is not added (A). <i>Despite<\/i> must be followed by a noun phrase or -ing form, not a clause (C). <i>Despite of<\/i> is not a correct phrase (D)."}, {"h": "A) My brother, that lives in Canada, is a dentist.<br>B) My brother who lives in Canada, is a dentist.<br>C) My brother, who he lives in Canada, is a dentist.<br>D) My brother, who lives in Canada, is a dentist.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. A non-defining clause for a person uses <i>who<\/i> and commas on both sides. A uses <i>that<\/i> after a comma. B misses the first comma. C repeats the subject with <i>he<\/i>."}, {"h": "A) Sales peaked in 2015, falling steadily afterwards.<br>B) Sales peaked in 2015, they fell steadily afterwards.<br>C) Sales peaked in 2015, and falling steadily afterwards.<br>D) Sales peaked in 2015, fell steadily afterwards.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. <i>Falling steadily afterwards<\/i> is a participle clause with the same subject as the main clause. B is a comma splice, C mixes <i>and<\/i> with an -ing form, and D has two verbs with only a comma."}, {"h": "A) The city which I grew up has changed a lot.<br>B) The city where I grew up in it has changed a lot.<br>C) The city where I grew up has changed a lot.<br>D) The city who I grew up has changed a lot.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct. <i>Where<\/i> replaces <i>in which<\/i>. A leaves out the preposition, B repeats the place with <i>in it<\/i>, and D uses <i>who<\/i>, which is only for people."}, {"h": "A) She revised every day for that she could pass the test.<br>B) She revised every day so as she could pass the test.<br>C) She revised every day so that she could pass the test.<br>D) She revised every day in order she could pass the test.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct. <i>So that<\/i> introduces a clause that expresses purpose. A (<i>for that<\/i>), B (<i>so as she could<\/i>) and D (<i>in order she could<\/i>) are not correct structures."}, {"h": "A) It was such a difficult exam that many students failed.<br>B) It was so a difficult exam that many students failed.<br>C) It was such difficult exam that many students failed.<br>D) It was so difficult exam that many students failed.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. A singular countable noun takes <i>such a + adjective + noun<\/i>. B uses <i>so a<\/i>, C leaves out <i>a<\/i>, and D uses <i>so<\/i> before a noun phrase."}, {"h": "A) Dhaka the capital of Bangladesh, is crowded.<br>B) Dhaka, the capital of Bangladesh is crowded.<br>C) Dhaka, which the capital of Bangladesh, is crowded.<br>D) Dhaka, the capital of Bangladesh, is crowded.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. An appositive needs a comma before and after it. A misses the first comma, B misses the last comma, and C adds <i>which<\/i> without a verb."}, {"h": "A) Walking to work, a new shop caught my attention.<br>B) Walking to work, I noticed a new shop.<br>C) Walking to work, the shop was new.<br>D) While walk to work, I noticed a new shop.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct. The subject of the main clause (<i>I<\/i>) is the person who is walking. A and C make the shop or the attention do the walking (dangling participle). D uses <i>walk<\/i> instead of <i>walking<\/i>."}, {"h": "A) I do not know where he lives.<br>B) I do not know where does he live.<br>C) I do not know where he live.<br>D) I do not know that where he lives.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. A noun clause uses statement word order: <i>where he lives<\/i>. B uses question order, C drops the <i>-s<\/i>, and D adds an unnecessary <i>that<\/i>."}, {"h": "A) Unless you do not practise, you will not improve.<br>B) Unless you will practise, you will not improve.<br>C) Unless you practising, you will not improve.<br>D) Unless you practise, you will not improve.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. <i>Unless<\/i> already means <i>if not<\/i>, so the verb is positive, and the future is not used after it. A uses a double negative, B uses <i>will<\/i>, and C has no finite verb."}]}]}, {"n": 7, "title": "Question Forms and Negatives", "level": "Level 1 · Foundation", "g": [{"l": "A", "t": "Choose the correct question", "i": "Choose the correct option from the brackets.", "q": [{"h": "<span class=\"blank\" data-blank><\/span> enjoy reading?", "ans": "Do you", "type": "mcq", "opts": ["Do you", "You do"], "a": 0}, {"h": "Where <span class=\"blank\" data-blank><\/span>?", "ans": "does he live", "type": "mcq", "opts": ["does he live", "he lives"], "a": 0}, {"h": "<   const score=res.filter(r=>r===true).length; saveBest(S.n,score);
  const pct=score/qs.length;
  const v=pct>=0.85?"Excellent. You are ready for the next sheet.":pct>=0.65?"Good. Revise the rules and retry the ones you missed.":"Re-watch the lecture, study the sheet again, then retry.";
  const missed=qs.map((q,i)=>[q,i]).filter(([q,i])=>res[i]!==true);
  let h=`<div class="bar"><div class="bar-row"><button class="back" id="back">All quizzes</button>
    <div class="bar-title"><small>${S.tag||"SHEET "+pad(S.n)}</small>${S.title}</div><div class="count">Done</div></div></div>
  <div class="res"><div class="big">${score}<small> / ${qs.length}</small></div><p class="verdict">${v}</p>
  <div class="act"><button class="btn primary" id="retry">Try again</button>${S.n<40?`<button class="btn" id="nx">Next quiz</button>`:""}<button class="btn" id="all">All quizzes</button></div>`;
  if(missed.length){
    h+=`<div class="rev"><h3>Review: ${missed.length} to revisit</h3>`+missed.map(([q,i])=>{
      const [m]=note(q.ans);
      const stem=q.h.replace(/<span class="blank"[^>]*><\/span>/,`<b>${q.opts?q.opts[q.a]:""}</b>`);
      return `<div class="ri"><div><small>Q${i+1}</small>${stem}</div><div>${m}${q.x?`<div style="margin-top:8px;font-size:.88em;color:var(--muted);line-height:1.5">${q.x}</div>`:""}</div></div>`}).join("")+`</div>`;
  }
  h+=`</div>`; app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("back").onclick=home; document.getElementById("all").onclick=home;
  document.getElementById("retry").onclick=()=>start(S.n);
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>start(S.n+1);
}

document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const q=qs[idx]; if(!q||document.querySelector(".res")) return;
  const k=e.key;
  if(q.type==="mcq"&&!locked&&/^[1-9]$/.test(k)&&+k<=q.opts.length){pick(+k-1);e.preventDefault();return}
  if(q.type==="reveal"&&!revealed&&(k===" "||k==="Enter")){reveal();e.preventDefault();return}
  if(q.type==="reveal"&&revealed&&!locked){ if(k==="g"||k==="G"){mark(true);return} if(k==="m"||k==="M"){mark(false);return} }
  if(locked&&(k==="Enter"||k==="ArrowRight")){advance();e.preventDefault()}
});
const h0=(location.hash||"").match(/^#s(\d+)$/);
if(h0&&DATA.find(x=>x.n===+h0[1])) start(+h0[1]); else home();
</script>
