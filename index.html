statement: subject then verb. Do not invert (<i>where does he live<\/i>) and do not add <i>does<\/i>: <i>where he lives<\/i>."}, {"h": "The fact <span class=\"blank\" data-blank><\/span> prices are rising worries many families.", "ans": "that <i>(fact + that)<\/i>", "type": "mcq", "opts": ["what", "which", "that"], "a": 2, "x": "After the noun <i>fact<\/i>, use <i>that<\/i> to introduce the noun clause that explains the fact. <i>What<\/i> and <i>which<\/i> do not fit after <i>fact<\/i>."}, {"h": "Nobody knows <span class=\"blank\" data-blank><\/span> will happen next.", "ans": "what <i>(what = the thing that)<\/i>", "type": "mcq", "opts": ["what", "that", "which"], "a": 0, "x": "<i>What<\/i> = <i>the thing that<\/i>, and it is the subject of <i>will happen<\/i>. <i>That<\/i> and <i>which<\/i> need a noun before them."}, {"h": "The question is <span class=\"blank\" data-blank><\/span>.", "ans": "how this can be solved <i>(statement word order)<\/i>", "type": "mcq", "opts": ["how can this be solved", "how this can be solved", "how this can solved"], "a": 1, "x": "The noun clause <i>how this can be solved<\/i> uses statement order: subject (<i>this<\/i>) before verb (<i>can be solved<\/i>). Question order (<i>how can this<\/i>) belongs only in direct questions."}, {"h": "Bangladesh, <span class=\"blank\" data-blank><\/span> has a large population.", "ans": "a country in South Asia, <i>(appositive: commas on both sides)<\/i>", "type": "mcq", "opts": ["a country in South Asia", "which a country in South Asia,", "a country in South Asia,"], "a": 2, "x": "An appositive renames Bangladesh and needs a comma before and after. <i>Which<\/i> would need a verb in its clause: <i>which is a country<\/i>."}, {"h": "She asked me <span class=\"blank\" data-blank><\/span> the report.", "ans": "if I had finished <i>(if for yes/no questions)<\/i>", "type": "mcq", "opts": ["if I had finished", "did I finish", "that I had finished"], "a": 0, "x": "In reported yes or no questions, use <i>if<\/i> or <i>whether<\/i> with statement order. <i>Did I finish<\/i> keeps question order, and <i>that<\/i> is used for statements, not questions."}, {"h": "<span class=\"blank\" data-blank><\/span> she said surprised everyone.", "ans": "What <i>(what as the subject)<\/i>", "type": "mcq", "opts": ["That", "What", "Which"], "a": 1, "x": "A noun clause beginning with <i>what<\/i> can be the subject of the sentence: <i>what she said<\/i> = the thing she said. <i>That she said<\/i> and <i>which she said<\/i> do not work as a subject here."}, {"h": "The idea <span class=\"blank\" data-blank><\/span> children should wear uniforms is popular in many countries.", "ans": "that <i>(idea + that)<\/i>", "type": "mcq", "opts": ["which", "what", "that"], "a": 2, "x": "After <i>idea<\/i>, <i>belief<\/i>, <i>fact<\/i> and <i>claim<\/i>, use <i>that<\/i> to introduce the noun clause. <i>Which<\/i> and <i>what<\/i> are not used in this pattern."}, {"h": "I am sure <span class=\"blank\" data-blank><\/span> he will pass.", "ans": "that <i>(sure + that clause)<\/i>", "type": "mcq", "opts": ["that", "what", "of that"], "a": 0, "x": "After adjectives like <i>sure<\/i> and <i>certain<\/i>, use a <i>that<\/i> clause: <i>I am sure that he will pass<\/i>. <i>What<\/i> does not fit, and <i>of that<\/i> adds an extra preposition."}]}, {"l": "H", "t": "Purpose, result and contrast", "i": "Choose the correct option.", "q": [{"h": "She revised every day <span class=\"blank\" data-blank><\/span> pass the test.", "ans": "so that she could <i>(so that + clause)<\/i>", "type": "mcq", "opts": ["so that she could", "so as she could", "for she could"], "a": 0, "x": "<i>So that<\/i> introduces a purpose clause, with a subject and verb after it (<i>she could pass<\/i>). <i>So as<\/i> must be followed by <i>to<\/i> + verb, and <i>for<\/i> cannot introduce a clause."}, {"h": "The weather was <span class=\"blank\" data-blank><\/span> bad that the flight was cancelled.", "ans": "so <i>(so + adjective + that)<\/i>", "type": "mcq", "opts": ["such", "so", "too"], "a": 1, "x": "<i>So + adjective + that<\/i> expresses a result: the weather was bad, therefore the flight was cancelled. <i>Such<\/i> needs a noun, and <i>too<\/i> does not take <i>that<\/i>."}, {"h": "It was <span class=\"blank\" data-blank><\/span> that we were exhausted.", "ans": "such a long journey <i>(such + a + adjective + noun)<\/i>", "type": "mcq", "opts": ["so long journey", "such long journey", "such a long journey"], "a": 2, "x": "With <i>a long journey<\/i>, a singular countable noun, use <i>such a long journey<\/i>. <i>So<\/i> cannot be followed by a noun phrase, and <i>such long journey<\/i> is missing <i>a<\/i>."}, {"h": "The exam was <span class=\"blank\" data-blank><\/span> difficult for me to finish in time.", "ans": "too <i>(too = more than needed)<\/i>", "type": "mcq", "opts": ["too", "enough", "such"], "a": 0, "x": "<i>Too<\/i> means more than needed or possible: too difficult to finish. <i>Enough<\/i> comes after the adjective, and <i>such<\/i> needs a noun."}, {"h": "She is <span class=\"blank\" data-blank><\/span> to vote.", "ans": "old enough <i>(adjective + enough)<\/i>", "type": "mcq", "opts": ["enough old", "old enough", "too old"], "a": 1, "x": "<i>Enough<\/i> comes after the adjective: <i>old enough<\/i>. <i>Enough old<\/i> is a common mistake. <i>Too old<\/i> would mean the opposite."}, {"h": "He saved money <span class=\"blank\" data-blank><\/span> a car.", "ans": "in order to buy <i>(in order to + base verb)<\/i>", "type": "mcq", "opts": ["for to buy", "in order buy", "in order to buy"], "a": 2, "x": "<i>In order to<\/i> is followed by a base verb to show purpose. <i>In order buy<\/i> is missing <i>to<\/i>, and <i>for to buy<\/i> is not correct."}, {"h": "Students are given extra time <span class=\"blank\" data-blank><\/span>.", "ans": "so that they do not feel pressured <i>(so that + clause)<\/i>", "type": "mcq", "opts": ["so that they do not feel pressured", "so that they not feel pressured", "for they do not feel pressured"], "a": 0, "x": "<i>So that<\/i> introduces a purpose clause, and the verb needs its auxiliary: <i>they do not feel<\/i>. <i>They not feel<\/i> is wrong, and <i>for they do not feel<\/i> is not a correct structure."}, {"h": "The more you practise, <span class=\"blank\" data-blank><\/span> you become.", "ans": "the better <i>(the more... the better)<\/i>", "type": "mcq", "opts": ["the best", "the better", "more better"], "a": 1, "x": "The pattern is <i>the + comparative, the + comparative<\/i>. <i>Better<\/i> is the comparative of <i>good<\/i>; <i>the best<\/i> is the superlative and <i>more better<\/i> is a double comparative."}, {"h": "It was raining heavily; <span class=\"blank\" data-blank><\/span>.", "ans": "nevertheless, we went out <i>(nevertheless is an adverb)<\/i>", "type": "mcq", "opts": ["despite we went out", "although we went out", "nevertheless, we went out"], "a": 2, "x": "<i>Nevertheless<\/i> is an adverb, so it is used after a semicolon or full stop with a comma after it. <i>Despite<\/i> and <i>although<\/i> would need different punctuation and grammar."}, {"h": "Unless you <span class=\"blank\" data-blank><\/span>, your speaking will not improve.", "ans": "practise <i>(unless already means if not)<\/i>", "type": "mcq", "opts": ["practise", "do not practise", "will not practise"], "a": 0, "x": "<i>Unless<\/i> already means <i>if not<\/i>, so the verb should be positive. A negative verb creates a double negative, and the future is not used after <i>unless<\/i>: use the present simple."}]}, {"l": "I", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "Housing takes 35% of income, <span class=\"blank\" data-blank><\/span>.", "ans": "followed by food at 25% <i>(passive participle)<\/i>", "type": "mcq", "opts": ["followed by food at 25%", "following by food at 25%", "and followed food at 25%"], "a": 0, "x": "<i>Followed by food at 25%<\/i> is a passive participle phrase and joins the next item without a new sentence. <i>Following by<\/i> and <i>and followed food<\/i> are not correct forms."}, {"h": "Mobile use rose from 10% to 90%, <span class=\"blank\" data-blank><\/span> from 80% to 10%.", "ans": "whereas landline use fell <i>(whereas joins opposite trends)<\/i>", "type": "mcq", "opts": ["despite landline use fell", "whereas landline use fell", "however landline use fell"], "a": 1, "x": "<i>Whereas<\/i> is a conjunction that contrasts two opposite trends. <i>Despite<\/i> needs a noun phrase, and <i>however<\/i> after a comma makes a comma splice."}, {"h": "Governments should invest in public transport, <span class=\"blank\" data-blank><\/span>.", "ans": "which reduces both traffic and pollution <i>(sentence relative)<\/i>", "type": "mcq", "opts": ["that reduces both traffic and pollution", "what reduces both traffic and pollution", "which reduces both traffic and pollution"], "a": 2, "x": "<i>, which<\/i> refers to the whole idea of investing in public transport and states the result. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot refer back to a clause."}, {"h": "Although technology has many benefits, <span class=\"blank\" data-blank><\/span>.", "ans": "it also creates problems <i>(although without but)<\/i>", "type": "mcq", "opts": ["it also creates problems", "but it also creates problems", "however it also creates problems"], "a": 0, "x": "<i>Although<\/i> sets up the contrast, so the main clause must not begin with <i>but<\/i> or <i>however<\/i>. Use only one: either <i>although... ,<\/i> or <i>but<\/i>."}, {"h": "I really like my hometown, <span class=\"blank\" data-blank><\/span>.", "ans": "which is famous for its tea <i>(non-defining which)<\/i>", "type": "mcq", "opts": ["that is famous for its tea", "which is famous for its tea", "what is famous for its tea"], "a": 1, "x": "The non-defining clause adds extra information about the hometown, so it takes a comma and <i>which<\/i>. <i>That<\/i> is not used after a comma, and <i>what<\/i> cannot follow a noun."}, {"h": "I chose this course <span class=\"blank\" data-blank><\/span>.", "ans": "because I want to become an engineer <i>(because + clause)<\/i>", "type": "mcq", "opts": ["because of I want to become an engineer", "for because I want to become an engineer", "because I want to become an engineer"], "a": 2, "x": "<i>Because<\/i> is a conjunction and is followed by a clause. <i>Because of<\/i> needs a noun phrase, and <i>for because<\/i> is not correct."}, {"h": "People <span class=\"blank\" data-blank><\/span> often suffer from stress.", "ans": "who work long hours <i>(who as the subject)<\/i>", "type": "mcq", "opts": ["who work long hours", "whom work long hours", "which work long hours"], "a": 0, "x": "<i>Who<\/i> is the subject of <i>work<\/i> and refers to people. <i>Whom<\/i> is used for objects, and <i>which<\/i> is for things."}, {"h": "<span class=\"blank\" data-blank><\/span>, I believe the benefits outweigh the drawbacks.", "ans": "Having considered both views <i>(perfect participle)<\/i>", "type": "mcq", "opts": ["Considered both views", "Having considered both views", "To have consider both views"], "a": 1, "x": "<i>Having considered<\/i> shows that the thinking happened before the conclusion, and the subject (<i>I<\/i>) is the same in the main clause. The other forms are not correct."}, {"h": "The main reason <span class=\"blank\" data-blank><\/span> people move to cities is employment.", "ans": "why <i>(reason + why)<\/i>", "type": "mcq", "opts": ["because", "that is why", "why"], "a": 2, "x": "After <i>reason<\/i>, use <i>why<\/i>. <i>Because<\/i> repeats the idea of reason, and <i>that is why<\/i> would need a different sentence structure."}, {"h": "I have a friend <span class=\"blank\" data-blank><\/span>.", "ans": "whose brother is a footballer <i>(whose replaces his)<\/i>", "type": "mcq", "opts": ["whose brother is a footballer", "who his brother is a footballer", "which brother is a footballer"], "a": 0, "x": "<i>Whose<\/i> replaces <i>his<\/i> and links the friend to the brother. <i>Who his brother<\/i> repeats the possessive, and <i>which<\/i> is for things."}]}, {"l": "J", "t": "Mixed review: relative clauses in Task 2", "i": "Choose the correct option.", "q": [{"h": "The number of people <span class=\"blank\" data-blank><\/span> has risen sharply.", "ans": "who own cars <i>(no repeated subject)<\/i>", "type": "mcq", "opts": ["who own cars", "who they own cars", "which own cars"], "a": 0, "x": "The relative pronoun <i>who<\/i> is the subject of <i>own<\/i>, so it cannot be followed by another subject (<i>who they own<\/i>). <i>Which<\/i> is for things, not people."}, {"h": "Children <span class=\"blank\" data-blank><\/span> tend to do better at school.", "ans": "whose parents read to them <i>(whose shows possession)<\/i>", "type": "mcq", "opts": ["which parents read to them", "whose parents read to them", "who their parents read to them"], "a": 1, "x": "<i>Whose parents<\/i> shows that the parents belong to the children. <i>Which<\/i> is for things, and <i>who their parents<\/i> repeats the possessive."}, {"h": "The country <span class=\"blank\" data-blank><\/span> the study took place has a warm climate.", "ans": "where <i>(where for places)<\/i>", "type": "mcq", "opts": ["which", "in where", "where"], "a": 2, "x": "<i>Where<\/i> introduces a clause about a place. <i>Which took place<\/i> would need a preposition, and <i>in where<\/i> is not used."}, {"h": "Online courses, <span class=\"blank\" data-blank><\/span> attract many adults.", "ans": "which are cheaper than classroom courses, <i>(non-defining: commas, which)<\/i>", "type": "mcq", "opts": ["which are cheaper than classroom courses,", "that are cheaper than classroom courses,", "which are cheaper than classroom courses"], "a": 0, "x": "A non-defining clause takes <i>which<\/i> and a comma before and after. <i>That<\/i> is not used after a comma, and a missing second comma leaves the clause without an end."}, {"h": "It is widely believed <span class=\"blank\" data-blank><\/span> exercise improves concentration.", "ans": "that <i>(noun clause with that)<\/i>", "type": "mcq", "opts": ["what", "that", "which"], "a": 1, "x": "After <i>it is widely believed<\/i>, use <i>that<\/i> to introduce the noun clause. <i>What<\/i> and <i>which<\/i> do not fit in this structure."}, {"h": "Students <span class=\"blank\" data-blank><\/span> the exam may retake it after one month.", "ans": "who fail <i>(verb agrees with students)<\/i>", "type": "mcq", "opts": ["who fails", "whom fail", "who fail"], "a": 2, "x": "The verb in a relative clause agrees with its antecedent: <i>students<\/i> is plural, so use <i>fail<\/i>. <i>Fails<\/i> is singular, and <i>whom<\/i> cannot be the subject."}, {"h": "He is one of the people <span class=\"blank\" data-blank><\/span> influenced my life.", "ans": "who have <i>(relative verb agrees with people)<\/i>", "type": "mcq", "opts": ["who have", "who has", "which have"], "a": 0, "x": "In <i>one of the people who<\/i>, the relative pronoun refers to <i>people<\/i>, which is plural. So the verb is <i>have<\/i>, not <i>has<\/i>. <i>Which<\/i> is not used for people."}, {"h": "The graph, <span class=\"blank\" data-blank><\/span> shows a clear trend.", "ans": "which I studied carefully, <i>(no repeated object)<\/i>", "type": "mcq", "opts": ["that I studied carefully,", "which I studied carefully,", "which I studied it carefully,"], "a": 1, "x": "The relative pronoun already stands for the object of <i>studied<\/i>. Do not repeat it with <i>it<\/i>. <i>That<\/i> is not used after a comma."}, {"h": "The woman <span class=\"blank\" data-blank><\/span> I spoke was very helpful.", "ans": "to whom <i>(preposition + whom)<\/i>", "type": "mcq", "opts": ["to who", "whom to", "to whom"], "a": 2, "x": "When a preposition comes before the relative pronoun for a person, use <i>whom<\/i>: <i>to whom I spoke<\/i>. <i>To who<\/i> is informal and incorrect in formal writing, and <i>whom to<\/i> is the wrong order."}, {"h": "I read an article <span class=\"blank\" data-blank><\/span>.", "ans": "about how technology affects sleep <i>(statement word order)<\/i>", "type": "mcq", "opts": ["about how technology affects sleep", "about how does technology affect sleep", "about how technology affect sleep"], "a": 0, "x": "A noun clause after <i>about how<\/i> uses statement order: <i>technology affects sleep<\/i>. Question order (<i>how does technology affect<\/i>) is only for direct questions, and the verb must agree (<i>affects<\/i>)."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) Although the course was difficult, but she passed it.<br>B) Although the course was difficult, she passed it.<br>C) Despite the course was difficult, she passed it.<br>D) Despite of the course being difficult, she passed it.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct. <i>Although<\/i> already shows the contrast, so <i>but<\/i> is not added (A). <i>Despite<\/i> must be followed by a noun phrase or -ing form, not a clause (C). <i>Despite of<\/i> is not a correct phrase (D)."}, {"h": "A) My brother, that lives in Canada, is a dentist.<br>B) My brother who lives in Canada, is a dentist.<br>C) My brother, who he lives in Canada, is a dentist.<br>D) My brother, who lives in Canada, is a dentist.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. A non-defining clause for a person uses <i>who<\/i> and commas on both sides. A uses <i>that<\/i> after a comma. B misses the first comma. C repeats the subject with <i>he<\/i>."}, {"h": "A) Sales peaked in 2015, falling steadily afterwards.<br>B) Sales peaked in 2015, they fell steadily afterwards.<br>C) Sales peaked in 2015, and falling steadily afterwards.<br>D) Sales peaked in 2015, fell steadily afterwards.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. <i>Falling steadily afterwards<\/i> is a participle clause with the same subject as the main clause. B is a comma splice, C mixes <i>and<\/i> with an -ing form, and D has two verbs with only a comma."}, {"h": "A) The city which I grew up has changed a lot.<br>B) The city where I grew up in it has changed a lot.<br>C) The city where I grew up has changed a lot.<br>D) The city who I grew up has changed a lot.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct. <i>Where<\/i> replaces <i>in which<\/i>. A leaves out the preposition, B repeats the place with <i>in it<\/i>, and D uses <i>who<\/i>, which is only for people."}, {"h": "A) She revised every day for that she could pass the test.<br>B) She revised every day so as she could pass the test.<br>C) She revised every day so that she could pass the test.<br>D) She revised every day in order she could pass the test.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct. <i>So that<\/i> introduces a clause that expresses purpose. A (<i>for that<\/i>), B (<i>so as she could<\/i>) and D (<i>in order she could<\/i>) are not correct structures."}, {"h": "A) It was such a difficult exam that many students failed.<br>B) It was so a difficult exam that many students failed.<br>C) It was such difficult exam that many students failed.<br>D) It was so difficult exam that many students failed.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. A singular countable noun takes <i>such a + adjective + noun<\/i>. B uses <i>so a<\/i>, C leaves out <i>a<\/i>, and D uses <i>so<\/i> before a noun phrase."}, {"h": "A) Dhaka the capital of Bangladesh, is crowded.<br>B) Dhaka, the capital of Bangladesh is crowded.<br>C) Dhaka, which the capital of Bangladesh, is crowded.<br>D) Dhaka, the capital of Bangladesh, is crowded.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. An appositive needs a comma before and after it. A misses the first comma, B misses the last comma, and C adds <i>which<\/i> without a verb."}, {"h": "A) Walking to work, a new shop caught my attention.<br>B) Walking to work, I noticed a new shop.<br>C) Walking to work, the shop was new.<br>D) While walk to work, I noticed a new shop.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct. The subject of the main clause (<i>I<\/i>) is the person who is walking. A and C make the shop or the attention do the walking (dangling participle). D uses <i>walk<\/i> instead of <i>walking<\/i>."}, {"h": "A) I do not know where he lives.<br>B) I do not know where does he live.<br>C) I do not know where he live.<br>D) I do not know that where he lives.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct. A noun clause uses statement word order: <i>where he lives<\/i>. B uses question order, C drops the <i>-s<\/i>, and D adds an unnecessary <i>that<\/i>."}, {"h": "A) Unless you do not practise, you will not improve.<br>B) Unless you will practise, you will not improve.<br>C) Unless you practising, you will not improve.<br>D) Unless you practise, you will not improve.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct. <i>Unless<\/i> already means <i>if not<\/i>, so the verb is positive, and the future is not used after it. A uses a double negative, B uses <i>will<\/i>, and C has no finite verb."}]}]}, {"n": 7, "title": "Conditionals: Real, Unreal, Mixed and Inverted", "level": "Level 2 · Band 6 to 8", "g": [{"l": "A", "t": "Zero and first conditionals", "i": "Choose the correct option.", "q": [{"h": "If governments <span class=\"blank\" data-blank><\/span> in public transport, congestion will fall.", "ans": "invest <i>(present simple after if)<\/i>", "type": "mcq", "opts": ["invest", "will invest", "would invest"], "a": 0, "x": "This is a first conditional about a likely future: <i>if + present simple, will + base verb<\/i>. After <i>if<\/i>, never use <i>will<\/i> or <i>would<\/i>. <i>Will invest<\/i> and <i>would invest<\/i> are two of the most common conditional errors at band 6."}, {"h": "If it <span class=\"blank\" data-blank><\/span> tomorrow, we will stay at home.", "ans": "rains <i>(present simple after if)<\/i>", "type": "mcq", "opts": ["will rain", "rains", "rained"], "a": 1, "x": "The result clause uses <i>will<\/i>, so this is a first conditional and the if-clause takes the present simple: <i>if it rains<\/i>. <i>Will rain<\/i> repeats the future in the if-clause, and <i>rained<\/i> is a past form that would need <i>would<\/i> in the result."}, {"h": "If you <span class=\"blank\" data-blank><\/span> tired, take a break.", "ans": "feel <i>(present simple, then an imperative)<\/i>", "type": "mcq", "opts": ["will feel", "would feel", "feel"], "a": 2, "x": "The result is an imperative (<i>take a break<\/i>), so the if-clause is a present simple: <i>if you feel tired<\/i>. <i>Will feel<\/i> and <i>would feel<\/i> put a future or unreal form in the if-clause, which is wrong."}, {"h": "If students <span class=\"blank\" data-blank><\/span> badly, their concentration drops.", "ans": "sleep <i>(zero conditional: present simple in both clauses)<\/i>", "type": "mcq", "opts": ["sleep", "will sleep", "slept"], "a": 0, "x": "<i>Their concentration drops<\/i> is a general truth, so this is a zero conditional: present simple in both clauses. <i>Will sleep<\/i> puts a future in the if-clause, and <i>slept<\/i> would make the whole sentence about the past."}, {"h": "If the policy fails, costs <span class=\"blank\" data-blank><\/span>.", "ans": "might rise <i>(first conditional with a modal)<\/i>", "type": "mcq", "opts": ["would rise", "might rise", "might have risen"], "a": 1, "x": "A first conditional can use a modal in the result to show how sure you are: <i>might rise<\/i>. <i>Would rise<\/i> belongs to a second conditional and does not match <i>if the policy fails<\/i>. <i>Might have risen<\/i> is a past form."}, {"h": "Unless you <span class=\"blank\" data-blank><\/span>, you will not pass.", "ans": "revise <i>(unless already means if not)<\/i>", "type": "mcq", "opts": ["do not revise", "will revise", "revise"], "a": 2, "x": "<i>Unless<\/i> already means <i>if not<\/i>, so <i>unless you do not revise<\/i> is a double negative. <i>Will revise<\/i> is wrong too, because the future is not used after <i>unless<\/i>. Use the present simple: <i>unless you revise<\/i>."}, {"h": "If you miss the deadline, <span class=\"blank\" data-blank><\/span> your tutor immediately.", "ans": "contact <i>(an imperative needs the base verb)<\/i>", "type": "mcq", "opts": ["contact", "contacting", "to contact"], "a": 0, "x": "After the if-clause, an instruction takes the imperative, which is the base verb: <i>contact your tutor<\/i>. <i>Contacting<\/i> and <i>to contact<\/i> are not imperatives."}, {"h": "I will call you as soon as I <span class=\"blank\" data-blank><\/span>.", "ans": "arrive <i>(present simple after a time word)<\/i>", "type": "mcq", "opts": ["will arrive", "arrive", "arrived"], "a": 1, "x": "After a time word such as <i>as soon as<\/i>, <i>when<\/i>, <i>before<\/i> or <i>after<\/i>, the future is expressed with the present simple: <i>as soon as I arrive<\/i>. <i>Will arrive<\/i> repeats the future, and <i>arrived<\/i> is a past form."}, {"h": "If I <span class=\"blank\" data-blank><\/span> him, I will tell him.", "ans": "see <i>(present simple after if)<\/i>", "type": "mcq", "opts": ["will see", "would see", "see"], "a": 2, "x": "The result clause (<i>I will tell him<\/i>) shows a first conditional, so the if-clause takes the present simple: <i>if I see him<\/i>. <i>Will see<\/i> and <i>would see<\/i> are not used after <i>if<\/i> here."}, {"h": "The match will be cancelled if the weather <span class=\"blank\" data-blank><\/span> worse.", "ans": "gets <i>(present simple after if)<\/i>", "type": "mcq", "opts": ["gets", "will get", "would get"], "a": 0, "x": "<i>Will be cancelled<\/i> is the result, so the if-clause stays in the present simple: <i>if the weather gets worse<\/i>. Putting the if-clause last does not change the tense, and no comma is needed."}]}, {"l": "B", "t": "Second conditional", "i": "Choose the correct option.", "q": [{"h": "If I <span class=\"blank\" data-blank><\/span> more free time, I would study abroad.", "ans": "had <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["had", "would have", "have"], "a": 0, "x": "This is a second conditional about an unreal present: <i>if + past simple, would + base verb<\/i>. The past simple <i>had<\/i> does not mean past time. It shows the situation is unreal. <i>Would have<\/i> in the if-clause is a very common error."}, {"h": "If I <span class=\"blank\" data-blank><\/span> you, I would take the course.", "ans": "were <i>(were for advice)<\/i>", "type": "mcq", "opts": ["would be", "were", "am"], "a": 1, "x": "<i>If I were you<\/i> is the standard form of advice. <i>Were<\/i> is used for every person after <i>if<\/i> in the second conditional. <i>Would be<\/i> does not belong in the if-clause, and <i>am<\/i> is a real present, not an imagined one."}, {"h": "If tuition <span class=\"blank\" data-blank><\/span> free, more students could attend.", "ans": "were <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["would be", "will be", "were"], "a": 2, "x": "The result <i>more students could attend<\/i> shows a second conditional, so the if-clause uses the past simple (<i>were<\/i>). <i>Would be<\/i> cannot follow <i>if<\/i>, and <i>will be<\/i> belongs to a first conditional."}, {"h": "If cities banned cars, air quality <span class=\"blank\" data-blank><\/span>.", "ans": "might improve <i>(second conditional: modal + base verb)<\/i>", "type": "mcq", "opts": ["might improve", "might have improved", "improved"], "a": 0, "x": "This is a second conditional (<i>if cities banned<\/i>), so the result uses a modal plus the base verb: <i>might improve<\/i>. <i>Might have improved<\/i> is a third conditional result, and <i>improved<\/i> is a plain past."}, {"h": "If I <span class=\"blank\" data-blank><\/span> the lottery, I would travel the world.", "ans": "won <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["would win", "won", "will win"], "a": 1, "x": "The result <i>I would travel<\/i> shows a second conditional, so the if-clause uses the past simple: <i>won<\/i>. <i>Would win<\/i> in the if-clause is wrong, and <i>will win<\/i> belongs to a first conditional."}, {"h": "I would live abroad if I <span class=\"blank\" data-blank><\/span> the chance.", "ans": "had <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["would have", "have", "had"], "a": 2, "x": "The result clause comes first (<i>I would live abroad<\/i>), so no comma is needed before <i>if<\/i>. The if-clause is still a past simple: <i>had<\/i>. <i>Would have<\/i> and <i>have<\/i> do not fit a second conditional."}, {"h": "If companies offered flexible hours, employees <span class=\"blank\" data-blank><\/span> happier.", "ans": "would be <i>(second conditional result)<\/i>", "type": "mcq", "opts": ["would be", "will be", "would have been"], "a": 0, "x": "<i>If companies offered<\/i> is a second conditional, so the result is <i>would + base verb<\/i>: <i>would be happier<\/i>. <i>Will be<\/i> mixes first and second, and <i>would have been<\/i> is a third conditional result."}, {"h": "If the government <span class=\"blank\" data-blank><\/span> to ban plastic bags, waste would fall sharply.", "ans": "were <i>(were to for an unlikely event)<\/i>", "type": "mcq", "opts": ["would be", "were", "is"], "a": 1, "x": "<i>Were to<\/i> is used for an unlikely or hypothetical future event: <i>if the government were to ban<\/i>. <i>Would be to<\/i> and <i>is to<\/i> are not correct forms."}, {"h": "If students <span class=\"blank\" data-blank><\/span> more choice, they would feel more motivated.", "ans": "had <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["would have", "have", "had"], "a": 2, "x": "The result <i>they would feel more motivated<\/i> shows a second conditional, so the if-clause uses the past simple: <i>had<\/i>. <i>Would have<\/i> in the if-clause is wrong, and <i>have<\/i> creates a first conditional mismatch."}, {"h": "If prices doubled, many families <span class=\"blank\" data-blank><\/span>.", "ans": "could not cope <i>(second conditional result)<\/i>", "type": "mcq", "opts": ["could not cope", "can not cope", "could not have coped"], "a": 0, "x": "<i>If prices doubled<\/i> is a second conditional, so the result is <i>would / could + base verb<\/i>: <i>could not cope<\/i>. <i>Can not cope<\/i> is a present form, and <i>could not have coped<\/i> is a third conditional result."}]}, {"l": "C", "t": "Third conditional", "i": "Choose the correct option.", "q": [{"h": "If she <span class=\"blank\" data-blank><\/span>, she would have passed.", "ans": "had revised <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["had revised", "revised", "would have revised"], "a": 0, "x": "This is a third conditional about the unreal past: <i>if + past perfect, would have + past participle<\/i>. <i>Revised<\/i> is only a past simple, and <i>would have revised<\/i> repeats <i>would have<\/i> in the if-clause, which is a common error."}, {"h": "If we had left earlier, we <span class=\"blank\" data-blank><\/span> the train.", "ans": "would have caught <i>(third conditional result)<\/i>", "type": "mcq", "opts": ["would catch", "would have caught", "will have caught"], "a": 1, "x": "The if-clause is a past perfect (<i>had left<\/i>), so the result uses <i>would have + past participle<\/i>: <i>would have caught<\/i>. <i>Would catch<\/i> is a present or future form, and <i>will have caught<\/i> is a future perfect."}, {"h": "The project would have failed if volunteers <span class=\"blank\" data-blank><\/span>.", "ans": "had not helped <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["did not help", "would not have helped", "had not helped"], "a": 2, "x": "The if-clause is the second half of a third conditional, so it uses the past perfect: <i>had not helped<\/i>. <i>Did not help<\/i> is a past simple, and <i>would not have helped<\/i> repeats the result form after <i>if<\/i>."}, {"h": "If I <span class=\"blank\" data-blank><\/span> about the delay, I would have left earlier.", "ans": "had known <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["had known", "knew", "would have known"], "a": 0, "x": "After <i>if<\/i> in a third conditional, use <i>had + past participle<\/i>: <i>had known<\/i>. <i>Knew<\/i> is the second conditional form, and <i>would have known<\/i> is wrong in an if-clause."}, {"h": "If prices had stayed low, demand <span class=\"blank\" data-blank><\/span>.", "ans": "might have grown <i>(third conditional: might have + participle)<\/i>", "type": "mcq", "opts": ["might grow", "might have grown", "might had grown"], "a": 1, "x": "A third conditional result can use <i>might have + past participle<\/i> to show a possibility: <i>might have grown<\/i>. <i>Might grow<\/i> refers to the present or future, and <i>might had grown<\/i> is not a correct form."}, {"h": "If he had not ignored the warning, the accident <span class=\"blank\" data-blank><\/span>.", "ans": "would not have happened <i>(third conditional result)<\/i>", "type": "mcq", "opts": ["would not happen", "had not happened", "would not have happened"], "a": 2, "x": "The result of a negative if-clause in the past uses <i>would not have + past participle<\/i>: <i>would not have happened<\/i>. <i>Would not happen<\/i> is a present or future form, and <i>had not happened<\/i> belongs in an if-clause."}, {"h": "If they <span class=\"blank\" data-blank><\/span> earlier, profits could have doubled.", "ans": "had invested <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["had invested", "would have invested", "invested"], "a": 0, "x": "A third conditional if-clause uses the past perfect: <i>had invested<\/i>. <i>Could have doubled<\/i> in the result shows a past possibility. <i>Would have invested<\/i> and <i>invested<\/i> are not correct here."}, {"h": "If I <span class=\"blank\" data-blank><\/span> more, I would not have felt so nervous.", "ans": "had studied <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["studied", "had studied", "would have studied"], "a": 1, "x": "The result <i>I would not have felt<\/i> shows a third conditional, so the if-clause needs the past perfect: <i>had studied<\/i>. <i>Studied<\/i> makes a second conditional, and <i>would have studied<\/i> is wrong after <i>if<\/i>."}, {"h": "If the government had acted sooner, fewer people <span class=\"blank\" data-blank><\/span> their jobs.", "ans": "would have lost <i>(third conditional result)<\/i>", "type": "mcq", "opts": ["had lost", "will have lost", "would have lost"], "a": 2, "x": "The if-clause is <i>had acted<\/i>, so the result uses <i>would have + past participle<\/i>: <i>would have lost<\/i>. <i>Had lost<\/i> belongs in an if-clause, and <i>will have lost<\/i> is a future perfect."}, {"h": "If I <span class=\"blank\" data-blank><\/span> listened to my teacher, I would have scored lower.", "ans": "hadn't <i>(negative past perfect)<\/i>", "type": "mcq", "opts": ["hadn't", "didn't", "wouldn't have"], "a": 0, "x": "The result <i>I would have scored lower<\/i> is a third conditional, and a negative if-clause uses <i>had not<\/i> (<i>hadn't<\/i>). <i>Didn't listen<\/i> is a past simple. <i>Wouldn't have listened<\/i> repeats the result form after <i>if<\/i>."}]}, {"l": "E", "t": "Mixed conditionals", "i": "Choose the correct option.", "q": [{"h": "If I had studied medicine, I <span class=\"blank\" data-blank><\/span> a doctor now.", "ans": "would be <i>(mixed: now needs would + base verb)<\/i>", "type": "mcq", "opts": ["would be", "would have been", "will be"], "a": 0, "x": "This is a mixed conditional: a past condition (<i>had studied<\/i>) with a result in the present (<i>now<\/i>). The result uses <i>would + base verb<\/i>: <i>would be<\/i>. <i>Would have been<\/i> is a regular third conditional and does not match <i>now<\/i>."}, {"h": "If she had accepted the job, she <span class=\"blank\" data-blank><\/span> in London today.", "ans": "would live <i>(mixed: today needs would + base verb)<\/i>", "type": "mcq", "opts": ["would have lived", "would live", "lived"], "a": 1, "x": "The time word <i>today<\/i> shows a present result, so the result is <i>would + base verb<\/i>: <i>would live<\/i>. <i>Would have lived<\/i> would refer only to the past, and <i>lived<\/i> is not a conditional result."}, {"h": "If I hadn't missed the bus, I <span class=\"blank\" data-blank><\/span> late now.", "ans": "wouldn't be <i>(mixed: now needs would + base verb)<\/i>", "type": "mcq", "opts": ["wouldn't have been", "won't be", "wouldn't be"], "a": 2, "x": "<i>Now<\/i> shows that the result is in the present: <i>wouldn't be late now<\/i>. <i>Wouldn't have been<\/i> refers to the past, and <i>won't be<\/i> is a first conditional result."}, {"h": "If he <span class=\"blank\" data-blank><\/span> more careful, he would not have made that error.", "ans": "were <i>(mixed: a present state in the if-clause)<\/i>", "type": "mcq", "opts": ["were", "is", "would be"], "a": 0, "x": "This mixed conditional links a present state (<i>he is careless<\/i>) to a past result (<i>made that error<\/i>), so the if-clause uses the past simple: <i>were<\/i>. <i>Is<\/i> is a real present, and <i>would be<\/i> cannot follow <i>if<\/i>."}, {"h": "If the company <span class=\"blank\" data-blank><\/span> in training, its staff would be more skilled now.", "ans": "had invested <i>(mixed: past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["invested", "had invested", "would have invested"], "a": 1, "x": "The if-clause refers to the past (<i>had invested<\/i>), and the result is in the present (<i>would be more skilled now<\/i>). <i>Invested<\/i> and <i>would have invested<\/i> do not give the past-perfect form this mixed conditional needs."}, {"h": "If schools had taught financial skills, fewer adults <span class=\"blank\" data-blank><\/span> debt today.", "ans": "would have <i>(mixed: today needs would + base verb)<\/i>", "type": "mcq", "opts": ["would have had", "had", "would have"], "a": 2, "x": "<i>Today<\/i> shows a present result, so the result clause uses <i>would + base verb<\/i>: <i>would have debt<\/i>. <i>Would have had<\/i> refers to a past result, and <i>had<\/i> is not a conditional result."}, {"h": "If prices <span class=\"blank\" data-blank><\/span> not so high, more families would have enrolled last year.", "ans": "were <i>(mixed: a present state in the if-clause)<\/i>", "type": "mcq", "opts": ["were", "would be", "are"], "a": 0, "x": "<i>Would have enrolled last year<\/i> is a past result, and <i>not so high<\/i> is a present state, so the if-clause uses the past simple: <i>were<\/i>. <i>Would be<\/i> and <i>are<\/i> do not fit after <i>if<\/i> in this mixed conditional."}, {"h": "If I <span class=\"blank\" data-blank><\/span> better English, I would have got that job.", "ans": "spoke <i>(mixed: a present ability in the if-clause)<\/i>", "type": "mcq", "opts": ["speak", "spoke", "would speak"], "a": 1, "x": "A present ability (<i>I speak better English<\/i>) explains a past result (<i>would have got that job<\/i>), so the if-clause uses the past simple: <i>spoke<\/i>. <i>Speak<\/i> is a first conditional form, and <i>would speak<\/i> is wrong after <i>if<\/i>."}, {"h": "If the city had built better roads, the traffic <span class=\"blank\" data-blank><\/span> lighter today.", "ans": "would be <i>(mixed: today needs would + base verb)<\/i>", "type": "mcq", "opts": ["would have been", "is", "would be"], "a": 2, "x": "The if-clause is a past perfect (<i>had built<\/i>) and <i>today<\/i> shows a present result, so use <i>would + base verb<\/i>: <i>would be lighter<\/i>. <i>Would have been<\/i> would refer to a past result."}, {"h": "If she <span class=\"blank\" data-blank><\/span> not so shy, she would have spoken at the meeting.", "ans": "were <i>(mixed: a lasting trait in the if-clause)<\/i>", "type": "mcq", "opts": ["were", "would be", "is"], "a": 0, "x": "A lasting trait (<i>so shy<\/i>) explains a past result (<i>would have spoken<\/i>), so the if-clause uses the past simple: <i>were<\/i>. <i>Would be<\/i> and <i>is<\/i> are not correct after <i>if<\/i> in this mixed conditional."}]}, {"l": "F", "t": "Inverted conditionals", "i": "Choose the correct option.", "q": [{"h": "<span class=\"blank\" data-blank><\/span> the fees lower, more students could enrol.", "ans": "Were <i>(second conditional inversion)<\/i>", "type": "mcq", "opts": ["Were", "Had", "Should"], "a": 0, "x": "This is an inverted second conditional: <i>Were + subject<\/i> replaces <i>if + past simple<\/i>. <i>Had the fees<\/i> would need a past participle, and <i>Should the fees lower<\/i> is not grammatical. The result (<i>could enrol<\/i>) confirms the second conditional."}, {"h": "<span class=\"blank\" data-blank><\/span> the government acted sooner, the crisis would have been avoided.", "ans": "Had <i>(third conditional inversion)<\/i>", "type": "mcq", "opts": ["Were", "Had", "Should"], "a": 1, "x": "This is an inverted third conditional: <i>Had + subject + past participle<\/i>. <i>Were the government acted<\/i> is not a correct form, and <i>Should<\/i> belongs to a first conditional. The result (<i>would have been avoided<\/i>) confirms the third conditional."}, {"h": "<span class=\"blank\" data-blank><\/span> you need help, please contact us.", "ans": "Should <i>(unlikely first conditional inversion)<\/i>", "type": "mcq", "opts": ["Were", "Had", "Should"], "a": 2, "x": "<i>Should + subject + base verb<\/i> is a formal, polite way to express an unlikely event. The result is an imperative (<i>please contact us<\/i>). <i>Were you need<\/i> and <i>Had you need<\/i> are not correct."}, {"h": "Had I <span class=\"blank\" data-blank><\/span> about the delay, I would have left earlier.", "ans": "known <i>(Had + past participle)<\/i>", "type": "mcq", "opts": ["known", "knew", "know"], "a": 0, "x": "After the inverted <i>Had<\/i>, use a past participle: <i>Had I known<\/i>. <i>Knew<\/i> is a past simple and <i>know<\/i> is a base form. The result (<i>would have left<\/i>) confirms a third conditional."}, {"h": "Had she <span class=\"blank\" data-blank><\/span>, she would be here now.", "ans": "not left <i>(Had + subject + not)<\/i>", "type": "mcq", "opts": ["didn't leave", "not left", "left not"], "a": 1, "x": "The negative of an inverted <i>Had<\/i> clause is <i>Had + subject + not + past participle<\/i>: <i>Had she not left<\/i>. <i>Didn't leave<\/i> and <i>left not<\/i> are not correct. The result <i>would be here now<\/i> is a mixed conditional."}, {"h": "Were the government <span class=\"blank\" data-blank><\/span>, costs would fall.", "ans": "to act <i>(Were + subject + to + base verb)<\/i>", "type": "mcq", "opts": ["acting", "acts", "to act"], "a": 2, "x": "<i>Were + subject + to + base verb<\/i> is a formal way to say an unlikely future: <i>Were the government to act<\/i>. <i>Acting<\/i> and <i>acts<\/i> do not follow <i>Were<\/i> in this structure."}, {"h": "<span class=\"blank\" data-blank><\/span> scholarships, many students could not afford university.", "ans": "Were it not for <i>(formal: without, now)<\/i>", "type": "mcq", "opts": ["Were it not for", "If it was not for", "Had it not for"], "a": 0, "x": "<i>Were it not for + noun<\/i> means <i>without<\/i> in a present or general situation. <i>If it was not for<\/i> is informal and uses <i>was<\/i>, and <i>Had it not for<\/i> is not a correct structure."}, {"h": "Should you <span class=\"blank\" data-blank><\/span> help, please contact us.", "ans": "need <i>(Should + base verb)<\/i>", "type": "mcq", "opts": ["will need", "need", "needed"], "a": 1, "x": "<i>Should<\/i> is followed by the base verb: <i>Should you need help<\/i>. <i>Will need<\/i> puts a future form after <i>should<\/i>, and <i>needed<\/i> is a past form."}, {"h": "<span class=\"blank\" data-blank><\/span> the rescue team, more people would have died.", "ans": "Had it not been for <i>(formal: without, past)<\/i>", "type": "mcq", "opts": ["If it had not for", "Were it not been for", "Had it not been for"], "a": 2, "x": "<i>Had it not been for + noun<\/i> means <i>without<\/i> in a past situation. <i>If it had not for<\/i> and <i>Were it not been for<\/i> are not grammatical. The result <i>would have died<\/i> confirms a third conditional."}, {"h": "Were I in your position, I <span class=\"blank\" data-blank><\/span> the offer.", "ans": "would accept <i>(second conditional result)<\/i>", "type": "mcq", "opts": ["would accept", "will accept", "would have accepted"], "a": 0, "x": "The inverted <i>Were I in your position<\/i> is a second conditional, so the result is <i>would + base verb<\/i>: <i>would accept<\/i>. <i>Will accept<\/i> is a first conditional result, and <i>would have accepted<\/i> is a third conditional result."}]}, {"l": "G", "t": "Unless, provided that, as long as and other words", "i": "Choose the correct option.", "q": [{"h": "Unless governments act, emissions <span class=\"blank\" data-blank><\/span> rising.", "ans": "will keep <i>(unless + present simple, then will)<\/i>", "type": "mcq", "opts": ["will keep", "would keep", "will not keep"], "a": 0, "x": "<i>Unless + present simple<\/i> is followed by <i>will<\/i> for the future: <i>will keep rising<\/i>. <i>Would keep<\/i> does not match the real condition, and <i>will not keep rising<\/i> says the opposite of the intended meaning."}, {"h": "<span class=\"blank\" data-blank><\/span> you revise, you will not pass.", "ans": "Unless <i>(unless = if not)<\/i>", "type": "mcq", "opts": ["If", "Unless", "Although"], "a": 1, wish I had more time<\/i>. <i>Have<\/i> is a present form, and <i>would have<\/i> is not used after <i>wish<\/i> for yourself."}, {"h": "If only I <span class=\"blank\" data-blank><\/span> for the test.", "ans": "had revised <i>(if only + past perfect)<\/i>", "type": "mcq", "opts": ["revised", "had revised", "would revise"], "a": 1, "x": "<i>If only + past perfect<\/i> expresses a regret about the past: <i>If only I had revised<\/i>. <i>Revised<\/i> would suggest a present regret, and <i>would revise<\/i> is wrong for your own past."}, {"h": "I wish my neighbour <span class=\"blank\" data-blank><\/span> making noise at night.", "ans": "would stop <i>(wish + would: annoyance with others)<\/i>", "type": "mcq", "opts": ["stops", "is stopping", "would stop"], "a": 2, "x": "<i>Wish + would<\/i> expresses annoyance with another person's behaviour: <i>I wish my neighbour would stop<\/i>. <i>Stops<\/i> and <i>is stopping<\/i> do not follow <i>wish<\/i> correctly."}, {"h": "He speaks as if he <span class=\"blank\" data-blank><\/span> an expert.", "ans": "were <i>(as if + were: unreal comparison)<\/i>", "type": "mcq", "opts": ["were", "is", "will be"], "a": 0, "x": "<i>As if<\/i> introduces an unreal comparison, so use the past subjunctive <i>were<\/i>: <i>as if he were an expert<\/i>. <i>Is<\/i> would suggest he really is, and <i>will be<\/i> is a future form."}, {"h": "I would rather you <span class=\"blank\" data-blank><\/span> tomorrow.", "ans": "came <i>(would rather + past simple)<\/i>", "type": "mcq", "opts": ["coming", "came", "would come"], "a": 1, "x": "<i>Would rather + subject + past simple<\/i> expresses a preference about someone else's action: <i>I would rather you came tomorrow<\/i>. <i>Coming<\/i> and <i>would come<\/i> are not correct here."}, {"h": "I wish I <span class=\"blank\" data-blank><\/span> medicine.", "ans": "had studied <i>(wish + past perfect: past regret)<\/i>", "type": "mcq", "opts": ["studied", "would study", "had studied"], "a": 2, "x": "<i>Wish + past perfect<\/i> expresses a regret about the past: <i>I wish I had studied medicine<\/i>. <i>Studied<\/i> would suggest a present regret, and <i>would study<\/i> is wrong for your own past."}, {"h": "It is time the government <span class=\"blank\" data-blank><\/span>.", "ans": "acted <i>(it is time + past simple)<\/i>", "type": "mcq", "opts": ["acted", "will act", "to act"], "a": 0, "x": "<i>It is time + past simple<\/i> says an action is overdue: <i>It is time the government acted<\/i>. <i>Will act<\/i> and <i>to act<\/i> do not follow <i>it is time + subject<\/i>."}, {"h": "If only I <span class=\"blank\" data-blank><\/span> closer to the university.", "ans": "lived <i>(if only + past simple)<\/i>", "type": "mcq", "opts": ["would live", "lived", "live"], "a": 1, "x": "<i>If only + past simple<\/i> expresses a regret about the present: <i>If only I lived closer<\/i>. <i>Would live<\/i> and <i>live<\/i> are not correct for your own situation."}, {"h": "I wish I <span class=\"blank\" data-blank><\/span> taller.", "ans": "were <i>(wish + were)<\/i>", "type": "mcq", "opts": ["would be", "am", "were"], "a": 2, "x": "<i>Wish + were<\/i> expresses a regret about the present state: <i>I wish I were taller<\/i>. <i>Would be<\/i> is not used for your own state after <i>wish<\/i>, and <i>am<\/i> is a real present."}, {"h": "She looks as if she <span class=\"blank\" data-blank><\/span> a ghost.", "ans": "had seen <i>(as if + past perfect)<\/i>", "type": "mcq", "opts": ["had seen", "saw", "has see"], "a": 0, "x": "<i>As if<\/i> with a past perfect compares to something that did not actually happen before: <i>as if she had seen a ghost<\/i>. <i>Saw<\/i> and <i>has see<\/i> do not express the earlier, unreal action correctly."}]}, {"l": "I", "t": "Mixed review: IELTS contexts", "i": "Choose the correct option.", "q": [{"h": "If governments <span class=\"blank\" data-blank><\/span> in renewable energy, emissions will fall.", "ans": "invest <i>(present simple after if)<\/i>", "type": "mcq", "opts": ["invest", "will invest", "would invest"], "a": 0, "x": "This is a first conditional about a future result: <i>if + present simple, will + base verb<\/i>. <i>Will invest<\/i> and <i>would invest<\/i> are not used in the if-clause."}, {"h": "<span class=\"blank\" data-blank><\/span> cities improve public transport, congestion will worsen.", "ans": "Unless <i>(unless = if not)<\/i>", "type": "mcq", "opts": ["If", "Unless", "Although"], "a": 1, "x": "The sentence means <i>if cities do not improve public transport, congestion will worsen<\/i>. <i>Unless<\/i> carries the <i>not<\/i>. <i>If<\/i> needs a negative verb, and <i>although<\/i> shows contrast."}, {"h": "If schools had taught practical skills, fewer graduates <span class=\"blank\" data-blank><\/span> unemployed today.", "ans": "would be <i>(mixed: today needs would + base verb)<\/i>", "type": "mcq", "opts": ["would have been", "will be", "would be"], "a": 2, "x": "<i>Today<\/i> shows a present result, and the if-clause is a past perfect, so this is a mixed conditional. The result is <i>would + base verb<\/i>: <i>would be unemployed<\/i>. <i>Would have been<\/i> refers to the past."}, {"h": "If I <span class=\"blank\" data-blank><\/span> the minister of education, I would reduce class sizes.", "ans": "were <i>(were for every person in formal style)<\/i>", "type": "mcq", "opts": ["were", "was", "would be"], "a": 0, "x": "<i>If I were the minister<\/i> is the standard form for an imagined role in the second conditional. <i>Was<\/i> is informal in writing, and <i>would be<\/i> cannot follow <i>if<\/i>."}, {"h": "<span class=\"blank\" data-blank><\/span> the trend continue, demand will reach 9,000 GWh by 2030.", "ans": "Should <i>(unlikely first conditional inversion)<\/i>", "type": "mcq", "opts": ["Were", "Should", "Had"], "a": 1, "x": "<i>Should + subject + base verb<\/i> is a formal first conditional for a possible event: <i>Should the trend continue<\/i>. <i>Were<\/i> and <i>Had<\/i> do not fit a result with <i>will<\/i>."}, {"h": "<span class=\"blank\" data-blank><\/span> governments acted earlier, the damage would have been smaller.", "ans": "Had <i>(third conditional inversion)<\/i>", "type": "mcq", "opts": ["Were", "Should", "Had"], "a": 2, "x": "<i>Had governments acted earlier<\/i> is an inverted third conditional. The result <i>would have been smaller<\/i> confirms the past. <i>Were<\/i> would need a present or future result, and <i>Should<\/i> is a first conditional."}, {"h": "I wish I <span class=\"blank\" data-blank><\/span> more time to practise speaking.", "ans": "had <i>(wish + past simple)<\/i>", "type": "mcq", "opts": ["had", "would have", "have had"], "a": 0, "x": "<i>I wish I had more time<\/i> uses <i>wish + past simple<\/i> for a present regret. <i>Would have<\/i> and <i>have had<\/i> are not correct after <i>wish<\/i>."}, {"h": "Employees will be more productive provided that they <span class=\"blank\" data-blank><\/span> given flexible hours.", "ans": "are <i>(present simple after provided that)<\/i>", "type": "mcq", "opts": ["will be", "are", "would be"], "a": 1, "x": "<i>Provided that<\/i> is followed by the present simple for a future condition: <i>provided that they are given<\/i>. <i>Will be<\/i> and <i>would be<\/i> are wrong after <i>provided that<\/i>."}, {"h": "The scheme will fail <span class=\"blank\" data-blank><\/span> it receives more funding.", "ans": "unless <i>(unless + clause)<\/i>", "type": "mcq", "opts": ["if not", "without", "unless"], "a": 2, "x": "<i>Unless<\/i> means <i>if not<\/i>: <i>unless it receives more funding<\/i>. <i>If not<\/i> needs a different structure, and <i>without<\/i> must be followed by a noun, not a clause."}, {"h": "If I hadn't missed the bus yesterday, I <span class=\"blank\" data-blank><\/span> late for the test.", "ans": "wouldn't have been <i>(third conditional result)<\/i>", "type": "mcq", "opts": ["wouldn't have been", "wouldn't be", "won't be"], "a": 0, "x": "<i>Yesterday<\/i> and <i>had missed<\/i> show a past condition, so the result uses <i>would not have + past participle<\/i>: <i>wouldn't have been late<\/i>. <i>Wouldn't be<\/i> and <i>won't be<\/i> refer to the present or future."}]}, {"l": "J", "t": "Mixed review: all the types", "i": "Choose the correct option.", "q": [{"h": "If she <span class=\"blank\" data-blank><\/span> harder, she would have passed.", "ans": "had studied <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["had studied", "studied", "would study"], "a": 0, "x": "A third conditional if-clause uses the past perfect: <i>had studied<\/i>. <i>Studied<\/i> is a past simple, and <i>would study<\/i> is not used after <i>if<\/i>."}, {"h": "If I <span class=\"blank\" data-blank><\/span>, I would have helped.", "ans": "had known <i>(no would have in the if-clause)<\/i>", "type": "mcq", "opts": ["would have known", "had known", "knew"], "a": 1, "x": "After <i>if<\/i> in a third conditional, use <i>had + past participle<\/i>: <i>had known<\/i>. <i>Would have known<\/i> in the if-clause is a very common error, and <i>knew<\/i> makes a second conditional."}, {"h": "If he works harder, he <span class=\"blank\" data-blank><\/span>.", "ans": "will pass <i>(do not mix first and second)<\/i>", "type": "mcq", "opts": ["would pass", "would have passed", "will pass"], "a": 2, "x": "The if-clause uses the present simple (<i>works<\/i>), so the result uses <i>will<\/i>: a first conditional. <i>Would pass<\/i> and <i>would have passed<\/i> mix different conditional types."}, {"h": "If the economy improved, unemployment <span class=\"blank\" data-blank><\/span>.", "ans": "would fall <i>(second conditional result)<\/i>", "type": "mcq", "opts": ["would fall", "will fall", "would have fallen"], "a": 0, "x": "<i>If the economy improved<\/i> is a second conditional, so the result is <i>would + base verb<\/i>: <i>would fall<\/i>. <i>Will fall<\/i> mixes types, and <i>would have fallen<\/i> is a third conditional result."}, {"h": "If you <span class=\"blank\" data-blank><\/span>, you would improve.", "ans": "studied <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["would study", "studied", "studying"], "a": 1, "x": "<i>You would improve<\/i> shows a second conditional, so the if-clause uses the past simple: <i>studied<\/i>. <i>Would study<\/i> in the if-clause is wrong, and <i>studying<\/i> is not a finite verb."}, {"h": "If I <span class=\"blank\" data-blank><\/span> the bus, I wouldn't be late now.", "ans": "hadn't missed <i>(mixed: past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["didn't miss", "wouldn't miss", "hadn't missed"], "a": 2, "x": "A past condition with a present result (<i>now<\/i>) is a mixed conditional. The if-clause uses the past perfect: <i>hadn't missed<\/i>. <i>Didn't miss<\/i> and <i>wouldn't miss<\/i> do not give the past perfect form."}, {"h": "If they <span class=\"blank\" data-blank><\/span> earlier, profits would have grown.", "ans": "had invested <i>(past perfect in the if-clause)<\/i>", "type": "mcq", "opts": ["had invested", "would have invested", "invest"], "a": 0, "x": "The result <i>would have grown<\/i> is a third conditional, so the if-clause uses the past perfect: <i>had invested<\/i>. <i>Would have invested<\/i> and <i>invest<\/i> are wrong after <i>if<\/i> here."}, {"h": "She would have passed if she <span class=\"blank\" data-blank><\/span>.", "ans": "had revised <i>(past perfect after if)<\/i>", "type": "mcq", "opts": ["would have revised", "had revised", "revised"], "a": 1, "x": "When the if-clause comes last, the same rule applies: <i>if she had revised<\/i>. <i>Would have revised<\/i> after <i>if<\/i> is wrong, and <i>revised<\/i> does not match <i>would have passed<\/i>."}, {"h": "When I <span class=\"blank\" data-blank><\/span>, I will call you.", "ans": "arrive <i>(present simple after when)<\/i>", "type": "mcq", "opts": ["will arrive", "arrived", "arrive"], "a": 2, "x": "After <i>when<\/i>, use the present simple for a future event: <i>when I arrive<\/i>. <i>Will arrive<\/i> repeats the future, and <i>arrived<\/i> is a past form."}, {"h": "If prices <span class=\"blank\" data-blank><\/span> sharply, many families would cut spending.", "ans": "rose <i>(past simple in the if-clause)<\/i>", "type": "mcq", "opts": ["rose", "would rise", "will rise"], "a": 0, "x": "<i>Many families would cut spending<\/i> shows a second conditional, so the if-clause uses the past simple: <i>rose<\/i>. <i>Would rise<\/i> and <i>will rise<\/i> are wrong after <i>if<\/i> in this sentence."}]}, {"l": "K", "t": "Final check: which sentence is correct?", "i": "Only one sentence is correct. Write A, B, C or D.", "q": [{"h": "A) If governments will invest in transport, congestion will fall.<br>B) If governments would invest in transport, congestion will fall.<br>C) If governments invest in transport, congestion will fall.<br>D) If governments invested in transport, congestion will fall.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: a first conditional with the present simple in the if-clause. A uses <i>will<\/i> in the if-clause, B uses <i>would<\/i> in the if-clause, and D uses a past simple with a <i>will<\/i> result, which mixes second and first."}, {"h": "A) If I had more time, I would study abroad.<br>B) If I would have more time, I would study abroad.<br>C) If I have more time, I would study abroad.<br>D) If I had more time, I will study abroad.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: a second conditional. B uses <i>would have<\/i> in the if-clause. C mixes a present if-clause with <i>would<\/i>. D mixes a past simple if-clause with <i>will<\/i>."}, {"h": "A) If she revised, she would have passed.<br>B) If she would have revised, she would have passed.<br>C) If she has revised, she would have passed.<br>D) If she had revised, she would have passed.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: a third conditional. A uses a past simple in the if-clause. B uses <i>would have<\/i> in the if-clause. C uses a present perfect in the if-clause."}, {"h": "A) Had I knew about the delay, I would have left earlier.<br>B) Had I known about the delay, I would have left earlier.<br>C) Hadn't I known about the delay, I would have left earlier.<br>D) If had I known about the delay, I would have left earlier.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <i>Had + subject + past participle<\/i>. A uses <i>knew<\/i>, C uses <i>Hadn't<\/i> before the subject, and D keeps <i>if<\/i> as well as inverting."}, {"h": "A) Unless prices do not fall, demand will stay weak.<br>B) Unless prices will fall, demand will stay weak.<br>C) Unless prices would fall, demand will stay weak.<br>D) Unless prices fall, demand will stay weak.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: <i>unless<\/i> already means <i>if not<\/i>, so the verb is positive, and the future form is not used. A adds a second negative, B uses <i>will<\/i>, and C uses <i>would<\/i>."}, {"h": "A) If I had studied medicine, I would be a doctor now.<br>B) If I would have studied medicine, I would be a doctor now.<br>C) If I had studied medicine, I would have been a doctor now.<br>D) If I have studied medicine, I would be a doctor now.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: a mixed conditional with a past condition and a present result. B uses a third conditional result with <i>now<\/i>. C uses <i>would have<\/i> in the if-clause. D uses a present perfect in the if-clause."}, {"h": "A) Students must register early, otherwise they will lose their places.<br>B) Students must register early otherwise, they will lose their places.<br>C) Students must register early; otherwise, they will lose their places.<br>D) Students must register early; unless, they will lose their places.", "ans": "C", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 2, "x": "C is correct: <i>otherwise<\/i> needs a semicolon or full stop before it and a comma after it. A uses a comma, B has no punctuation before <i>otherwise<\/i>, and D uses <i>unless<\/i> wrongly."}, {"h": "A) I wish I would have more time.<br>B) I wish I had more time.<br>C) I wish I have more time.<br>D) I wish I will have more time.", "ans": "B", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 1, "x": "B is correct: <i>wish + past simple<\/i> for a regret about the present. A uses <i>would<\/i> for yourself, C uses a present tense, and D uses <i>will<\/i>."}, {"h": "A) Should you need help, please contact us.<br>B) Should you will need help, please contact us.<br>C) If should you need help, please contact us.<br>D) Should you needed help, please contact us.", "ans": "A", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 0, "x": "A is correct: <i>Should + subject + base verb<\/i>. B keeps <i>if<\/i>, C uses <i>will<\/i> after <i>should<\/i>, and D uses a past form after <i>should<\/i>."}, {"h": "A) If he is more careful, he would not have made that error.<br>B) If he would be more careful, he would not have made that error.<br>C) If he be more careful, he would not have made that error.<br>D) If he were more careful, he would not have made that error.", "ans": "D", "type": "mcq", "opts": ["A", "B", "C", "D"], "a": 3, "x": "D is correct: a mixed conditional with a present state in the if-clause (<i>were<\/i>) and a past result. A uses <i>is<\/i>, B uses <i>would be<\/i> after <i>if<\/i>, and C uses <i>be<\/i> in the if-clause."}]}]}, {"n": 8, "title": "Prepositions: Time, Place, Movement and Common Mistakes", "level": "Level 2 · Band 6 to 8", "g": [{"l": "A", "t": "Time: at, on, in", "i": "Choose the correct option.", "q": [{"h": "The lecture starts <span class=\"blank\" data-blank><\/span> 9 am.", "ans": "at <i>(at + clock time)<\/i>", "type": "mcq", "opts": ["at", "in", "on"], "a": 0, "x": "Use <b>at<\/b> for clock times: <i>at 9 am, at noon, at midnight<\/i>. <i>In 9 am<\/i> is a common mistake."}, {"h": "She was born <span class=\"blank\" data-blank><\/span> 2001.", "ans": "in <i>(in + year)<\/i>", "type": "mcq", "opts": ["at", "in", "on"], "a": 1, "x": "Years take <b>in<\/b>: <i>in 2001, in 1999<\/i>. <i>At 2001<\/i> is wrong because at is for exact points such as clock times."}, {"h": "The exam is <span class=\"blank\" data-blank><\/span> Monday.", "ans": "on <i>(on + day)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 2, "x": "Days take <b>on<\/b>: <i>on Monday, on 5 May, on my birthday<\/i>. <i>In Monday<\/i> is a very common error."}, {"h": "I usually revise <span class=\"blank\" data-blank><\/span> the evening.", "ans": "in <i>(in the morning, afternoon, evening)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 0, "x": "Parts of the day take <b>in<\/b>: <i>in the morning, in the afternoon, in the evening<\/i>. Night is the exception: <i>at night<\/i>."}, {"h": "It is very quiet here <span class=\"blank\" data-blank><\/span> night.", "ans": "at <i>(at night)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 1, "x": "<b>At night<\/b> is a fixed phrase. Learn it as the one exception to <i>in the morning, in the afternoon, in the evening<\/i>."}, {"h": "The festival takes place <span class=\"blank\" data-blank><\/span> July.", "ans": "in <i>(in + month)<\/i>", "type": "mcq", "opts": ["at", "on", "in"], "a": 2, "x": "Months take <b>in<\/b>: <i>in July, in March<\/i>. Use on only when you give the date: <i>on 5 July<\/i>."}, {"h": "We meet <span class=\"blank\" data-blank><\/span> Friday mornings.", "ans": "on <i>(on + day + part of day)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 0, "x": "A part of a particular day takes <b>on<\/b>: <i>on Friday mornings, on Monday evening<\/i>. Do not change to in because of the word morning."}, {"h": "Many people travel <span class=\"blank\" data-blank><\/span> the weekend.", "ans": "at <i>(at the weekend (British English))<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 1, "x": "In British English the weekend takes <b>at<\/b>: <i>at the weekend<\/i>. American English says <i>on the weekend<\/i>, but in is never used."}, {"h": "I will see you <span class=\"blank\" data-blank><\/span>.", "ans": "next week <i>(no preposition before next)<\/i>", "type": "mcq", "opts": ["in next week", "on next week", "next week"], "a": 2, "x": "Never put a preposition before <b>next, last, this, every, tomorrow<\/b>. <i>In next week<\/i> is wrong."}, {"h": "He grew up <span class=\"blank\" data-blank><\/span> the 1990s.", "ans": "in <i>(in + decade)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 0, "x": "Decades take <b>in<\/b>: <i>in the 1990s, in the 2000s<\/i>. This is the same rule as years and centuries."}]}, {"l": "B", "t": "Place: at, in, on", "i": "Choose the correct option.", "q": [{"h": "We waited <span class=\"blank\" data-blank><\/span> the bus stop.", "ans": "at <i>(at + a point)<\/i>", "type": "mcq", "opts": ["at", "in", "on"], "a": 0, "x": "<b>At<\/b> shows a point or a stop on a route: <i>at the bus stop, at the door, at the station<\/i>."}, {"h": "She lives <span class=\"blank\" data-blank><\/span> Dhaka.", "ans": "in <i>(in + city)<\/i>", "type": "mcq", "opts": ["at", "in", "on"], "a": 1, "x": "Cities and countries take <b>in<\/b>: <i>in Dhaka, in Bangladesh<\/i>. At is for small points, not for a whole city."}, {"h": "The picture hangs <span class=\"blank\" data-blank><\/span> the wall.", "ans": "on <i>(on + surface)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 2, "x": "A surface takes <b>on<\/b>: <i>on the wall, on the table, on the floor<\/i>. In would mean inside the wall."}, {"h": "I met him <span class=\"blank\" data-blank><\/span> the bus.", "ans": "on <i>(on a bus, in a car)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 0, "x": "You travel <b>on<\/b> a bus, train, plane or bike, but <b>in<\/b> a car or taxi. The reason: you can walk about on public transport."}, {"h": "They travelled to the airport <span class=\"blank\" data-blank><\/span> a taxi.", "ans": "in <i>(in a taxi)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 1, "x": "You sit inside a car or taxi, so it is <b>in a taxi<\/b>. Compare: <i>on a bus<\/i>."}, {"h": "She saw the advert <span class=\"blank\" data-blank><\/span> the internet.", "ans": "on <i>(on the internet)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 2, "x": "We say <b>on the internet, on TV, on the radio, on the phone<\/b>. <i>In the internet<\/i> is a direct translation error."}, {"h": "My flat is <span class=\"blank\" data-blank><\/span> the third floor.", "ans": "on <i>(on a floor)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 0, "x": "Floors of a building take <b>on<\/b>: <i>on the third floor<\/i>. In the third floor would put you inside the floor itself."}, {"h": "He lives <span class=\"blank\" data-blank><\/span> 25 Park Road.", "ans": "at <i>(at + full address)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 1, "x": "A full address (number + street) takes <b>at<\/b>: <i>at 25 Park Road<\/i>. Only the street name alone can take on: <i>on Park Road<\/i>."}, {"h": "My father is <span class=\"blank\" data-blank><\/span> hospital after the accident.", "ans": "in <i>(in hospital (as a patient))<\/i>", "type": "mcq", "opts": ["at", "on", "in"], "a": 2, "x": "A patient is <b>in hospital<\/b> (British English). <i>At hospital<\/i> is used for visiting or working there."}, {"h": "Children play <span class=\"blank\" data-blank><\/span> the garden.", "ans": "in <i>(in a garden)<\/i>", "type": "mcq", "opts": ["in", "on", "at"], "a": 0, "x": "A garden is an area you can be inside, so <b>in the garden<\/b>. On the garden would suggest standing on top of it."}]}, {"l": "C", "t": "Movement and verbs with no preposition", "i": "Choose the correct option.", "q": [{"h": "We arrived <span class=\"blank\" data-blank><\/span> the airport at noon.", "ans": "at <i>(arrive at a place)<\/i>", "type": "mcq", "opts": ["at", "to", "on"], "a": 0, "x": "Use <b>arrive at<\/b> for a building or small place such as an airport, station or hotel. <i>Arrive to<\/i> is always wrong."}, {"h": "She arrived <span class=\"blank\" data-blank><\/span> London yesterday.", "ans": "in <i>(arrive in a city)<\/i>", "type": "mcq", "opts": ["to", "in", "on"], "a": 1, "x": "Use <b>arrive in<\/b> for a city or country: <i>arrived in London, arrived in Japan<\/i>. Never use to after arrive."}, {"h": "Many students go <span class=\"blank\" data-blank><\/span> after class.", "ans": "home <i>(home needs no preposition)<\/i>", "type": "mcq", "opts": ["to home", "at home", "home"], "a": 2, "x": "<b>Home<\/b> works like an adverb, so no preposition: <i>go home, come home, get home<\/i>. <i>Go to home<\/i> is a common error."}, {"h": "Students <span class=\"blank\" data-blank><\/span> the hall quietly.", "ans": "entered <i>(enter takes no preposition)<\/i>", "type": "mcq", "opts": ["entered", "entered into", "entered in"], "a": 0, "x": "<b>Enter<\/b> takes its object directly: <i>enter the room<\/i>. <i>Enter into<\/i> is used only for agreements: <i>enter into a contract<\/i>."}, {"h": "They <span class=\"blank\" data-blank><\/span> the new plan.", "ans": "discussed <i>(discuss takes no preposition)<\/i>", "type": "mcq", "opts": ["discussed about", "discussed", "discussed on"], "a": 1, "x": "<b>Discuss<\/b> takes its object directly. <i>Discuss about<\/i> is one of the most common errors; compare <i>talk about<\/i>."}, {"h": "We <span class=\"blank\" data-blank><\/span> the top by noon.", "ans": "reached <i>(reach takes no preposition)<\/i>", "type": "mcq", "opts": ["reached to", "reached at", "reached"], "a": 2, "x": "<b>Reach<\/b> means arrive at and needs no preposition: <i>reach the top, reach Dhaka<\/i>. <i>Reach to<\/i> is wrong."}, {"h": "She <span class=\"blank\" data-blank><\/span> a doctor last year.", "ans": "married <i>(marry takes no preposition)<\/i>", "type": "mcq", "opts": ["married", "married with", "married to"], "a": 0, "x": "<b>Marry<\/b> takes its object directly: <i>She married a doctor<\/i>. The adjective form needs to: <i>She is married to a doctor<\/i>."}, {"h": "He <span class=\"blank\" data-blank><\/span> to his country in May.", "ans": "returned <i>(return already means come back)<\/i>", "type": "mcq", "opts": ["returned back", "returned", "went back again"], "a": 1, "x": "<b>Return<\/b> already means come back, so <i>return back<\/i> is redundant. The preposition after it is to: <i>returned to his country<\/i>."}, {"h": "The train goes <span class=\"blank\" data-blank><\/span> a long tunnel.", "ans": "through <i>(through a tunnel)<\/i>", "type": "mcq", "opts": ["across", "over", "through"], "a": 2, "x": "<b>Through<\/b> means from one end to the other inside something enclosed, such as a tunnel. Across is for surfaces."}, {"h": "Please <span class=\"blank\" data-blank><\/span> the office.", "ans": "contact <i>(contact takes no preposition)<\/i>", "type": "mcq", "opts": ["contact", "contact with", "contact to"], "a": 0, "x": "<b>Contact<\/b> takes its object directly: <i>contact the office<\/i>. <i>Contact with<\/i> is only a noun phrase: <i>in contact with<\/i>."}]}, {"l": "E", "t": "For, since, during, by, until, within", "i": "Choose the correct option.", "q": [{"h": "I have lived here <span class=\"blank\" data-blank><\/span> five years.", "ans": "for <i>(for + length of time)<\/i>", "type": "mcq", "opts": ["for", "since", "during"], "a": 0, "x": "<b>For<\/b> answers how long: <i>for five years, for two hours<\/i>. Since needs a starting point, not a length."}, {"h": "She has worked here <span class=\"blank\" data-blank><\/span> 2019.", "ans": "since <i>(since + starting point)<\/i>", "type": "mcq", "opts": ["for", "since", "from"], "a": 1, "x": "<b>Since<\/b> needs a starting point: <i>since 2019, since Monday, since I was a child<\/i>. For needs a length of time."}, {"h": "Please stay quiet <span class=\"blank\" data-blank><\/span> the lecture.", "ans": "during <i>(during + noun)<\/i>", "type": "mcq", "opts": ["while", "for", "during"], "a": 2, "x": "<b>During<\/b> is followed by a noun: <i>during the lecture, during the war<\/i>. While is followed by a clause."}, {"h": "Please stay quiet <span class=\"blank\" data-blank><\/span> the teacher is speaking.", "ans": "while <i>(while + clause)<\/i>", "type": "mcq", "opts": ["while", "during", "for"], "a": 0, "x": "<b>While<\/b> is followed by a clause with a subject and verb: <i>while the teacher is speaking<\/i>. During needs a noun."}, {"h": "Submit your essay <span class=\"blank\" data-blank><\/span> Friday at the latest.", "ans": "by <i>(by = a deadline)<\/i>", "type": "mcq", "opts": ["until", "by", "within"], "a": 1, "x": "<b>By<\/b> means not later than: it is a deadline. <i>Submit it by Friday<\/i> means any time up to Friday."}, {"h": "I will wait here <span class=\"blank\" data-blank><\/span> the bus arrives.", "ans": "until <i>(until = continuing up to)<\/i>", "type": "mcq", "opts": ["by", "within", "until"], "a": 2, "x": "<b>Until<\/b> means the action continues up to that time. <i>Wait until the bus arrives<\/i> means you stay until it does."}, {"h": "You will get a reply <span class=\"blank\" data-blank><\/span> two working days.", "ans": "within <i>(within = before the end of)<\/i>", "type": "mcq", "opts": ["within", "on", "at"], "a": 0, "x": "<b>Within<\/b> means before the end of a period: <i>within two days<\/i> means any time inside those two days."}, {"h": "I moved to Dhaka two years <span class=\"blank\" data-blank><\/span>.", "ans": "ago <i>(ago + past simple)<\/i>", "type": "mcq", "opts": ["before", "ago", "since"], "a": 1, "x": "<b>Ago<\/b> counts back from now and goes with the past simple: <i>two years ago<\/i>. Never put it before the time."}, {"h": "Sales rose <span class=\"blank\" data-blank><\/span> 2010 and 2020.", "ans": "between <i>(between ... and)<\/i>", "type": "mcq", "opts": ["from", "during", "between"], "a": 2, "x": "Use <b>between ... and<\/b> as a pair for a period: <i>between 2010 and 2020<\/i>. <i>Between 2010 to 2020<\/i> mixes two patterns."}, {"h": "Prices fell <span class=\"blank\" data-blank><\/span> the whole year.", "ans": "throughout <i>(throughout = the whole of)<\/i>", "type": "mcq", "opts": ["throughout", "by", "at"], "a": 0, "x": "<b>Throughout<\/b> means in every part of a period. <i>Prices fell throughout the year<\/i> means the fall lasted the whole year."}]}, {"l": "F", "t": "Fixed phrases with at and by", "i": "Choose the correct option.", "q": [{"h": "Thousands of jobs are <span class=\"blank\" data-blank><\/span> risk.", "ans": "at <i>(at risk)<\/i>", "type": "mcq", "opts": ["at", "in", "on"], "a": 0, "x": "<b>At risk<\/b> is a fixed phrase meaning in danger. <i>In risk<\/i> is a translation error."}, {"h": "I am revising <span class=\"blank\" data-blank><\/span> the moment.", "ans": "at <i>(at the moment)<\/i>", "type": "mcq", "opts": ["in", "at", "on"], "a": 1, "x": "<b>At the moment<\/b> means now. Learn it with at present and currently."}, {"h": "He broke the window <span class=\"blank\" data-blank><\/span> accident.", "ans": "by <i>(by accident)<\/i>", "type": "mcq", "opts": ["with", "in", "by"], "a": 2, "x": "<b>By accident<\/b> means not on purpose. <i>With accident<\/i> and <i>in accident<\/i> are wrong."}, {"h": "She took my bag <span class=\"blank\" data-blank><\/span> mistake.", "ans": "by <i>(by mistake)<\/i>", "type": "mcq", "opts": ["by", "with", "in"], "a": 0, "x": "<b>By mistake<\/b> means in error. It is paired with by accident and by chance."}, {"h": "We met <span class=\"blank\" data-blank><\/span> chance in Paris.", "ans": "by <i>(by chance)<\/i>", "type": "mcq", "opts": ["in", "by", "on"], "a": 1, "x": "<b>By chance<\/b> means unplanned or lucky. Other by-phrases: by accident, by mistake, by hand."}, {"h": "The carpets are made <span class=\"blank\" data-blank><\/span> hand.", "ans": "by <i>(by hand)<\/i>", "type": "mcq", "opts": ["with", "on", "by"], "a": 2, "x": "<b>By hand<\/b> means not by machine. Never add an s: <i>by hands<\/i> is wrong."}, {"h": "Helmets are required <span class=\"blank\" data-blank><\/span> law.", "ans": "by <i>(by law)<\/i>", "type": "mcq", "opts": ["by", "with", "on"], "a": 0, "x": "<b>By law<\/b> means legally required. Compare: <i>against the law<\/i> means illegal."}, {"h": "It is <span class=\"blank\" data-blank><\/span> far the best option.", "ans": "by <i>(by far)<\/i>", "type": "mcq", "opts": ["for", "by", "with"], "a": 1, "x": "<b>By far<\/b> strengthens a superlative: <i>by far the best, by far the largest<\/i>."}, {"h": "Learn the list <span class=\"blank\" data-blank><\/span> heart.", "ans": "by <i>(by heart)<\/i>", "type": "mcq", "opts": ["with", "in", "by"], "a": 2, "x": "<b>By heart<\/b> means from memory. It is the natural way to say that you have memorised something."}, {"h": "Names were chosen <span class=\"blank\" data-blank><\/span> random.", "ans": "at <i>(at random)<\/i>", "type": "mcq", "opts": ["at", "by", "in"], "a": 0, "x": "<b>At random<\/b> means without a plan or pattern. <i>By random<\/i> is wrong."}]}, {"l": "G", "t": "Fixed phrases with in, on, out of, under", "i": "Choose the correct option.", "q": [{"h": "She is <span class=\"blank\" data-blank><\/span> charge of the project.", "ans": "in <i>(in charge of)<\/i>", "type": "mcq", "opts": ["in", "on", "at"], "a": 0, "x": "<b>In charge of<\/b> means responsible for. No <i>the<\/i>, and the preposition after it is of."}, {"h": "Book your tickets <span class=\"blank\" data-blank><\/span> advance.", "ans": "in <i>(in advance)<\/i>", "type": "mcq", "opts": ["on", "in", "at"], "a": 1, "x": "<b>In advance<\/b> means beforehand. Compare: <i>in time<\/i> means early enough."}, {"h": "Crime is <span class=\"blank\" data-blank><\/span> the rise.", "ans": "on <i>(on the rise)<\/i>", "type": "mcq", "opts": ["in",
