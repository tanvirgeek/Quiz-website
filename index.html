<title>IELTS Grammar Quiz: Road to Band 8</title>
<meta name="description" content="Free IELTS grammar quizzes from beginner to Band 8, one for every lecture sheet. IELTS &amp; GRE with Tanvir, BUET.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sheet picker grouped by level, then one large question card per screen for screen recording. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F8; --ink:#14171F; --text:#1F2530; --muted:#4F5969; --line:#D5DAE1;
  --accent:#C24E16; --accent-ink:#FFFFFF; --tint:#FCEFE6;
  --good:#1B7448; --good-bg:#E4F3EA; --bad:#B3261E; --bad-bg:#FBE9E7;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181C23; --ink:#F2F4F7; --text:#E3E7ED; --muted:#A8B1BF; --line:#2E3541;
  --accent:#F08A52; --accent-ink:#1A1109; --tint:#2A1D15;
  --good:#6CCB97; --good-bg:#14281D; --bad:#F59A92; --bad-bg:#2B1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181C23; --ink:#F2F4F7; --text:#E3E7ED; --muted:#A8B1BF; --line:#2E3541;
  --accent:#F08A52; --accent-ink:#1A1109; --tint:#2A1D15;
  --good:#6CCB97; --good-bg:#14281D; --bad:#F59A92; --bad-bg:#2B1715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
u{text-decoration-thickness:3px;text-decoration-color:var(--accent);text-underline-offset:5px}

/* home */
.top{display:flex;align-items:center;gap:12px;padding-block:20px}
.top img{width:44px;height:44px;border-radius:10px}
.top b{display:block;font-size:15px;color:var(--ink);line-height:1.2}
.top span{font-size:13px;color:var(--muted)}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:8px 0 8px;color:var(--ink);letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 28px;color:var(--muted);max-width:60ch}
.level{margin-block:0 36px}
.level h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;font-weight:600;
  display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.level h2 em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;min-width:0;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile .n{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tile .t{font-weight:600;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.tile .sc{margin-top:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.done .sc{color:var(--good);font-weight:600}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.bar-title{font-weight:600;color:var(--ink);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-title small{color:var(--muted);font-weight:500;margin-right:6px}
.count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);white-space:nowrap}
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--accent)}
.card{margin-top:28px}
.gh{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
.gh span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:14px}
.gi{color:var(--muted);margin:6px 0 0;font-size:15.5px}
.q{font-size:clamp(24px,3.8vw,38px);line-height:1.4;color:var(--ink);margin:30px 0 28px;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.q .qn{color:var(--accent);font-weight:700;margin-right:12px;font-variant-numeric:tabular-nums}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 .12em;text-align:center;padding:0 .2em;font-weight:700}
.blank.ok{color:var(--good);border-color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border:2px solid var(--line);background:var(--surface);
  border-radius:12px;font-size:clamp(19px,2.4vw,24px);font-weight:500;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.opt kbd{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);
  background:var(--bg);font:600 13px var(--font);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{margin-top:22px;padding:16px 18px;border-radius:12px;font-size:clamp(17px,2.2vw,22px);line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.fb.ok{background:var(--good-bg);border-left:6px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb.ans{background:var(--tint);border-left:6px solid var(--accent)}
.fb b.lab{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.fb.ok b.lab{color:var(--good)} .fb.no b.lab{color:var(--bad)} .fb.ans b.lab{color:var(--accent)}
.fb i{color:var(--muted);font-size:.85em}
.act{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-bottom:40px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 24px;font-size:18px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--muted);font-size:13.5px;align-self:center}

/* result */
.res{text-align:center;padding-block:40px}
.big{font-size:clamp(64px,14vw,120px);font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.38em;color:var(--muted);font-weight:500}
.verdict{font-size:clamp(20px,3vw,28px);margin:14px auto 24px;max-width:28ch;color:var(--ink);text-wrap:balance}
.res .act{justify-content:center}
.rev{text-align:left;margin-top:12px;display:grid;gap:10px}
.rev h3{margin:28px 0 4px;font-size:15px;color:var(--ink)}
.ri{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere}
.ri small{color:var(--accent);font-weight:700;margin-right:8px}
.ri div+div{margin-top:6px;color:var(--good);font-weight:500}
@media (prefers-reduced-motion:no-preference){.opt,.tile,.btn{transition:border-color .12s,background .12s}}
</style>

 "There is <span class=\"blank\" data-blank><\/span> pollution in villages.", "ans": "less <i>(pollution is uncountable)<\/i>", "type": "mcq", "opts": ["fewer", "less"], "a": 1}, {"h": "A <span class=\"blank\" data-blank><\/span> of problems remain.", "ans": "number <i>(problems is countable)<\/i>", "type": "mcq", "opts": ["number", "amount"], "a": 0}, {"h": "A great <span class=\"blank\" data-blank><\/span> of research supports this idea.", "ans": "deal <i>(a great deal of + uncountable)<\/i>", "type": "mcq", "opts": ["deal", "number"], "a": 0}, {"h": "I need <span class=\"blank\" data-blank><\/span> advice about my course.", "ans": "a little <i>(advice is uncountable)<\/i>", "type": "mcq", "opts": ["a little", "a few"], "a": 0}, {"h": "She made <span class=\"blank\" data-blank><\/span> friends at university.", "ans": "a few <i>(friends is a countable plural)<\/i>", "type": "mcq", "opts": ["a little", "a few"], "a": 1}, {"h": "<span class=\"blank\" data-blank><\/span> options are available.", "ans": "Several <i>(only with a countable plural)<\/i>", "type": "mcq", "opts": ["Several", "Much"], "a": 0}, {"h": "<span class=\"blank\" data-blank><\/span> options are valid.", "ans": "Both <i>(two countable options)<\/i>", "type": "mcq", "opts": ["Both", "Much"], "a": 0}, {"h": "<span class=\"blank\" data-blank><\/span> student must register.", "ans": "Every <i>(every + singular noun)<\/i>", "type": "mcq", "opts": ["Every", "All"], "a": 0}, {"h": "Each <span class=\"blank\" data-blank><\/span> has a desk.", "ans": "student <i>(each + singular noun)<\/i>", "type": "mcq", "opts": ["student", "students"], "a": 0}, {"h": "One of the main <span class=\"blank\" data-blank><\/span> is cost.", "ans": "reasons <i>(one of the + plural noun)<\/i>", "type": "mcq", "opts": ["reason", "reasons"], "a": 1}, {"h": "<span class=\"blank\" data-blank><\/span> time remains.", "ans": "Plenty of <i>(both types; several needs a countable plural)<\/i>", "type": "mcq", "opts": ["Plenty of", "Severa const LEVELS=[["Level 1 · Foundation","Sheets 1 to 10",1,10],["Level 2 · Intermediate","Sheets 11 to 23",11,23],
  ["Level 3 · Advanced","Sheets 24 to 35",24,35],["Level 4 · IELTS Application","Sheets 36 to 40",36,40],["Bonus quizzes","Quantity words, from Sheet 02",41,42]];
const app=document.getElementById("app");
let best={};
try{best=JSON.parse(localStorage.getItem("tanvir-quiz-best")||"{}")||{}}catch(e){best={}}
function saveBest(n,s){ if((best[n]||0)<s){best[n]=s; try{localStorage.setItem("tanvir-quiz-best",JSON.stringify(best))}catch(e){}} }
const pad=n=>String(n).padStart(2,"0");
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
let S=null,qs=[],idx=0,res=[],locked=false,revealed=false;

function home(){
  S=null; window.scrollTo(0,0);
  let h=`<div class="top"><img src="${LOGO}" alt=""><div><b>IELTS &amp; GRE with Tanvir</b><span>BUET</span></div></div>
  <h1>IELTS Grammar Quiz: Road to Band 8</h1>
  <p class="lede">40 quizzes, one for each lecture sheet. Each quiz has 30 questions that match the exercises in the PDF (Sheets 02 to 05 have more: 80, 100, 100 and 100, plus bonus quizzes on quantity words). Choose a sheet to begin.</p>`;
  for(const [name,range,a,b] of LEVELS){
    h+=`<section class="level"><h2>${name}<em>${range}</em></h2><div class="grid">`;
    for(const s of DATA.filter(x=>x.n>=a&&x.n<=b)){
      const sc=best[s.n], tot=s.g.reduce((a,g)=>a+g.q.length,0);
      h+=`<button class="tile${sc!=null?" done":""}" data-n="${s.n}"><span class="n">${s.tag||"SHEET "+pad(s.n)}</span><span class="t">${s.title}</span><span class="sc">${sc!=null?"Best: "+sc+" / "+tot:tot+" questions"}</span></button>`;
    }
    h+=`</div></section>`;
  }
  app.innerHTML=h;
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>start(+t.dataset.n));
}

function start(n){
  S=DATA.find(x=>x.n===n); qs=[];
  S.g.forEach(g=>g.q.forEach(q=>qs.push({...q,g})));
  idx=0; res=qs.map(()=>null); render(); window.scrollTo(0,0);
}

function segs(){return res.map((r,i)=>`<i class="${i===idx&&r===null?"cur":r===true?"ok":r===false?"no":""}"></i>`).join("")}

function render(){
  locked=false; revealed=false;
  const q=qs[idx], g=q.g, num=idx+1;
  let h=`<div class="bar"><div class="bar-row"><button class="back" id="back">All quizzes</button>
    <div class="bar-title"><small>${S.tag||"SHEET "+pad(S.n)}</small>${S.title}</div><div class="count">${idx+1} / ${qs.length}</div></div>
    <div class="segs">${segs()}</div></div>
  <div class="card"><div class="gh"><span>${g.l}</span>${g.t}</div><p class="gi">${g.i}</p>
  <div class="q"><span class="qn">${num}.</span>${q.h}</div>`;
  if(q.type==="mcq"){
    h+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join("")}</div>`;
  }
  h+=`<div id="fb"></div><div class="act" id="act"></div></div>`;
  app.innerHTML=h;
  document.getElementById("back").onclick=home;
  if(q.type==="mcq"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    document.getElementById("act").innerHTML=`<span class="hint">Press ${q.opts.length>1?"1 to "+q.opts.length:"1"} to choose</span>`;
  }else{
    document.getElementById("act").innerHTML=`<button class="btn primary" id="show">Show answer</button><span class="hint">Say your answer first, then reveal. Press Space.</span>`;
    document.getElementById("show").onclick=reveal;
  }
}

function note(a){ // split italic note from the main answer
  const m=a.match(/^(.*?)\s*(<i>.*<\/i>)\s*$/); return m?[m[1],m[2]]:[a,""];
}
function nextBtn(){
  const last=idx===qs.length-1;
  return `<button class="btn primary" id="next">${last?"See score":"Next question"}</button><span class="hint">Press Enter</span>`;
}
function pick(i){
  if(locked) return; locked=true;
  const q=qs[idx], ok=i===q.a; res[idx]=ok;
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true; if(k===q.a)b.classList.add("right"); else if(k===i)b.classList.add("wrong"); else b.classList.add("dim");});
  const bl=app.querySelector("[data-blank]"); if(bl){bl.innerHTML=q.opts[q.a]; bl.classList.add("ok");}
  const [m,n]=note(q.ans);
  document.getElementById("fb").innerHTML=ok
    ?`<div class="fb ok"><b class="lab">Correct</b>${m}${n?" "+n:""}</div>`
    :`<div class="fb no"><b class="lab">Not quite</b>Correct answer: <b>${m}</b>${n?" "+n:""}</div>`;
  document.getElementById("act").innerHTML=nextBtn();
  document.getElementById("next").onclick=advance;
  document.getElementById("next").focus({preventScroll:true});
  updateSegs();
}
function reveal(){
  if(revealed) return; revealed=true;
  document.getElementById("fb").innerHTML=`<div class="fb ans"><b class="lab">Answer</b>${qs[idx].ans}</div>`;
  document.getElementById("act").innerHTML=`<button class="btn good" id="got">I got it</button><button class="btn bad" id="miss">Not yet</button><span class="hint">Press G or M</span>`;
  document.getElementById("got").onclick=()=>mark(true);
  document.getElementById("miss").onclick=()=>mark(false);
}
function mark(ok){
  if(res[idx]!==null&&locked) return; locked=true; res[idx]=ok; updateSegs();
  document.getElementById("act").innerHTML=nextBtn();
  document.getElementById("next").onclick=advance;
  document.getElementById("next").focus({preventScroll:true});
}
function updateSegs(){const s=app.querySelector(".segs"); if(s) s.innerHTML=segs();}
function advance(){ if(idx<qs.length-1){idx++;render();window.scrollTo(0,0)} else finish(); }

function finish(){
  const score=res.filter(r=>r===true).length; saveBest(S.n,score);
  const pct=score/qs.length;
  const v=pct>=0.85?"Excellent. You are ready for the next sheet.":pct>=0.65?"Good. Revise the rules and retry the ones you missed.":"Re-watch the lecture, study the sheet again, then retry.";
  const missed=qs.map((q,i)=>[q,i]).filter(([q,i])=>res[i]!==true);
  let h=`<div class="bar"><div class="bar-row"><button class="back" id="back">All quizzes</button>
    <div class="bar-title"><small>${S.tag||"SHEET "+pad(S.n)}</small>${S.title}</div><div class="count">Done</div></div></div>
  <div class="res"><div class="big">${score}<small> / ${qs.length}</small></div><p class="verdict">${v}</p>
  <div class="act"><button class="btn primary" id="retry">Try again</button>${S.n<40?`<button class="btn" id="nx">Next quiz</button>`:""}<button class="btn" id="all">All quizzes</button></div>`;
  if(missed.length){
    h+=`<div class="rev"><h3>Review: ${missed.length} to revisit</h3>`+missed.map(([q,i])=>{
      const [m]=note(q.ans);
      const stem=q.h.replace(/<span class="blank"[^>]*><\/span>/,`<b>${q.opts?q.opts[q.a]:""}</b>`);
      return `<div class="ri"><div><small>Q${i+1}</small>${stem}</div><div>${m}</div></div>`}).join("")+`</div>`;
  }
  h+=`</div>`; app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("back").onclick=home; document.getElementById("all").onclick=home;
  document.getElementById("retry").onclick=()=>start(S.n);
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>start(S.n+1);
}

document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey) return;
  const q=qs[idx]; if(!q||document.querySelector(".res")) return;
  const k=e.key;
  if(q.type==="mcq"&&!locked&&/^[1-9]$/.test(k)&&+k<=q.opts.length){pick(+k-1);e.preventDefault();return}
  if(q.type==="reveal"&&!revealed&&(k===" "||k==="Enter")){reveal();e.preventDefault();return}
  if(q.type==="reveal"&&revealed&&!locked){ if(k==="g"||k==="G"){mark(true);return} if(k==="m"||k==="M"){mark(false);return} }
  if(locked&&(k==="Enter"||k==="ArrowRight")){advance();e.preventDefault()}
});
const h0=(location.hash||"").match(/^#s(\d+)$/);
if(h0&&DATA.find(x=>x.n===+h0[1])) start(+h0[1]); else home();
</script>
